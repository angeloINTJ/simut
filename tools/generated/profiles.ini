; profiles.ini — GERADO por tools/gen_features.py a partir de tools/features.toml.
; NAO EDITE A MAO. Rode `python3 tools/gen_features.py` depois de mudar o manifesto.
; tools/check_features.py prova que estes ambientes resolvem para o mesmo que os
; [env:*] escritos a mao no platformio.ini (passo P1 de MODELO_DE_RECURSOS.md).
;
; Ainda NAO incluido por platformio.ini: a troca (extra_configs + remocao dos
; [env:*] a mao) e o passo seguinte, depois que a prova byte-a-byte de build
; passar. Ate la este arquivo e a evidencia, nao a fonte do build.

[env:pico_w_release]
extends = pico_base
build_type = release
build_flags = ${pico_base.build_flags}
    -DNDEBUG
    -DSIMUT_CLI_FULL=0
    -DSIMUT_WEB_HTTPS=1
    -DSIMUT_FACTORY_RESET=1
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
lib_ignore =
    SerialBT

[env:pico_w_test]
extends = pico_base
build_type = release
build_flags = ${pico_base.build_flags}
    -DNDEBUG
    -DSIMUT_CLI_FULL=1
    -DSIMUT_LICENSE_STUB=1
    -DSIMUT_MDNS=0
    -DSIMUT_FACTORY_RESET=1
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
lib_ignore =
    SerialBT

[env:pico_w_test_https]
extends = pico_base
build_type = release
build_flags = ${pico_base.build_flags}
    -DNDEBUG
    -DSIMUT_CLI_FULL=1
    -DSIMUT_WEB_HTTPS=1
    -DSIMUT_LICENSE_STUB=1
    -DSIMUT_MDNS=0
    -DSIMUT_FACTORY_RESET=1
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
lib_ignore =
    SerialBT
custom_fs_pages = ALARMS_PAGE, FILE_PAGE, TEL_PAGE

[env:pico_w_asserts]
extends = pico_base
build_type = release
build_flags = ${pico_base.build_flags}
    -DNDEBUG
    -DSIMUT_CLI_FULL=0
    -DSIMUT_WEB_HTTPS=1
    -DSIMUT_FACTORY_RESET=1
    -DSIMUT_CONCURRENCY_ASSERTS
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
lib_ignore =
    SerialBT

[env:pico_w_alpha]
extends = pico_base
build_flags = ${pico_base.build_flags}
    -DNDEBUG
    -DSIMUT_DISPLAY_TFT=0
    -DSIMUT_DISPLAY_ALPHA=1
    -DHD44780_MODE_PARALLEL=1
    -DSIMUT_CLI_FULL=0
    -DSIMUT_MDNS=0
    -DSIMUT_BLUETOOTH=1
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Touch.cpp>
    -<DisplayManager_Settings.cpp>
    -<DisplayManager_Graph.cpp>
    -<DisplayManager_Dashboard.cpp>
    -<DisplayManager_Calibration.cpp>
    -<DisplayManager_Auth.cpp>
    -<DisplayManager_Alarm.cpp>
    -<DisplayManager_Calendar.cpp>
    -<DisplayManager_Fonts.cpp>
    -<DisplayManager_i18n.cpp>
    -<DisplayManager_LangParser.cpp>
    -<AppManager_Graph.cpp>
    +<DisplayManager_Alpha.cpp>
lib_ignore =
    Adafruit ILI9341
    Adafruit GFX Library
    XPT2046_Touchscreen
custom_web_omit = tft

[env:pico_w_air]
extends = pico_base
build_flags = ${pico_base.build_flags}
    -DNDEBUG
    -DSIMUT_DISPLAY_TFT=0
    -DSIMUT_DISPLAY_ALPHA=0
    -DSIMUT_CLI_FULL=1
    -DSIMUT_LICENSE_STUB=1
    -DSIMUT_MDNS=0
    -DSIMUT_BLUETOOTH=1
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    -DSIMUT_AIR=1
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Touch.cpp>
    -<DisplayManager_Settings.cpp>
    -<DisplayManager_Graph.cpp>
    -<DisplayManager_Dashboard.cpp>
    -<DisplayManager_Calibration.cpp>
    -<DisplayManager_Auth.cpp>
    -<DisplayManager_Alarm.cpp>
    -<DisplayManager_Calendar.cpp>
    -<DisplayManager_Fonts.cpp>
    -<AppManager_Graph.cpp>
    -<DisplayManager.cpp>
    -<DisplayManager_Alpha.cpp>
    -<SoundManager.cpp>
    +<DisplayManager_None.cpp>
    +<air/*.c>
lib_ignore =
    Adafruit ILI9341
    Adafruit GFX Library
    XPT2046_Touchscreen
    BuzzerPIO_RP2040
custom_web_omit = tft
