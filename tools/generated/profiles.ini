[env:pico_w_alpha]
extends = pico_base
build_flags = ${pico_base.build_flags}
    -DNDEBUG
    -DSIMUT_DISPLAY_TFT=0
    -DSIMUT_DISPLAY_ALPHA=1
    -DHD44780_MODE_PARALLEL=1
    -DSIMUT_CLI_FULL=0
    -DSIMUT_MDNS=0
    -DSIMUT_BLUETOOTH=1
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    -DSIMUT_TFT_GRAPH=0
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Touch.cpp>
    -<DisplayManager_Settings.cpp>
    -<DisplayManager_Graph.cpp>
    -<DisplayManager_Dashboard.cpp>
    -<DisplayManager_Calibration.cpp>
    -<DisplayManager_Auth.cpp>
    -<DisplayManager_Alarm.cpp>
    -<DisplayManager_Calendar.cpp>
    -<DisplayManager_Fonts.cpp>
    -<DisplayManager_i18n.cpp>
    -<DisplayManager_LangParser.cpp>
    -<AppManager_Graph.cpp>
    -<DisplayManager_Ota.cpp>
    -<ConcurrencyAsserts.cpp>
    -<net/NetworkManager_Wired.cpp>
    -<net/WiredLink.cpp>
    +<DisplayManager_Alpha.cpp>
lib_ignore =
    Adafruit ILI9341
    Adafruit GFX Library
    XPT2046_Touchscreen
custom_web_omit = tft, slot

[env:pico_w_air]
extends = pico_base
build_flags = ${pico_base.build_flags}
    -DNDEBUG
    -DSIMUT_DISPLAY_TFT=0
    -DSIMUT_DISPLAY_ALPHA=0
    -DSIMUT_CLI_FULL=1
    -DSIMUT_LICENSE_STUB=1
    -DSIMUT_MDNS=0
    -DSIMUT_BLUETOOTH=1
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    -DSIMUT_AIR=1
    -DSIMUT_SOUND_BUZZER=0
    -DSIMUT_TFT_GRAPH=0
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Touch.cpp>
    -<DisplayManager_Settings.cpp>
    -<DisplayManager_Graph.cpp>
    -<DisplayManager_Dashboard.cpp>
    -<DisplayManager_Calibration.cpp>
    -<DisplayManager_Auth.cpp>
    -<DisplayManager_Alarm.cpp>
    -<DisplayManager_Calendar.cpp>
    -<DisplayManager_Fonts.cpp>
    -<AppManager_Graph.cpp>
    -<DisplayManager.cpp>
    -<DisplayManager_Alpha.cpp>
    -<DisplayManager_Ota.cpp>
    -<ConcurrencyAsserts.cpp>
    -<SoundManager.cpp>
    -<net/NetworkManager_Wired.cpp>
    -<net/WiredLink.cpp>
    +<DisplayManager_None.cpp>
    +<air/*.c>
lib_ignore =
    Adafruit ILI9341
    Adafruit GFX Library
    XPT2046_Touchscreen
    BuzzerPIO_RP2040
custom_web_omit = tft, slot

[env:pico2_w_release]
extends = pico_base
board = rpipico2w
board_build.ldscript = tools/rp2350/memmap_slot.ld
board_build.filesystem_size = 1020k
build_type = release
build_flags = ${pico_base.build_flags}
    -DNDEBUG
    -Wno-error=overloaded-virtual
    -DSIMUT_CLI_FULL=0
    -DSIMUT_WEB_HTTPS=1
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<ConcurrencyAsserts.cpp>
    -<BluetoothManager.cpp>
    -<net/NetworkManager_Wired.cpp>
    -<net/WiredLink.cpp>
lib_ignore =
    SerialBT

[env:pico_wire]
extends = pico_base
board = rpipico
build_flags = ${pico_base.build_flags}
    -DNDEBUG
    -DSIMUT_DISPLAY_TFT=0
    -DSIMUT_DISPLAY_ALPHA=1
    -DHD44780_MODE_PARALLEL=1
    -DSIMUT_CLI_FULL=0
    -DSIMUT_MDNS=0
    -DSIMUT_SENSOR_DS18B20=0
    -DSIMUT_TFT_GRAPH=0
    -DSIMUT_NET_ENC28J60=1
    -DMAX_SENSORS=11
    -DSIMUT_OTA_TRUST_BENCH=1
build_unflags =
    -DPICO_CYW43_SUPPORTED=1
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Touch.cpp>
    -<DisplayManager_Settings.cpp>
    -<DisplayManager_Graph.cpp>
    -<DisplayManager_Dashboard.cpp>
    -<DisplayManager_Calibration.cpp>
    -<DisplayManager_Auth.cpp>
    -<DisplayManager_Alarm.cpp>
    -<DisplayManager_Calendar.cpp>
    -<DisplayManager_Fonts.cpp>
    -<DisplayManager_i18n.cpp>
    -<DisplayManager_LangParser.cpp>
    -<AppManager_Graph.cpp>
    -<DisplayManager_Ota.cpp>
    -<ConcurrencyAsserts.cpp>
    -<BluetoothManager.cpp>
    -<net/NetworkManager_Cyw43.cpp>
    +<DisplayManager_Alpha.cpp>
lib_ignore =
    Adafruit ILI9341
    Adafruit GFX Library
    XPT2046_Touchscreen
    SerialBT
lib_deps = ${pico_base.lib_deps}
    https://github.com/angeloINTJ/pico-enc28j60.git#4984e2f55727c81cfd6a548c7d4728942192107a
custom_web_omit = tft, slot, wifi, slots16

