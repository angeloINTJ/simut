; profiles.ini — GERADO por tools/gen_features.py a partir de tools/features.toml.
; NAO EDITE A MAO. Rode `python3 tools/gen_features.py` depois de mudar o manifesto.
;
; Este arquivo E a fonte dos nove ambientes de firmware: o platformio.ini o inclui
; via `extra_configs` e nao define mais [env:pico_w_*] nem [env:pico2_w_*].
; tools/gen_features.py --check garante que ele esta em dia com o manifesto, e
; tools/check_features.py prova que ele resolve, flag a flag e unidade de traducao a
; unidade, para o que o manifesto descreve. A troca foi validada por build
; byte-a-byte contra a imagem anterior (docs/analysis/MODELO_DE_RECURSOS.md, P1).

[env:pico_w_release]
extends = pico_base
build_type = release
build_flags = ${pico_base.build_flags}
    -DNDEBUG
    -DSIMUT_CLI_FULL=0
    -DSIMUT_WEB_HTTPS=1
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<ConcurrencyAsserts.cpp>
    -<BluetoothManager.cpp>
    -<net/NetworkManager_Wired.cpp>
    -<net/WiredLink.cpp>
lib_ignore =
    SerialBT
custom_web_omit = slot

[env:pico_w_test]
extends = pico_base
build_type = release
build_flags = ${pico_base.build_flags}
    -DNDEBUG
    -DSIMUT_CLI_FULL=1
    -DSIMUT_LICENSE_STUB=1
    -DSIMUT_MDNS=0
    -DSIMUT_OTA_TRUST_BENCH=1
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<ConcurrencyAsserts.cpp>
    -<BluetoothManager.cpp>
    -<net/NetworkManager_Wired.cpp>
    -<net/WiredLink.cpp>
lib_ignore =
    SerialBT
custom_web_omit = slot
custom_fs_pages = LICENSE_PAGE

