what = "The Arduino core for the RP2040 and RP2350, with its WiFi, WebServer, HTTPClient, DNSServer, Updater, PicoOTA, SPI and Wire libraries. Its networking and filesystem code comes from the ESP8266 Arduino core, under the same licence."
