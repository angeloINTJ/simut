# Every piece of third-party software that ends up in a SIMUT image, and where
# the text of its licence is. One list, three outputs, all written by
# tools/gen_notices.py and checked by `gen_notices.py --check` in CI:
#
#   THIRD_PARTY_NOTICES.md     the complete notices; licence texts in LICENSES/
#   WebUI.h                    the list under "Third-Party Notices" on /license
#   src/HelpLicenseEN.h        the list at the end of the panel's License screen
#
# What belongs here is what the linker keeps in at least one image, measured
# by the component's symbols in each firmware.elf (2026-10-02; the two SIMUT
# Wire images, pico_wire and pico_wiretft, on 2026-10-13, by one symbol per
# component, the same probe agreeing with every line below on the seven
# others), plus fonts and the code the web pages carry. `images` names the
# images that carry it, by the suffix of their PlatformIO environment. A
# page or a panel lists the components of its own family, radio or Wire
# (tools/gen_notices.py). An image outside the nine is named in
# [bench_images] below, and by name in each row that carries it (since
# 2026-10-30; before, it inherited the rows of the image it extends, which
# was wrong for the original panel's faces). A row marked `ui = "angulo"`
# belongs to the Angulo block of the /license page and to the Angulo's panel,
# not to the family lists.
#
# Every `text` is a file in LICENSES/, copied verbatim: from the package the
# build uses (~/.platformio/packages, .pio/libdeps), from the source file's own
# header when the library has no licence file, or from the project's upstream
# when the toolchain package does not carry one (newlib, the GCC runtime
# exception, GNU FreeFont, the SHA-256 statement).

all_images = ["release", "test", "test_https", "asserts", "alpha", "air", "pico2_release",
              "wire", "wiretft"]

# Images outside the nine (2026-10-14, rewritten 2026-10-30 after the C3 switch): a bench image the manifest builds and nobody
# installs. THIRD_PARTY_NOTICES.md lists it, against the rows that name it; `page` says what its /license page and its License
# screen are. `extends` is the image whose switches it shares: it inherits no row.
[bench_images.wiretft_angulo]
extends = "wiretft"
what = "the Angulo touch panel on the SIMUT Wire (`ui = \"angulo\"` in tools/features.toml)"
page = "Its /license page is the Wire page with the Angulo block, and its License screen is the Angulo's."

# The original panel on the Pico 2 W (2026-10-30): what pico2_w_release was until the C3 switch, which builds the Angulo there now.
# Byte for byte the old pico2_w_release (sha256 equal, C3), so every row that named pico2_release then names it.
[bench_images.pico2_original]
extends = "pico2_release"
what = "the original touch panel on the Pico 2 W (`ui = \"original\"` in tools/features.toml), built by CI and not published"
page = "Its /license page and its License screen are those of the original panel on the radio images."

