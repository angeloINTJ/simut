# Measured by nm on the eleven firmware.elf (2026-10-30): the original panel's faces (FreeSansBold9pt8b, FreeSansBold12pt8b, FreeSansBold24pt7b)
# are in the six images of `images` and in none of the Angulo's, whose faces are the row "GNU FreeFont (FreeSans, FreeMono Bold)" below.
# `page_images` is the set the family lists (the /license page and the panel) label this row with: the five images with the touch panel, as the
# originals' pages have always said, kept so that those pages stay byte for byte (S10c C4). A registered deviation: the Angulo block of the page
# and the note of its FreeFont row say which faces the Angulo images do not carry.
[[component]]
name = "GNU FreeFont (FreeSans Bold)"
holder = "GNU FreeFont contributors"
license = "GPL-3.0-or-later with the font exception"
images = ["release", "test", "test_https", "asserts", "wiretft", "pico2_original"]
page_images = ["release", "test", "test_https", "asserts", "pico2_release", "wiretft"]
url = "https://www.gnu.org/software/freefont/"
what = "The 9, 12 and 24 pt faces of the touch panel, converted to bitmaps and cut down to the glyphs SIMUT draws."
text = "freefont-GPL-3.0-font-exception.txt"
also = ["GPL-3.0.txt"]

