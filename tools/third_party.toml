# and icons rasterized from Lucide 0.468.0. Only the two images pico_wiretft_angulo and pico2_w_release carry them (nm of the eleven
# firmware.elf, 2026-10-30: the kit's DISP*, MONO* and SANS* faces and its 42 icons are in those two and in no other). `ui = "angulo"` takes a row
# out of the family lists and into the Angulo block of the /license page (tools/gen_notices.py); the Angulo's own License screen names them in
# src/ui/angulo/telas/MenusLicenca.cpp, a text that `gen_notices.py --check` holds to these rows (name, holder, licence).
