# ---------------------------------------------------------------------------
#  Regras entre escolhas. Cada uma foi MEDIDA em 2026-09-26 compilando a
#  combinação proibida; "evidence" guarda o erro. A página as usa para travar
#  a opção com o motivo à vista, e tools/build_custom.py as reaplica antes de
#  compilar — a página não é a autoridade. Semântica: se todas as condições de
#  `when` valem, todas as de `require` têm de valer.
# ---------------------------------------------------------------------------
[[rules]]
id       = "air-needs-headless"
when     = { air = true }
require  = { display = "nenhum" }
why.en   = "Hibernation needs a build without a display."
why.pt   = "A hibernação exige uma build sem mostrador."
evidence = "TFT+air and alpha+air fail to link: multiple definition of DisplayManager::DisplayManager(). SIMUT_AIR switches on DisplayManager_None.cpp, which collides with the chosen display's DisplayManager."

[[rules]]
id       = "headless-needs-air"
when     = { display = "nenhum" }
require  = { air = true }
why.en   = "A build without a display exists only with hibernation."
why.pt   = "Uma build sem mostrador só existe com a hibernação."
evidence = "The air profile with air=false fails to link: undefined reference to DisplayManager::begin(). The headless display drops DisplayManager.cpp and the non-air boot path calls it."

[[rules]]
id       = "graph-needs-tft"
when     = { tft_graph = true }
require  = { display = "tft" }
why.en   = "The graph draws on the touch display."
why.pt   = "O gráfico é desenhado na tela touch."
evidence = "SIMUT_TFT_GRAPH follows SIMUT_DISPLAY_TFT in simut_config.h, so an alpha or Air profile with the switch on still comes out without the graph (its three units leave with the display), and forcing -DSIMUT_TFT_GRAPH=1 without the TFT stops at an #error there."

[[rules]]
id       = "air-no-buzzer"
when     = { air = true }
require  = { sound_buzzer = false }
why.en   = "The hibernating build carries no buzzer: its sound code does not compile with hibernation on."
why.pt   = "A build que hiberna não leva o buzzer: o código de som não compila com a hibernação ligada."
evidence = "air+sound_buzzer fails to compile: SoundManager.cpp: 'BuzzerNote' does not name a type. SIMUT_AIR turns SoundManager.h into the no-op class, and SoundManager.cpp has no guard of its own."

# As duas regras abaixo pedem o radio (net = "cyw43"), e nao a ausencia do cabo (2026-10-13):
# o Bluetooth e a hibernacao rodam no CYW43, e uma placa de rede que se acrescente depois
# tambem nao o tem. Antes eram `lan-no-bluetooth` e `lan-no-air`, sobre o interruptor `lan`.
[[rules]]
id       = "bluetooth-needs-cyw43"
when     = { bluetooth = true }
require  = { net = "cyw43" }
why.en   = "Bluetooth runs on the CYW43 radio, so it needs the Wi-Fi connection."
why.pt   = "O Bluetooth roda no rádio CYW43, então precisa da conexão Wi-Fi."
why.es   = "El Bluetooth funciona en la radio CYW43, así que necesita la conexión Wi-Fi."
evidence = "With net = enc28j60, SIMUT_BLUETOOTH stops at an #error in simut_config.h, pinned by tools/test_pin_masks.py (2026-10-12). The test of that #error was SIMUT_NET_LAN && SIMUT_BLUETOOTH, the cable; since 2026-10-13 it is SIMUT_BLUETOOTH && !SIMUT_NET_CYW43, the chip. Not compiled past that #error: the Bluetooth stack (SerialBT, BTstack) rides on the CYW43, and board = rpipico has none. The rule asks for the radio, not for the absence of the cable: a wired board added later has no CYW43 either, and the #error already refuses it."

[[rules]]
id       = "air-needs-cyw43"
when     = { air = true }
require  = { net = "cyw43" }
why.en   = "Hibernation is built around the CYW43 radio, which it powers down between wakes, so it needs the Wi-Fi connection."
why.pt   = "A hibernação é feita em torno do rádio CYW43, que ela desliga entre os despertares, então precisa da conexão Wi-Fi."
why.es   = "La hibernación gira en torno a la radio CYW43, que apaga entre los despertares, así que necesita la conexión Wi-Fi."
evidence = "With net = enc28j60, SIMUT_AIR stops at an #error in simut_config.h, pinned by tools/test_pin_masks.py (2026-10-12). The test of that #error was SIMUT_NET_LAN && SIMUT_AIR, the cable; since 2026-10-13 it is SIMUT_AIR && !SIMUT_NET_CYW43, the chip. Not compiled past that #error: AppManager_Air.cpp powers the CYW43 down through GPIO23 (WL_REG_ON) before every sleep, and board = rpipico has no CYW43. The rule asks for the radio, not for the absence of the cable: a wired board added later has no CYW43 either, and the #error already refuses it."

# A UI Angulo desenha na TFT (2026-10-14). Como graph-needs-tft, a regra existe porque o simut_config.h
# para num #error, e a evidencia e o erro que o compilador deu numa build do pico_w_alpha com ui = angulo.
[[rules]]
id       = "angulo-needs-tft"
when     = { ui = "angulo" }
require  = { display = "tft" }
why.en   = "The Ângulo look draws on the touch display."
why.pt   = "O visual Ângulo é desenhado na tela touch."
why.es   = "El aspecto Ángulo se dibuja en la pantalla táctil."
evidence = "pico_w_alpha with ui = angulo (the composed environment plus -DSIMUT_UI_ANGULO=1, built with pio run on 2026-10-14) stops on every unit that includes simut_config.h, with: src/simut_config.h:99:2: error: #error \"SIMUT_UI_ANGULO needs SIMUT_DISPLAY_TFT\". The Air (no display) stops at the same #error, pinned by tools/test_ui_caps.py. Not compiled past it: the Ângulo panel draws on the ILI9341 and reads the XPT2046, which neither the 16x2 LCD nor the headless image has, and the manifest refuses the combination before a build starts."

# O Angulo no Pico W (2026-10-22). O mantenedor decidiu em 2026-10-21 que o Angulo chega primeiro ao Pico 2 W, com uma versao menor para o Pico W depois, e em 2026-10-22
# que o construtor monta o Pico 2 W das duas formas (o Angulo e o original). O Pico W e o RP2040 com o radio CYW43 (net = "cyw43"), e nele o Angulo ainda nao e oferecido: a regra
# recusa o Angulo em todo perfil do Pico W, pela decisao do mantenedor de 2026-10-21 (a medida de que nao cabe cobre so a imagem de release, e esta na evidencia),
# e pede o RP2350 a quem junta o Angulo ao radio. O SIMUT Wire com TFT (RP2040 com o ENC28J60, o pico_wiretft_angulo) nao e atingido, porque nao tem o radio: e a imagem de
# bancada do Angulo e continua. `chip` entrou no vocabulario das regras (config_of( )) por causa desta: sem ele nao ha como dizer "o RP2350", porque o Pico W e o Pico 2 W
# escolhem o mesmo mostrador, a mesma rede e a mesma UI; a pagina le o chip do mesmo model.json (products[].config.chip). Nenhuma build do Angulo para o Pico W existe, entao
# nao ha erro de compilador a citar: a evidencia e a medida de docs/analysis/UI_DRIVERS.md secao 3.6, com as datas dela.
[[rules]]
id       = "angulo-cyw43-needs-rp2350"
when     = { ui = "angulo", net = "cyw43" }
require  = { chip = "rp2350" }
why.en   = "On the Pico W with Wi-Fi the Ângulo look is not offered yet. Choose the Pico 2 W, or the original look."
why.pt   = "No Pico W com Wi-Fi o visual Ângulo ainda não é oferecido. Escolha o Pico 2 W ou o visual original."
why.es   = "En la Pico W con Wi-Fi el aspecto Ángulo aún no se ofrece. Elija la Pico 2 W o el aspecto original."
evidence = "The rule applies a decision, not a measurement: the maintainer decided on 2026-10-21 that the Ângulo ships first on the Pico 2 W only, with a smaller version for the Pico W later, so the rule refuses every Pico W profile (the RP2040 with the CYW43 radio, whatever its display, the Wire TFT with the Wi-Fi back included), and the measurement below covers the Pico W's Wi-Fi release image only. No Ângulo build of the Pico W exists, so there is no compiler error to quote; the gap is measured on other images (docs/analysis/UI_DRIVERS.md section 3.6). Measured on 2026-10-14 (baseline images of 192e1ad, the study's Ângulo): 45,856 B above the plain pico_wiretft, against 5,643 B of OTA headroom in the Pico W's Wi-Fi release (PLANO_STABLE.md section 3.1), a gap of 34 to 40 kB. Rerun on 2026-10-21 (after S10b-1): pico2_w_angulo, a real Wi-Fi Ângulo build, is 31,008 B above pico2_w_release (.bin 1,029,952 against 998,944 B), and the Pico W's Wi-Fi release has 5,195 B of headroom in the same record and no Ângulo build, so a transposition of the 31 kB would not fit it. The SIMUT Wire TFT (RP2040 with the ENC28J60, pico_wiretft_angulo) has no radio and is not refused: it is the Ângulo's bench image."

# O Angulo e o grafico do painel (2026-10-22). O Angulo le o pacote de dados do grafico (_graphData, um membro do DisplayManager que so existe com SIMUT_TFT_GRAPH) em
# DisplayManager_UiA.cpp e em DisplayManager_UiA_Graficos.cpp. Com `tft_graph = false` o manifesto deixava passar `ui = "angulo"` e a build so parava no compilador (a revisao
# do C1a, 2026-10-22). Como graph-needs-tft e angulo-needs-tft, a evidencia e o erro do compilador. A regra recusa; nao faz o Angulo compilar sem o grafico: isso e src/, e nao
# o manifesto. Nos perfis sem TFT ela acende ao lado de angulo-needs-tft, porque tft_graph = false ali.
[[rules]]
id       = "angulo-needs-tft-graph"
when     = { ui = "angulo" }
require  = { tft_graph = true }
why.en   = "The Ângulo look draws its charts on the touch display, so it needs the switch \"Graph and calendar on the touch display\" on."
why.pt   = "O visual Ângulo desenha os gráficos na tela touch, então precisa da chave \"Gráfico e calendário na tela touch\" ligada."
why.es   = "El aspecto Ángulo dibuja sus gráficos en la pantalla táctil, así que necesita el interruptor \"Gráfico y calendario en la pantalla táctil\" activado."
evidence = "pico2_w_release with ui = angulo and tft_graph = false passed the manifest and did not compile. Run on 2026-10-22 on the tree of a6859ce5, before this rule existed: python3 tools/build_custom.py --profile '{\"v\":1,\"base\":\"pico2_w_release\",\"set\":{\"ui\":\"angulo\",\"tft_graph\":false}}' exits 1 with src/ui/angulo/DisplayManager_UiA.cpp:293:44: error: '_graphData' was not declared in this scope, and five more of the same error in src/ui/angulo/DisplayManager_UiA_Graficos.cpp (its --validate-only exited 0). The Wire TFT (base pico_wiretft, the same two choices) fails the same way. The Ângulo reads the data package of the panel chart, DisplayManager::_graphData (a GraphDataPackage), a member that exists only when SIMUT_TFT_GRAPH is set (src/DisplayManager.h), so the Ângulo needs the chart switch on. The manifest refuses the combination before a build starts; making the Ângulo compile without the chart is a change in src/, not in the manifest."

# O que o orcamento de PIO e de pinos recusa (tools/pio_budget.py, 2026-10-13), com as
# palavras que a pagina mostra: `why` e o problema; `fix`, o remedio, com {list} trocado
# pelos rotulos de [ui_toggles] das chaves que, desligadas uma de cada vez, fazem caber,
# separados por "; "; `fix_one`, o mesmo remedio quando a lista tem um item so. A rede
# nunca esta na lista: ela e uma escolha ([net]), a placa de que a build parte, e o remedio
# esta entre os interruptores (pio_budget.BUDGET_KEYS). A trava de uma chave a tira da lista
# (desligar a chave que se quer ligar nao e remedio) e, se nao sobra nenhuma, fica so o
# problema. {pin} e o GPIO de um pin-conflict. O mesmo texto vale no
# CI (tools/build_custom.py), e o model.json leva, por chip, cada recusa. Todo id de
# pio_budget.REFUSAL_IDS precisa dos tres, nas duas linguas, mesmo o que nenhuma imagem acende
# hoje.
[ui_budget.pio-budget]
why.en     = "This does not fit the PIO blocks of this chip."
why.pt     = "Isto não cabe nos blocos PIO deste chip."
fix.en     = "Turn off one of these: {list}."
fix.pt     = "Desligue um destes: {list}."
fix_one.en = "Turn off: {list}."
fix_one.pt = "Desligue: {list}."

[ui_budget.pin-conflict]
why.en     = "Two features claim GP{pin}."
why.pt     = "Dois recursos disputam o GP{pin}."
fix.en     = "Turn off one of these: {list}."
fix.pt     = "Desligue um destes: {list}."
fix_one.en = "Turn off: {list}."
fix_one.pt = "Desligue: {list}."

# Avisos: combinações que compilam mas carregam um risco conhecido. Não travam
# nada; a página mostra o motivo e de onde vem a evidência.
[[hazards]]
id       = "enc28j60-unsoaked"
when     = { net = "enc28j60" }
why.en   = "The ENC28J60 connection has run on the bench, not yet through a soak: a build with it is a bench build."
why.pt   = "A conexão ENC28J60 rodou na bancada, mas ainda não passou por um soak: uma build com ela é de bancada."
evidence = "2026-10-13: pico_wiretft on the Wire rig, web and console over the cable for hours; no image with the ENC28J60 has run a 72 h soak."

[[hazards]]
id       = "bt-flash-core1"
when     = { bluetooth = true, display = "tft" }
why.en   = "Bluetooth writes its pairing data to flash without pausing Core 1, which draws the touch display. Inferred from the framework source, never reproduced."
why.pt   = "O Bluetooth grava os dados de pareamento no flash sem pausar o Core 1, que desenha a tela touch. Inferido do código do framework, nunca reproduzido."
evidence = "MODELO_DE_RECURSOS.md R-H24 (inferred): btstack_flash_bank.cpp:53-56 writes the TLV without Core1FlashPause."
