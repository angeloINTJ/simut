# features.toml — o manifesto de recursos do SIMUT.
#
# Fonte única do que cada perfil de firmware liga, desliga e escolhe, e a FONTE do
# build: tools/gen_features.py o transforma em tools/generated/profiles.ini (a config
# do PlatformIO, incluida pelo platformio.ini via extra_configs) e em
# docs/configurador/model.json (a arvore do configurador). O platformio.ini nao
# define mais [env:pico_w_*]: guarda so o pico_base e os ambientes native. O portao
# tools/check_features.py prova que os perfis resolvem, flag a flag e unidade de
# traducao a unidade, para o que este manifesto descreve.
#
# Este e o passo P1 de docs/analysis/MODELO_DE_RECURSOS.md. A troca do platformio.ini
# a mao para estes perfis foi validada por build byte-a-byte: os seis firmware.bin
# saem identicos a imagem anterior. O flag SIMUT_FACTORY_RESET, que a imagem nunca
# leu, foi removido no P0 e o build conferido identico.
#
# Comentarios explicam por que, e citam a evidencia — a regra da casa.

[meta]
version   = 1
generates = ["tools/generated/profiles.ini", "docs/configurador/model.json", "src/FeatureBits.h"]
# Os ambientes de host (native_*) NAO sao modelados aqui: sao suites de teste,
# nao imagens de firmware. O portao os ignora.

# Flags que todo perfil de firmware acrescenta sobre ${pico_base.build_flags}.
[base]
common_flags = ["-DNDEBUG"]   # as dez imagens carregam NDEBUG (release ganhou em 2026-09-18)

# ---------------------------------------------------------------------------
#  O chip. Um valor por perfil; sem a chave, rp2040 (o Pico W, que o pico_base
#  ja descreve). `board` sobrepoe o do pico_base; `flags` somam aos do perfil.
#  Fase 4 de docs/analysis/PLANO_REVISAO_EXTERNA.md (2026-10-01): o RP2350 entra
#  primeiro so no CI (S0), para o codigo nao voltar a depender do RP2040 sem que
#  ninguem veja.
# ---------------------------------------------------------------------------
[chip.rp2040]
board = ""
flags = []
# `slot` (2026-10-04): o que a pagina diz da atualizacao em teste e da volta, que so
# o RP2350 tem (passo 5 de docs/analysis/OTA_AB_RP2350.md). O Pico W corta esses
# blocos @IF e sai com as paginas de antes.
web_omit = "slot"

[chip.rp2350]
# Pico 2 W: RP2350, 4 MB de flash, o mesmo CYW43439. -Wno-error=overloaded-virtual
# porque o WiFiClientSecureBearSSL.h do framework dispara esse aviso so neste chip
# (medido em 2026-10-01 com o framework 1.50601.0) — e o -Werror vale para o que
# src/ inclui. O Air no RP2350 ainda nao existe. O OTA do RP2350 grava o slot de
# onde a placa nao subiu e reinicia nele pela ROM (passo 4 de
# docs/analysis/OTA_AB_RP2350.md, 2026-10-03); de 2026-10-03 ate o passo 4 a imagem
# recusava todo OTA, porque o de antes supunha a flash do Pico W.
board = "rpipico2w"
flags = ["-Wno-error=overloaded-virtual"]
# O programa sobe de um slot da tabela de particoes (passo 3 de
# docs/analysis/OTA_AB_RP2350.md): linker script proprio, sem o stub de OTA do
# arduino-pico, e o LittleFS com os 1.020 KB que a tabela da a ele, em 0x300000.
# tools/test_rp2350_layout.py confere os quatro lugares que dizem esse layout.
ldscript        = "tools/rp2350/memmap_slot.ld"
filesystem_size = "1020k"

# ---------------------------------------------------------------------------
#  A escolha do mostrador. Exatamente um valor por perfil.
#  As listas de exclusao sao as unidades de traducao que a variante NAO compila;
#  a de include, as que ela acrescenta. Resolvidas contra src/ pelo portao.
# ---------------------------------------------------------------------------
[display.tft]
# O default do simut_config.h ja e TFT=1, ALPHA=0, entao nada e emitido.
flags   = []
exclude = ["DisplayManager_Alpha.cpp"]   # a implementacao alpha nao entra

[display.alpha_paralelo]
flags   = ["-DSIMUT_DISPLAY_TFT=0", "-DSIMUT_DISPLAY_ALPHA=1", "-DHD44780_MODE_PARALLEL=1"]
exclude = [
  "DisplayManager_Touch.cpp", "DisplayManager_Settings.cpp", "DisplayManager_SettingsCore.cpp", "DisplayManager_Graph.cpp", "DisplayManager_GraphCore.cpp",
  "DisplayManager_Dashboard.cpp", "DisplayManager_Panel.cpp", "DisplayManager_Calibration.cpp", "DisplayManager_CalibrationCore.cpp", "DisplayManager_Auth.cpp",
  "DisplayManager_Alarm.cpp", "DisplayManager_AlarmUi.cpp", "DisplayManager_LicenseUi.cpp", "DisplayManager_Calendar.cpp", "DisplayManager_CalendarCore.cpp", "DisplayManager_Fonts.cpp",
  "DisplayManager_i18n.cpp", "DisplayManager_i18nUi.cpp", "DisplayManager_LangParser.cpp", "AppManager_Graph.cpp",
  "DisplayManager_Ota.cpp", "DisplayManager_OtaCore.cpp", "DisplayManager_Render.cpp", "DisplayManager_UsersUi.cpp",
]
include             = ["DisplayManager_Alpha.cpp"]
ignore_display_libs = true    # o LCD nao usa ILI9341/GFX/XPT2046
web_omit            = "tft"   # a pagina recorta o bloco @IF tft

[display.nenhum]
# O mostrador headless do Air. Mantem i18n e LangParser (web e CLI os usam).
flags   = ["-DSIMUT_DISPLAY_TFT=0", "-DSIMUT_DISPLAY_ALPHA=0"]
exclude = [
  "DisplayManager_Touch.cpp", "DisplayManager_Settings.cpp", "DisplayManager_SettingsCore.cpp", "DisplayManager_Graph.cpp", "DisplayManager_GraphCore.cpp",
  "DisplayManager_Dashboard.cpp", "DisplayManager_Panel.cpp", "DisplayManager_Calibration.cpp", "DisplayManager_CalibrationCore.cpp", "DisplayManager_Auth.cpp",
  "DisplayManager_Alarm.cpp", "DisplayManager_AlarmUi.cpp", "DisplayManager_LicenseUi.cpp", "DisplayManager_Calendar.cpp", "DisplayManager_CalendarCore.cpp", "DisplayManager_Fonts.cpp",
  "AppManager_Graph.cpp", "DisplayManager.cpp", "DisplayManager_Render.cpp", "DisplayManager_Alpha.cpp",
  "DisplayManager_Ota.cpp", "DisplayManager_OtaCore.cpp", "DisplayManager_i18nUi.cpp", "DisplayManager_UsersUi.cpp",
]
include             = ["DisplayManager_None.cpp"]
ignore_display_libs = true
web_omit            = "tft"

[libs]
display = ["Adafruit ILI9341", "Adafruit GFX Library", "XPT2046_Touchscreen"]

# ---------------------------------------------------------------------------
#  A rede: como o aparelho se comunica (2026-10-13). Uma escolha por perfil, como o
#  mostrador: `net = "<id>"` nomeia um [net.<id>], o driver da imagem. Ate 2026-10-13 a
#  rede era o interruptor `lan` ("cabo no lugar do Wi-Fi"), um booleano, que nao tem
#  lugar para uma terceira placa. A classe ([net_class]) e o que as paginas, o console
#  e os paineis sabem da rede; o driver ([net]) e a placa que a faz. Uma placa nova e
#  um [net.<id>], um [ui_nets.<id>] e o driver em src/net/; o programa PIO dela e os
#  pinos moram em tools/pio_budget.py (a chave "net=<id>" do ORDER e o <id> do PINS).
# ---------------------------------------------------------------------------
# A classe e o que as paginas, o console e os paineis sabem da rede, e cada driver
# nomeia a sua.
#   wifi  entra numa rede por nome e senha: busca de redes, ponto de acesso de
#         configuracao e nivel de sinal. E a classe do driver padrao, o CYW43
#         (src/net/NetCaps.h: SIMUT_NET_WIFI = SIMUT_NET_CYW43).
#   lan   um cabo: o endereco vem por DHCP ou e o fixo da configuracao
#         (SIMUT_NET_LAN = SIMUT_NET_ENC28J60).
#   macro     o nome do macro da classe, que o src/FeatureBits.h le para o bit. Ele NAO
#             vai por -D: sai da identidade do driver no src/net/NetCaps.h, que recusa
#             quem o passa (2026-10-13; ia por -D porque os cabecalhos puros nao viam o
#             simut_config.h, e hoje eles incluem o NetCaps.h). O que vai por -D e a
#             identidade, nos `flags` do driver ([net.enc28j60]: -DSIMUT_NET_ENC28J60=1).
#   bit       o bit "feat" do /api/status (src/FeatureBits.h, SIMUT_FEAT_<CLASSE>),
#             PERMANENTE como o de um interruptor: um app instalado le o numero. O 18
#             era da chave `lan` e passou para a classe sem mudar.
#   web_omit  os blocos /* @IF <nome> */ do WebUI.h (tools/build_webui_gz.py) que a
#             classe corta: a lan nao tem radio, e os /* @IF !wifi */, o que so o cabo
#             tem, entram (2026-10-13, pedido do mantenedor).
#   units     as unidades de traducao da classe: o que toda placa dela divide, e nao o
#             que e de um chip. Toda unidade de uma classe que NAO e a do perfil sai do
#             build (-<unidade> no build_src_filter), como a de um driver que nao e o
#             do perfil (a chave `units` de [net.<id>], abaixo).
[net_class.wifi]

[net_class.lan]
macro    = "SIMUT_NET_LAN"   # derivado no src/net/NetCaps.h (= SIMUT_NET_ENC28J60); nunca vai por -D
bit      = 18
web_omit = "wifi"
# Os dois arquivos da classe: a unidade do cabo no NetworkManager (o contrato de NetworkManager.h:
# as maquinas de estado cabeadas) e o enlace que toda placa cabeada divide (LwipIntfDev: hostname,
# endereco fixo, begin, getters, end), com o cabecalho do chip por baixo
# (src/net/Enc28j60Device.h, que e cabecalho e nao entra aqui).
# Nem entram nas imagens Wi-Fi. Vazios ali (tudo sob #if SIMUT_NET_LAN), ainda assim mudavam
# os bytes: os dois objetos no link trocavam a ordem de 56 veneers do linker (mesmo codigo,
# mesmos tamanhos, alvos de BL deslocados em 16 a 32 B), e o pico_w_release saia 55ce740c em
# vez de 1fe54a67 (2026-10-13). Fora do filtro, as sete voltam byte a byte.
units    = ["net/NetworkManager_Wired.cpp", "net/WiredLink.cpp"]

# Os drivers. `class` e a classe do driver; as outras chaves sao o que o ambiente do
# PlatformIO ganha com ele, e quem escolhe outro driver nao as recebe:
#   board     {chip = "placa"}: a placa daquele chip com o driver. Um driver sem `board`
#             deixa a placa do chip; um chip sem entrada nao tem placa para ele, e o
#             gerador recusa o perfil (gen_features.net_refusal) em vez de compor a
#             placa de sempre -- uma imagem que diria uma coisa e seria outra.
#   unflags   flags do pico_base que o ambiente tira com build_unflags.
#   flags     flags que o driver soma aos do perfil.
#   units     as unidades de traducao do driver: as de um chip que traz um .cpp proprio
#             (o CYW43 traz o do radio, o NetworkManager_Cyw43.cpp; o ENC28J60 nao traz: o
#             chip dele e um cabecalho, e as unidades da build cabeada sao da classe `lan`).
#             Toda unidade de um driver que NAO e o do perfil sai do build (-<unidade> no
#             build_src_filter).
#   lib_deps  as bibliotecas que so ele traz, fixadas por commit.
#   web_omit  os blocos /* @IF <nome> */ do WebUI.h que so este driver corta, depois dos da
#             classe (2026-10-13). A classe corta o que o radio e (`wifi`); o driver, o que o
#             chip toma: o ENC28J60 fica com o GP11-GP15, e a pagina de sensores diz onze
#             slots em vez de dezesseis (`slots16`). Outro modulo cabeado nao tomaria esses
#             pinos, e por isso isto nao e da classe.
[net.cyw43]
# O radio CYW43439 do Pico W e do Pico 2 W: o default do pico_base e a identidade padrao do
# src/net/NetCaps.h (SIMUT_NET_CYW43), nada a emitir.
class = "wifi"
# A unidade do radio no NetworkManager (o contrato de NetworkManager.h): a busca, a associacao, a
# escada de reconexao com a dormencia, o AP de configuracao, a busca sob demanda, os getters e o
# sinal. Estava no src/NetworkManager.cpp, que desde 2026-10-13 e so o hospedeiro (NTP, relogio,
# mDNS, fuso, saude). Fora das imagens cabeadas: la a unidade chama cyw43_arch_enable_sta_mode( )
# e o link morre em __wrap_cyw43_cb_* numa placa sem o radio, e o codigo do radio era codigo morto
# nas duas (a guarda que a unidade tinha para isso e esta exclusao).
units = ["net/NetworkManager_Cyw43.cpp"]

[net.enc28j60]
# Um Raspberry Pi Pico comum, o RP2040 sem o radio CYW43, com a rede num modulo ENC28J60.
# O estudo de 2026-09-26 (ramo study/simut-wire, docs/analysis/SIMUT_WIRE_VIABILIDADE.md)
# mediu a release linkando para board = rpipico guardando uma unica chamada, a
# cyw43_arch_enable_sta_mode( ) da busca de redes do NetworkManager (hoje na unidade do radio,
# src/net/NetworkManager_Cyw43.cpp, que a build cabeada nao compila). O driver e o
# src/net/Enc28j60Device.h, o chip, sobre o src/net/WiredLink.cpp e o src/net/NetworkManager_Wired.cpp,
# que sao da classe `lan` (2026-10-12; o chip virou um cabecalho em 2026-10-13).
class    = "lan"
# O RP2350 nao tem placa aqui: o gerador recusa o perfil nele, e a pagina trava a escolha
# com o motivo de [ui_nets.enc28j60].unsupported, ate haver uma.
board    = { rp2040 = "rpipico" }
# O pico_base poe o -DPICO_CYW43_SUPPORTED=1 (as placas W o passam). Sem radio ele sai
# (build_unflags); se ficasse, o simut_config.h pararia num #error (um driver que nao e o
# CYW43 com o PICO_CYW43_SUPPORTED).
unflags  = ["-DPICO_CYW43_SUPPORTED=1"]
# O modulo fica com GP11-GP15 (o INT e o SPI), que eram cinco dos dezesseis slots de
# sensor: a build com ele tem onze, GP0-GP10 (o simut_config.h recusa um pino do modulo
# nessa faixa). O INT no GP11 com qualquer mostrador e decisao de 2026-10-12: uma
# fiacao so.
# O driver passa tambem a identidade dele, -DSIMUT_NET_ENC28J60=1, primeiro (2026-10-13): a
# classe lan sai dela no src/net/NetCaps.h, e a classe nunca vai por -D.
flags    = ["-DSIMUT_NET_ENC28J60=1", "-DMAX_SENSORS=11"]
# Os textos da pagina que dizem dezesseis slots saem, e os de onze entram: os doze blocos
# `@IF slots16` e `@IF !slots16` do WebUI.h. Eram `@IF wifi` ate 2026-10-13, e "tem radio" e
# "tem dezesseis slots" eram a mesma pergunta so porque so havia um modulo cabeado.
web_omit = "slots16"
# Sem `units`: o chip nao traz .cpp, so o cabecalho, e as duas unidades da build cabeada sao da
# classe `lan` (acima).
# O driver do modulo: a biblioteca do mantenedor, fixada no commit da v1.3.1 (pedido dele em
# 2026-10-15; antes, o fb16ec1 que ele escolheu em 2026-10-12, a main de entao). O commit, e
# nao a tag: uma tag pode mudar de lugar. So a build com este driver a baixa; o
# src/net/Enc28j60Device.h e o unico arquivo que a inclui, e o src/net/WiredLink.cpp a unica
# unidade que inclui esse. O tools/wire_enc_bench.py le o commit daqui.
lib_deps = ["https://github.com/angeloINTJ/pico-enc28j60.git#4984e2f55727c81cfd6a548c7d4728942192107a"]

# ---------------------------------------------------------------------------
#  A UI do painel touch (2026-10-14): como o painel desenha e responde ao toque. Uma escolha por
#  perfil, como o mostrador e a rede: `ui = "<id>"` nomeia um [ui.<id>], o driver de UI da imagem.
#  Um perfil sem a chave tem o `original`, o painel de toda release, e ele nao emite nada: os
#  nove ambientes de sempre saem do gerador byte a byte os mesmos. O `angulo` e um estudo, ainda
#  nao aprovado para produtos, e so existe com a tela touch (a regra angulo-needs-tft). Quem manda
#  na identidade e o src/ui/UiCaps.h (SIMUT_UI_ANGULO, o padrao 0): a identidade vai por -D nos
#  `flags` do driver; o que ela deriva (SIMUT_UI_ORIGINAL, SIMUT_UI_CUSTOM_THEMES) NAO vai por -D,
#  e o cabecalho recusa quem o passa. Cada driver diz:
#    flags    flags que o driver soma aos do perfil (a identidade).
#    include  unidades de traducao que so o driver traz e que o filtro do pico_base nao alcanca
#             (+<unidade> no build_src_filter), como as do mostrador alpha.
#    units    as unidades de traducao do driver. Toda unidade de um driver que NAO e o do perfil
#             sai do build (-<unidade> no build_src_filter), como a de um driver de rede.
# ---------------------------------------------------------------------------
[ui.original]
# O painel que toda release leva, o padrao: nada a emitir. `units`: as unidades so dele que as duas imagens do Angulo (a do Wire e a do
# Pico 2 W) nao linkam e que a imagem do Angulo, por isso, nao compila: Themes.cpp (o catalogo de temas; o Angulo define o dele em
# ui/angulo/Temas.cpp), o calendario, as fontes, o grafico, a tela de atualizacao, o desenho (Render), os textos do painel (i18nUi), os
# widgets (UiWidgets) e o Dashboard (os cartoes e a barra de botoes). Medido em 2026-10-21 (S10b, sonda P4, sobre o C5b): as sete juntas
# linkam nas duas imagens com o mesmo .bin e a mesma folga (o --gc-sections ja as descartava); o que a lista traz e que uma dependencia
# nova delas vira erro de link, e nao bytes calados. O Dashboard entrou em 2026-10-23 (S10c, D1): a buildDashLayout( ), a unica funcao dele
# que o Angulo chamava (uaMontarPainel e uaToquePainel), foi para o Panel.cpp, que as duas imagens compilam e onde a tabela a classifica como
# core. Medido nesse dia, as duas imagens do Angulo de zero sem a unidade: .bin do mesmo tamanho (826752 e 1035632 B), nenhuma funcao mudada (V-ELF) e
# os bytes do original nelas caem de 293 e 269 B para 17 B (a buildDashLayout tem 276 e 252 B).
# A DisplayManager_AlarmUi.cpp entrou em 2026-10-23 (S10c, D5): as tres funcoes de desenho da tela de alarme (drawAlarmAction, slotAlarmBg e
# redrawAlarmFlash), que so o original chama, sairam do Alarm.cpp (o estado do alarme, core) para ela. Medido nesse dia, as duas imagens do
# Angulo de zero sem a unidade: .bin do mesmo tamanho (826752 e 1035632 B; os bytes que mudam sao veneers reordenados pelo linker e os
# desvios ate eles, veneer_proof OTHER=0), nenhuma funcao mudada (V-ELF) e os mesmos 17 B do original; as tres
# funcoes ja nao entravam nelas (o --gc-sections as descartava), entao a lista traz o erro de link de uma dependencia nova, e nao bytes. As
# duas listas de exclusao do LCD trazem a unidade tambem: os tres .bin do LCD3 (alpha, air e wire) mantem o sha256 da base.
# A DisplayManager_Settings.cpp entrou em 2026-10-24 (S10c, D2): a showApConfirm( ), a unica funcao dela que o nucleo chamava (o core0Yield( ), sob
# #if SIMUT_NET_WIFI), foi para o SettingsCore.cpp, que as duas imagens do Angulo compilam e onde a tabela a classifica como core; o resto do
# arquivo e desenho do original. O #if SIMUT_NET_WIFI foi junto com a funcao e o emaranhamento subiu 1 (363 -> 364: SIMUT_NET_WIFI no
# SettingsCore.cpp, de 0 para 1), com o aceite do mantenedor de 2026-10-24, um desvio registrado como o do A'4: a [net_class.wifi] nao tem lista
# `units` por onde o arquivo saisse das imagens cabeadas em vez de levar um #if. A unidade ja estava nas duas listas de exclusao do LCD (a
# SettingsCore.cpp tambem), entao os tres .bin do LCD3 (alpha, air e wire) nem a compilam e mantem o sha256 da base. Medido nesse dia, as duas imagens
# do Angulo de zero sem a unidade: o log de build nao a compila mais, os .bin tem o mesmo tamanho (826752 e 1035632 B), nenhuma funcao mudou (V-ELF:
# 4290 e 4348 iguais), nenhum simbolo foi perdido ou ganho (5629 e 5706), os construtores e as tabelas de init sao os mesmos e o original nelas continua
# em 17 B; a showApConfirm( ) era o unico simbolo do arquivo que a imagem do Pico 2 W linkava, e a do Wire nao linkava nenhum. Nos seis produtos com
# painel TFT, V-ELF sai 0 (nenhuma funcao mudou; so a ordem do link, nos cinco com radio) e os onze .bin mantem o tamanho.
# A DisplayManager_Calibration.cpp entrou em 2026-10-24 (S10c, D3): as duas entradas de modo das telas de calibracao, showTouchCalibration( ) e
# showSettingsDisplayOffset( ), que o core0Yield( ), o handleResetTouchCal e a CLI chamam, so guardavam do original dois restos: as sete memorias de
# desenho (g_*) e as duas sentinelas do desvio. Passaram a avisar o que aconteceu (UiChange::TOUCH_CAL_ENTER e DISPLAY_OFFSET_ENTER, levantados no Core 0,
# o segundo dentro do _stateMutex) e o original responde (resetTouchCalCaches( ) e dois stores em linha no UiOriginal.h); as duas funcoes foram para o
# CalibrationCore.cpp, que as duas imagens do Angulo compilam, e sobrou na unidade so o original (as memorias, o resetTouchCalCaches( ) e os desenhos das
# tres telas). A unidade e a CalibrationCore.cpp ja estavam nas duas listas de exclusao do LCD, entao os tres .bin do LCD3 (alpha, air e wire) nem a compilam
# e mantem o sha256 da base. Medido nesse dia, as duas imagens do Angulo de zero: o log de build nao compila mais a unidade (0 linhas; eram 3), os bytes do
# original nelas caem de 17 B de flash + 2 B de RAM para 0 B + 0 B (no D3a, que tirou as sete memorias do link; o D3b e o D3c mantem), nenhum simbolo foi
# perdido ou ganho na mudanca (SYMDIFF 0 e 0), o .bin vale 826672 e 1035560 B (eram 826752 e 1035632 B antes do D3) e a lista traz o erro de link de uma
# dependencia nova, e nao bytes.
# A DisplayManager_LicenseUi.cpp entrou em 2026-10-24 (S10c, D4): a drawSettingsLicense( ), a tela de licenca do original (so o UiOriginal.h a chama; o Angulo
# desenha a sua e le a abertura por licenseOpening( )), saiu do DisplayManager.cpp (core) para ela. O buffer que ela le, _licOpening, ficou la e ganhou ligacao
# externa no passo anterior (D4b-1, declarado em display/LicenseOpening.h). A unidade entrou tambem nas duas listas de exclusao do LCD: o DisplayManager.cpp e
# compilado pelo display.alpha_paralelo, onde a funcao estava sob #if !SIMUT_DISPLAY_ALPHA, e uma unidade vazia compilada ali pode mudar o sha256 do LCD3; os tres
# .bin do LCD3 (alpha, air e wire) mantem o sha256 da base. Medido nesse dia, as duas imagens do Angulo de zero sem a unidade: o log de build nao compila a unidade
# (0 linhas nas duas), os .bin tem o mesmo tamanho (826672 e 1035560 B), nenhuma funcao mudou (V-ELF: 4285 e 4343 iguais), o original nelas continua em 0 B + 0 B e
# a funcao ja nao entrava nelas (o --gc-sections a descartava), entao a lista traz o erro de link de uma dependencia nova, e nao bytes. O que muda nas duas imagens
# e o endereco de funcoes: a utf8FoldNext (180 B, funcao inline fraca) vinha da copia do DisplayManager.cpp, que so a drawSettingsLicense( ) usava, e o ligador
# passou a tomar a de outra unidade.
# Ainda NAO estao aqui, cada uma com o que a segura (tabela da P4; o S10b-2 as separa): Auth (fastRandom, readRect*, convert3to565 e readRow,
# que o nucleo chama), Touch (loopCore1 chama handleTouch), Users, Alarm e DisplayManager.cpp (funcoes de estado e de show que o nucleo
# e o Angulo chamam) e Panel.cpp (sem linha de original na tabela, nao sondada). Uma unidade entra aqui com a prova das duas imagens.
units = [
    "Themes.cpp",
    "DisplayManager_Calendar.cpp",
    "DisplayManager_Fonts.cpp",
    "DisplayManager_Graph.cpp",
    "DisplayManager_Ota.cpp",
    "DisplayManager_Render.cpp",
    "DisplayManager_i18nUi.cpp",
    "UiWidgets.cpp",
    "DisplayManager_Dashboard.cpp",
    "DisplayManager_AlarmUi.cpp",
    "DisplayManager_Settings.cpp",
    "DisplayManager_Calibration.cpp",
    "DisplayManager_LicenseUi.cpp",
    "DisplayManager_UsersUi.cpp",
]

[ui.angulo]
flags = ["-DSIMUT_UI_ANGULO=1"]
# As unidades do Angulo (src/ui/angulo/, 2026-10-14, passo S2a): a cola com o DisplayManager
# (DisplayManager_UiA*.cpp), o kit (Angulo.cpp), a rota GET /api/ui e as telas (telas/*.cpp). O filtro do
# pico_base nao alcanca subdiretorios, por isso entram como `include`. Sem `units`: nenhum outro perfil as
# compilaria (o filtro nao as ve), e um `-<unidade>` a mais mudaria o ambiente de cada perfil que escolhe o
# `original`. Transitorio: o driver ainda compila o desenho do original, que a imagem ja nao linka (`nm -C`
# nao lista nenhuma funcao de desenho antiga); os passos S4 a S10b o separam.
include = [
    "ui/angulo/Angulo.cpp",
    "ui/angulo/DisplayManager_UiA*.cpp",
    "ui/angulo/Temas.cpp",
    "ui/angulo/Textos.cpp",
    "ui/angulo/WebManager_UiA.cpp",
    "ui/angulo/telas/*.cpp",
]

# ---------------------------------------------------------------------------
#  Os interruptores. `emit` diz como o flag e escrito, e por que:
#    value      -> sempre -D<macro>=0 ou =1        (chave de valor)
#    on_is_1    -> ligado -D<macro>=1, desligado nada  (macro de presenca:
#                  emitir =0 ligaria, porque o teste e #ifdef — R-S27)
#    off_is_0   -> ligado nada (default do config), desligado -D<macro>=0
#    bare       -> ligado -D<macro>, desligado nada
#    none       -> sem macro; so mexe em arquivo e biblioteca
#
#  A placa, os flags do pico_base que o ambiente tira, a biblioteca do driver e o que as
#  paginas perdem NAO sao de um interruptor: eram on_board, on_unflags, on_lib_deps e
#  on_web_omit da chave `lan`, e desde 2026-10-13 moram no driver de rede ([net.<id>],
#  acima). O gerador recusa a chave que ainda as tenha, porque uma chave velha ignorada em
#  silencio comporia outra imagem.
#
#  `bit` e a posicao da chave no "feat" do /api/status (2026-09-30): o firmware diz
#  com que chaves foi compilado, no vocabulario deste manifesto, e o cliente — o app
#  simut-rx, o gerenciador de frota — esconde o que a imagem nao tem em vez de
#  encontrar um 404, como ja fazia com o display pelo "cap". O valor sai dos macros
#  que o compilador viu (src/FeatureBits.h, gerado daqui), nao deste arquivo; o
#  tools/test_feature_bits.py confere que os dois concordam em todo perfil.
#  PERMANENTE: um bit nunca troca de chave nem volta a ser usado, porque um app ja
#  instalado le o numero. Chave nova pega o proximo livre.
# ---------------------------------------------------------------------------
[toggles.cli_full]
bit   = 0
macro = "SIMUT_CLI_FULL"
emit  = "value"

[toggles.web_https]
bit   = 1
macro = "SIMUT_WEB_HTTPS"
emit  = "on_is_1"        # #ifdef: -DSIMUT_WEB_HTTPS=0 LIGA o servidor (defeito Z08)

[toggles.license_stub]
bit   = 2
macro = "SIMUT_LICENSE_STUB"
emit  = "on_is_1"

[toggles.mdns]
bit   = 3
macro = "SIMUT_MDNS"
emit  = "off_is_0"       # default do config e 1

[toggles.concurrency_asserts]
bit         = 4
macro       = "SIMUT_CONCURRENCY_ASSERTS"
emit        = "bare"
off_exclude = ["ConcurrencyAsserts.cpp"]  # a ponte do tripwire; so existe ligado

[toggles.bluetooth]
bit            = 5
macro          = "SIMUT_BLUETOOTH"
emit           = "on_is_1"
on_flags       = ["-DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH"]  # so este flag troca o blob e liblwip-bt
off_exclude    = ["BluetoothManager.cpp"]
off_lib_ignore = ["SerialBT"]  # o LDF segue o #include mesmo desligado; sem o ignore o link morre

[toggles.air]
bit        = 6
macro      = "SIMUT_AIR"
emit       = "on_is_1"
on_include = ["air/*.c"]

[toggles.sound_buzzer]
bit            = 7
macro          = "SIMUT_SOUND_BUZZER"
emit           = "off_is_0"       # default do config e 1; desligado -DSIMUT_SOUND_BUZZER=0.
                                  # Antes era `none` (so exclusao de arquivo), o que so
                                  # linkava sob SIMUT_AIR — SoundManager.h so virava no-op
                                  # la. Com macro proprio, um perfil TFT/normal tambem larga
                                  # o buzzer e poupa (ECONOMIA_DE_RECURSOS.md, 2026-09-26).
off_exclude    = ["SoundManager.cpp"]
off_lib_ignore = ["BuzzerPIO_RP2040"]

# O cliente TLS da telemetria (2026-09-30): HTTPS e MQTTS para o coletor. O default
# do simut_config.h é 1, então ligado não emite nada e o profiles.ini não muda;
# desligado emite -DSIMUT_TEL_TLS=0. Não há .cpp a excluir: o TLS mora dentro dos
# transportes (TelemetryManager.cpp), cercado no lugar, e o linker descarta o
# BearSSL que ninguém mais chama — numa imagem sem o servidor HTTPS, o motor TLS
# inteiro. Uma config que pede criptografia numa imagem sem ele é recusada no commit
# e nunca vai em claro pelo socket (docs/analysis/ECONOMIA_DE_RECURSOS.md). A página
# de telemetria perde a chave de TLS com ele, e diz por que um aparelho que guardou
# "criptografado" não envia nada até ela ser salva (@IF tel_tls / @IF !tel_tls).
[toggles.tel_tls]
bit          = 11
macro        = "SIMUT_TEL_TLS"
emit         = "off_is_0"
off_web_omit = "tel_tls"

# O transporte MQTT (2026-09-30): MQTT e MQTTS pelo PubSubClient, o caminho MQTT da
# linha de alarmes com o tópico de ack, e o Home Assistant Discovery. Mesmo desenho
# do tel_tls: cercado no lugar, dentro do TelemetryManager, com as imagens de hoje
# byte a byte idênticas. Sem ele, uma config que nomeia MQTT é recusada no commit
# e em cada envio — todo outro ramo da escolha de transporte é HTTP, e faria POST
# no broker. A página de telemetria perde o seletor de transporte e os campos do
# MQTT com ele, e diz o mesmo de uma config guardada pedindo MQTT.
[toggles.tel_mqtt]
bit          = 12
macro        = "SIMUT_TEL_MQTT"
emit         = "off_is_0"
off_web_omit = "tel_mqtt"

# A interface web, peça a peça (2026-09-30). Cada uma é uma rota, ou uma página e
# as rotas que só ela chama, cercada onde é registrada no WebManager_Core.cpp; sem
# o registro, o linker larga o handler. A página sai da imagem pelo bloco @IF do
# WebUI.h que `off_web_omit` nomeia (o gerador junta ao custom_web_omit). Ligadas,
# as imagens de hoje saem byte a byte idênticas.
[toggles.web_history]
bit          = 13
macro        = "SIMUT_WEB_HISTORY"
emit         = "off_is_0"
off_web_omit = "web_history"

[toggles.web_export_api]
bit   = 14
macro = "SIMUT_WEB_EXPORT_API"
emit  = "off_is_0"

[toggles.web_metrics]
bit         = 15
macro       = "SIMUT_WEB_METRICS"
emit        = "off_is_0"
off_exclude = ["WebManager_Metrics.cpp"]  # só o /metrics usa; a rota sai junto

# O encaminhador de syslog (2026-09-30): SyslogManager.h vira uma classe vazia de
# mesma interface (o objeto de 2.136 B do heap cai para 1 B), o .cpp sai da build e
# a seção Syslog remoto sai da página de configuração. Os campos slog_* ficam na
# config: uma build não é um esquema.
[toggles.syslog]
bit          = 16
macro        = "SIMUT_SYSLOG"
emit         = "off_is_0"
off_exclude  = ["SyslogManager.cpp"]
off_web_omit = "syslog"

# O gráfico e o calendário do painel touch (2026-09-30). Segue o TFT
# (simut_config.h deriva SIMUT_TFT_GRAPH de SIMUT_DISPLAY_TFT), então o alpha e o
# Air já são 0 e dizem isso aqui: sem o gráfico, o `_graphData` de 5.872 B sai do
# objeto DisplayManager deles, no heap. Numa build TFT, desligado tira as três
# unidades do gráfico, o botão da faixa de min/max e as zonas de toque que o abrem.
[toggles.tft_graph]
bit         = 17
macro       = "SIMUT_TFT_GRAPH"
emit        = "off_is_0"
off_exclude = ["DisplayManager_Graph.cpp", "DisplayManager_GraphCore.cpp", "AppManager_Graph.cpp", "DisplayManager_Calendar.cpp", "DisplayManager_CalendarCore.cpp"]

# Os três drivers de sensor (2026-09-26). O default do simut_config.h é 1, então
# ligado não emite nada e o profiles.ini não muda; desligado emite -D<macro>=0,
# que o #178 provou compilar e encolher a imagem (drivers por classe, #172-175).
# Os drivers ainda são headers: não há .cpp a excluir — o linker descarta o que
# a guarda deixa sem referência.
[toggles.sensor_ds18b20]
bit   = 8
macro = "SIMUT_SENSOR_DS18B20"
emit  = "off_is_0"

[toggles.sensor_dht22]
bit   = 9
macro = "SIMUT_SENSOR_DHT22"
emit  = "off_is_0"

[toggles.sensor_bme280]
bit   = 10
macro = "SIMUT_SENSOR_BME280"
emit  = "off_is_0"

# ---------------------------------------------------------------------------
#  Os perfis. Os onze ambientes de firmware que o CI constroi; o oitavo, o
#  pico_wire, desde 2026-10-12, o nono, o pico_wiretft, desde 2026-10-13, o decimo, o
#  pico_wiretft_angulo, desde 2026-10-14, e o decimo primeiro, o pico2_w_angulo, desde 2026-10-21.
#  Os dois ultimos nao sao publicados: o CI os constroi e os confere contra um orcamento de flash proprio
#  (tools/flash_budget.json), e eles nao sao checks obrigatorios.
#  `extends` herda o dicionario de recursos do pai e sobrescreve.
#
#  `ota_trust_bench = true` (2026-10-01): a imagem aceita pelo ar tambem o que a
#  chave de BANCADA assina (keys/ota_root_bench.pub), alem do que a de producao
#  assina. E o que deixa um build local chegar ao rig pela OTA de sempre. Nao e uma
#  chave do configurador: nenhuma build do configurador confia na bancada, e o
#  gerador recusa a marca num perfil `publish = true` -- numa imagem de campo, a
#  chave menos guardada viraria porta dos fundos (docs/analysis/OTA_ASSINADA.md).
# ---------------------------------------------------------------------------
# pico_w_release — a imagem do usuario.
#   -DNDEBUG (2026-09-18, alavanca 2 de DIETA_FLASH.md): -6.832 B de .bin. src/ nao
#   tem assert( ) de runtime (so _Static_assert, que NDEBUG nao toca), entao o que
#   isso desliga sao as checagens internas do pico-sdk e do LittleFS e as strings
#   __FILE__ delas, entre elas um caminho absoluto de 116 B da maquina de build que
#   saia na imagem publicada.
[profiles.pico_w_release]
display             = "tft"
net                 = "cyw43"
cli_full            = false
web_https           = true
license_stub        = false
mdns                = true
concurrency_asserts = false
bluetooth           = false
air                 = false
sound_buzzer        = true
tft_graph           = true
sensor_ds18b20      = true
sensor_dht22        = true
sensor_bme280       = true
tel_tls             = true
tel_mqtt            = true
web_history         = true
web_export_api      = true
web_metrics         = true
syslog              = true
build_type          = "release"
publish             = true

# pico_w_test — imagem de bancada, CLI completa. Nao publicada; orcamento proprio.
#   Carrega a CLI completa e, desde 2026-08-17, a UI web inteira. Medido em e14170f,
#   12 paginas embutidas: sem alavanca estourava o FLASH por 856 B; com parseIntStrict
#   no lugar de sscanf, 6.604 B livres (cabe, sem margem); com +SIMUT_MDNS=0, 21.980 B.
#   -DSIMUT_MDNS=0: 15.376 B medidos; as suites acham a placa por USB (udevadm) e falam
#   por IP, nenhuma resolve SIMUT.local (a release mantem mDNS). -DSIMUT_LICENSE_STUB
#   mantem o texto da licenca fora da imagem. Quando faltar espaco, tire DAQUI, nunca da
#   release. As suites dirigem por serial com enable/configure terminal/write memory/
#   user .../touch sim. O build_flags e re-derivado do pico_base, nao anexado ao da
#   release, senao ficaria -DSIMUT_CLI_FULL=0 e =1 na mesma linha.
#   ota_trust_bench: o rig roda esta imagem e recebe tanto o build local, assinado
#   pela bancada, quanto a candidata que o CI assina.
[profiles.pico_w_test]
display       = "tft"
net           = "cyw43"
cli_full      = true
web_https     = false
license_stub  = true
mdns          = false
bluetooth     = false
air           = false
sound_buzzer  = true
tft_graph     = true
sensor_ds18b20 = true
sensor_dht22  = true
sensor_bme280 = true
tel_tls       = true
tel_mqtt      = true
web_history   = true
web_export_api = true
web_metrics   = true
syslog        = true
build_type    = "release"
publish       = false
ota_trust_bench = true

# pico_w_test_https — a unica imagem com CLI completa E servidor TLS. Nao publicada.
#   Existe porque validar o servidor HTTPS pede duas coisas que nenhuma imagem de campo
#   junta: o servidor so compila com SIMUT_WEB_HTTPS (release), cujo console de
#   emergencia nao cria a conta descartavel das suites web; a pico_w_test tem as contas
#   e nao tem TLS. Os numeros do PR #137 (POST /api/tls) sairam de um env assim, digitado
#   a mao e apagado depois. custom_fs_pages ALARMS/FILE/TEL (2026-09-20, config v25): so
#   este env ficou sem espaco (a politica de PIN custa ~7,1 kB). O portao de flash confere
#   DOIS numeros e o teto de OTA e o mais apertado: so ALARMS_PAGE fora deixou o .bin
#   1.420 B acima do teto de 1.040.384 B mesmo com a regiao cabendo. Sao as duas paginas
#   que um soak HTTPS menos toca; TEL_PAGE entra por folga (com duas fora o .bin ficava
#   3.732 B sob o teto, menos de um setor de 4 KiB). Suba data/web/{alarms,files,tel,license}.
#   html.gz para /web/ antes de uma suite, ou as rotas dao "Page asset missing" (POST
#   /api/upload, nunca uploadfs). Isenta do teto de OTA desde 2026-10-02 (ota_exempt em
#   tools/flash_budget.json, B6 do PLANO_STABLE.md). O limite que sobra e o fim do slot do
#   programa, onde o linker recusa a imagem: no #233 o .bin (1.039.996 B) estava a 4.484 B
#   dele, menos que a menor das tres paginas (alarms, 4.490 B gz). Trazer uma de volta pede
#   medir de novo. LICENSE_PAGE (2026-10-22, a opcao (a) do mantenedor para o S10b-2 do
#   feat/ui-drivers): a regiao FLASH tinha 44 B de folga (o ultimo LOAD terminava em
#   0x100FEFD4 contra 0x100FF000, readelf -l) e o S10b-2 cresce esta imagem ~160 B. Das
#   paginas que a regra do build_webui_gz.py deixa sair (grande, pouco aberta, dispensavel
#   para subir o aparelho), medidas neste env no mesmo dia em gz: DASH 6.237 B e a mais
#   aberta; NET 4.304 B pode ser a que poe um aparelho novo no Wi-Fi; LICENSE 4.260 B; USR
#   3.140 B. Suba tambem data/web/license.html.gz: o web_test_suite.py abre /license e
#   acusa "Page asset missing" sem ele.
[profiles.pico_w_test_https]
extends         = "pico_w_test"
web_https       = true
custom_fs_pages = ["ALARMS_PAGE", "FILE_PAGE", "TEL_PAGE", "LICENSE_PAGE"]

# pico_w_asserts — release com o invariante 3 de concorrencia armado (T1.6). Nao publicada.
#   -DSIMUT_CONCURRENCY_ASSERTS transforma FLASH_OP num tripwire que loga quem entra nele
#   segurando o _stateMutex: imagem para um soak que cace regressao do invariante 3.
#   Existe porque o pico_w_debug (onde o flag era documentado) nao linka: a -Og e sem
#   --gc-sections a imagem estoura o slot de 1020 KB por ~69 KB. Ver a nota "sem env de
#   debug" no platformio.ini.
[profiles.pico_w_asserts]
extends             = "pico_w_release"
concurrency_asserts = true
publish             = false
ota_trust_bench     = true   # imagem de soak no rig, como a pico_w_test

# pico_w_alpha — LCD HD44780 16x2 no lugar do TFT. Economiza ~30 KB tirando a UI grafica.
#   Mantem BluetoothManager.cpp + SerialBT (console BT para o modo AP). O painel de toque
#   nao existe: o #if SIMUT_DISPLAY_TFT do WebManager_Core.cpp nao registra
#   /api/screen_stream, /touch, /screenshot nem /keypad, e custom_web_omit=tft recorta o
#   bloco @IF tft da pagina.
[profiles.pico_w_alpha]
display       = "alpha_paralelo"
net           = "cyw43"
cli_full      = false
web_https     = false
license_stub  = false
mdns          = false
bluetooth     = true
air           = false
sound_buzzer  = true
tft_graph     = false
sensor_ds18b20 = true
sensor_dht22  = true
sensor_bme280 = true
tel_tls       = true
tel_mqtt      = true
web_history   = true
web_export_api = true
web_metrics   = true
syslog        = true
publish       = true

# pico_w_air — build headless que hiberna (sem display, sem buzzer).
#   Mesmo conjunto de fontes do alpha (TFT/toque/UI fora, driver HD44780 mantido mas nunca
#   iniciado), mais: SIMUT_AIR=1 (headless + ciclo dormant); SIMUT_CLI_FULL=1 desde
#   2026-09-18 — era 0 porque nao cabia (a conta de 2026-09-06 foi contra 876 B de folga, e
#   a CLI completa custa +45.056 B), e a dieta da v2.4.9-beta liberou 62.420 B (977.964 ->
#   1.023.020 B medidos, 17.364 B sob o teto de OTA); esta imagem e a que mais precisa,
#   headless, o console serial/BT e a UNICA interface local. SIMUT_MDNS=0 desde a
#   v2.4.4-beta: o responder nunca anunciava e a imagem de OTA fica no teto de 1016 KiB,
#   tirar (~15 KiB) mantem o Air atualizavel (ver #118). SoundManager.cpp fora: buzzer
#   dropado (SoundManager.h e no-op sob SIMUT_AIR). A config do Air (wake, idle, ...) vive
#   em /config/air.bin, NAO no SystemConfig (o CONFIG_VERSION do SystemConfig e 25 na
#   v2.7.3; o comentario antigo do env dizia "stays 21" e estava errado).
[profiles.pico_w_air]
display       = "nenhum"
net           = "cyw43"
cli_full      = true
web_https     = false
license_stub  = true
mdns          = false
bluetooth     = true
air           = true
sound_buzzer  = false
tft_graph     = false
sensor_ds18b20 = true
sensor_dht22  = true
sensor_bme280 = true
tel_tls       = true
tel_mqtt      = true
web_history   = true
web_export_api = true
web_metrics   = true
syslog        = true
publish       = true

# pico2_w_release — a release do Pico W compilada para o Pico 2 W (RP2350).
#   S0 da fase 4: o CI prova que compila e mede o tamanho. Rodou numa placa pela
#   primeira vez em 2026-10-03 (S1): a placa da bancada, de stepping A2, gravada por
#   USB. Os registradores do watchdog e do PSM vem do SDK do chip desde 2026-10-01;
#   sem isso a imagem compilava e escrevia nos enderecos do RP2040.
#   A release publica as imagens dela desde o passo 7 de OTA_AB_RP2350.md
#   (release-ota.yml): o .bin em teste e o .uf2 de fabrica. Por isso ela nao confia
#   mais na raiz de bancada, e tools/test_release_manifest.py confere que nenhuma
#   imagem publicada pela release confia. A imagem de bancada sai deste perfil com
#   PLATFORMIO_BUILD_FLAGS=-DSIMUT_OTA_TRUST_BENCH=1 (AGENTS.md).
#   `publish` e o do configurador e das tabelas FEATURES*.md: desde 2026-10-05 o
#   build_custom.py entrega o .bin em teste e o .uf2 de fabrica dele, a pagina o segura
#   aos tetos do slot (check_flash_budget.ceilings) e a matriz de custo o mede.
[profiles.pico2_w_release]
extends = "pico_w_release"
chip    = "rp2350"
publish = true

# pico_wire — o SIMUT Wire: um Raspberry Pi Pico comum (RP2040 sem o radio CYW43) com a
#   rede por cabo, num modulo ENC28J60. O produto oficial e o mostrador alfanumerico
#   (HD44780 em paralelo, GP16-21), a rede cabeada, o DHT22 e o buzzer, sem DS18B20, sem
#   Bluetooth e sem o Air (os dois rodam no CYW43; as regras bluetooth-needs-cyw43 e
#   air-needs-cyw43). Estende o pico_w_alpha e tira dele o que o Wire nao tem. O BME280 fica,
#   como no alpha: o I2C por PIO dele (WirePIO, 32 instrucoes, um bloco inteiro) so entra
#   num pio0 vazio e cai para GPIO sem ele, entao nao disputa o PIO do modulo se a rede
#   subir antes dos sensores (o que o driver tem de garantir).
#   Pinos do modulo (simut_config.h): MISO GP12, CS GP13, SCK GP14, MOSI GP15 (SPI por PIO);
#   o INT e o GP11, com qualquer mostrador. O driver (src/net/WiredLink.cpp sobre o
#   src/net/Enc28j60Device.h, e o src/net/NetworkManager_Wired.cpp) pega o endereco por DHCP
#   ou o fixo da configuracao;
#   na bancada de 2026-10-12 a web respondeu pelo cabo. Medido em 2026-10-13 (pio run -e
#   pico_wire, arduino-pico 5.6.1, com o driver): 598.560 B de flash, .bin de 610.592 B,
#   104.688 B de RAM, com onze slots; o driver custou 10.588 B de flash e 2.708 B de RAM.
#   Com a unidade do radio (src/net/NetworkManager_Cyw43.cpp) no link, ele morre em __wrap_cyw43_cb_*. Nao
#   publicada; confia na raiz de bancada, como as outras imagens de bancada (o gerador
#   recusa a marca numa publica).
[profiles.pico_wire]
extends         = "pico_w_alpha"
net             = "enc28j60"
bluetooth       = false
air             = false
sensor_ds18b20  = false
sensor_dht22    = true
sensor_bme280   = true
sound_buzzer    = true
publish         = false
ota_trust_bench = true

# pico_wiretft — o SIMUT Wire com o painel TFT e o toque: o mesmo Pico comum (sem o radio
#   CYW43) e o mesmo modulo ENC28J60 do pico_wire, com a tela do pico_w_release no lugar do
#   LCD. Estende o pico_w_release e repete o que o pico_wire escolhe: o DHT22, o BME280 e o
#   buzzer, sem DS18B20, sem Bluetooth e sem o Air (bluetooth-needs-cyw43 e air-needs-cyw43). Difere do
#   pico_wire so em quatro chaves, as que o pico_w_release liga: a tela (a TFT, nao o LCD), o
#   grafico dela, o servidor web HTTPS e o mDNS. O INT do modulo e o GP11 com qualquer dos
#   dois mostradores (simut_config.h, secao 10b), e o nome da variante, o que a OTA compara,
#   e `wiretft` (o do pico_wire e `wire`). Imagem de bancada, nao publicada; confia na raiz de
#   bancada, como o pico_wire. Medido em 2026-10-13 (pio run -e pico_wiretft, arduino-pico
#   5.6.1, com o driver): 780.628 B de flash, .bin de 792.664 B, 109.784 B de RAM, com onze
#   slots; contra o pico_wire, na mesma arvore, +183.180 B de flash e +5.104 B de RAM. Nenhuma
#   placa a rodou ainda.
[profiles.pico_wiretft]
extends         = "pico_w_release"
net             = "enc28j60"
bluetooth       = false
air             = false
sensor_ds18b20  = false
sensor_dht22    = true
sensor_bme280   = true
sound_buzzer    = true
publish         = false
ota_trust_bench = true

# pico_wiretft_angulo — o pico_wiretft com o driver de UI Angulo (2026-10-14). O Angulo e um estudo
#   do painel touch, ainda nao aprovado para produtos: esta e a imagem de bancada que o leva, e
#   nenhum produto publicado o escolhe. A unica chave que ela muda e `ui`, que traz as unidades
#   de src/ui/angulo/ ([ui.angulo].include, desde o passo S2a): .bin de 831.560 B contra os 785.736
#   do pico_wiretft (14/10/2026, core igual ao do CI). Nao publicada; confia na raiz de bancada como
#   o pai (as duas chaves vem dele, e ficam ditas aqui para que mexer no pai nao publique esta).
[profiles.pico_wiretft_angulo]
extends         = "pico_wiretft"
ui              = "angulo"
publish         = false
ota_trust_bench = true

# pico2_w_angulo — o pico2_w_release com o driver de UI Angulo (2026-10-21). O mantenedor decidiu em
#   2026-10-21 que o Angulo chega primeiro ao Pico 2 W, e ate entao ele so tinha imagem no Wire
#   (pico_wiretft_angulo, RP2040 sem radio), onde os caminhos de Wi-Fi do original ficam de fora (a
#   chamada de showApConfirm( ) esta sob #if SIMUT_NET_WIFI): so uma imagem com o radio os compila.
#   A unica chave que ela muda e `ui`, que traz as unidades de src/ui/angulo/ ([ui.angulo].include):
#   .bin de 1.041.296 B contra os 998.944 do pico2_w_release (21/10/2026, as duas do zero na mesma arvore, core igual
#   ao do CI), 1.041.276 B de flash e 132.564 B de RAM; o Angulo define 9.313 B de RAM estatica (tools/ui_ram_budget.json).
#   Nao publicada ainda: o Angulo nao e um produto aprovado, e a release continua com o painel original.
#   Nao confia na raiz de bancada, como o pai (decisao de 2026-10-21): e a imagem em que o Angulo chega ao
#   produto, entao vale a paridade com o pico2_w_release, nao ha bancada de Pico 2 W que a peca, e uma build
#   que a queira sai, como a do pai, com PLATFORMIO_BUILD_FLAGS=-DSIMUT_OTA_TRUST_BENCH=1 (AGENTS.md). A chave
#   fica dita aqui, falsa, para que mexer no pai nao mude isto. Nenhuma placa a rodou ainda.
[profiles.pico2_w_angulo]
extends         = "pico2_w_release"
ui              = "angulo"
publish         = false
ota_trust_bench = false

