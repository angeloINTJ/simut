# ---------------------------------------------------------------------------
#  Regras entre escolhas. Cada uma foi MEDIDA em 2026-09-26 compilando a
#  combinação proibida; "evidence" guarda o erro. A página as usa para travar
#  a opção com o motivo à vista, e tools/build_custom.py as reaplica antes de
#  compilar — a página não é a autoridade. Semântica: se todas as condições de
#  `when` valem, todas as de `require` têm de valer.
# ---------------------------------------------------------------------------
[[rules]]
id       = "air-needs-headless"
when     = { air = true }
require  = { display = "nenhum" }
why.en   = "Hibernation needs a build without a display."
why.pt   = "A hibernação exige uma build sem mostrador."
evidence = "TFT+air and alpha+air fail to link: multiple definition of DisplayManager::DisplayManager(). SIMUT_AIR switches on DisplayManager_None.cpp, which collides with the chosen display's DisplayManager."

[[rules]]
id       = "headless-needs-air"
when     = { display = "nenhum" }
require  = { air = true }
why.en   = "A build without a display exists only with hibernation."
why.pt   = "Uma build sem mostrador só existe com a hibernação."
evidence = "The air profile with air=false fails to link: undefined reference to DisplayManager::begin(). The headless display drops DisplayManager.cpp and the non-air boot path calls it."

[[rules]]
id       = "graph-needs-tft"
when     = { tft_graph = true }
require  = { display = "tft" }
why.en   = "The graph draws on the touch display."
why.pt   = "O gráfico é desenhado na tela touch."
evidence = "SIMUT_TFT_GRAPH follows SIMUT_DISPLAY_TFT in simut_config.h, so an alpha or Air profile with the switch on still comes out without the graph (its three units leave with the display), and forcing -DSIMUT_TFT_GRAPH=1 without the TFT stops at an #error there."

[[rules]]
id       = "air-no-buzzer"
when     = { air = true }
require  = { sound_buzzer = false }
why.en   = "The hibernating build carries no buzzer: its sound code does not compile with hibernation on."
why.pt   = "A build que hiberna não leva o buzzer: o código de som não compila com a hibernação ligada."
evidence = "air+sound_buzzer fails to compile: SoundManager.cpp: 'BuzzerNote' does not name a type. SIMUT_AIR turns SoundManager.h into the no-op class, and SoundManager.cpp has no guard of its own."

# Avisos: combinações que compilam mas carregam um risco conhecido. Não travam
# nada; a página mostra o motivo e de onde vem a evidência.
[[hazards]]
id       = "bt-flash-core1"
when     = { bluetooth = true, display = "tft" }
why.en   = "Bluetooth writes its pairing data to flash without pausing Core 1, which draws the touch display. Inferred from the framework source, never reproduced."
why.pt   = "O Bluetooth grava os dados de pareamento no flash sem pausar o Core 1, que desenha a tela touch. Inferido do código do framework, nunca reproduzido."
evidence = "MODELO_DE_RECURSOS.md R-H24 (inferred): btstack_flash_bank.cpp:53-56 writes the TLV without Core1FlashPause."
