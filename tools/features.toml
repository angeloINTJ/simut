# features.toml — o manifesto de recursos do SIMUT.
#
# Fonte única do que cada perfil de firmware liga, desliga e escolhe, e a FONTE do
# build: tools/gen_features.py o transforma em tools/generated/profiles.ini (a config
# do PlatformIO, incluida pelo platformio.ini via extra_configs) e em
# docs/configurador/model.json (a arvore do configurador). O platformio.ini nao
# define mais [env:pico_w_*]: guarda so o pico_base e os ambientes native. O portao
# tools/check_features.py prova que os perfis resolvem, flag a flag e unidade de
# traducao a unidade, para o que este manifesto descreve.
#
# Este e o passo P1 de docs/analysis/MODELO_DE_RECURSOS.md. A troca do platformio.ini
# a mao para estes perfis foi validada por build byte-a-byte: os seis firmware.bin
# saem identicos a imagem anterior. O flag SIMUT_FACTORY_RESET, que a imagem nunca
# leu, foi removido no P0 e o build conferido identico.
#
# Comentarios explicam por que, e citam a evidencia — a regra da casa.

[meta]
version   = 1
generates = ["tools/generated/profiles.ini", "docs/configurador/model.json"]
# Os ambientes de host (native_*) NAO sao modelados aqui: sao suites de teste,
# nao imagens de firmware. O portao os ignora.

# Flags que todo perfil de firmware acrescenta sobre ${pico_base.build_flags}.
[base]
common_flags = ["-DNDEBUG"]   # as seis imagens carregam NDEBUG (release ganhou em 2026-09-18)

# ---------------------------------------------------------------------------
#  A escolha do mostrador. Exatamente um valor por perfil.
#  As listas de exclusao sao as unidades de traducao que a variante NAO compila;
#  a de include, as que ela acrescenta. Resolvidas contra src/ pelo portao.
# ---------------------------------------------------------------------------
[display.tft]
# O default do simut_config.h ja e TFT=1, ALPHA=0, entao nada e emitido.
flags   = []
exclude = ["DisplayManager_Alpha.cpp"]   # a implementacao alpha nao entra

[display.alpha_paralelo]
flags   = ["-DSIMUT_DISPLAY_TFT=0", "-DSIMUT_DISPLAY_ALPHA=1", "-DHD44780_MODE_PARALLEL=1"]
exclude = [
  "DisplayManager_Touch.cpp", "DisplayManager_Settings.cpp", "DisplayManager_Graph.cpp",
  "DisplayManager_Dashboard.cpp", "DisplayManager_Calibration.cpp", "DisplayManager_Auth.cpp",
  "DisplayManager_Alarm.cpp", "DisplayManager_Calendar.cpp", "DisplayManager_Fonts.cpp",
  "DisplayManager_i18n.cpp", "DisplayManager_LangParser.cpp", "AppManager_Graph.cpp",
]
include             = ["DisplayManager_Alpha.cpp"]
ignore_display_libs = true    # o LCD nao usa ILI9341/GFX/XPT2046
web_omit            = "tft"   # a pagina recorta o bloco @IF tft

[display.nenhum]
# O mostrador headless do Air. Mantem i18n e LangParser (web e CLI os usam).
flags   = ["-DSIMUT_DISPLAY_TFT=0", "-DSIMUT_DISPLAY_ALPHA=0"]
exclude = [
  "DisplayManager_Touch.cpp", "DisplayManager_Settings.cpp", "DisplayManager_Graph.cpp",
  "DisplayManager_Dashboard.cpp", "DisplayManager_Calibration.cpp", "DisplayManager_Auth.cpp",
  "DisplayManager_Alarm.cpp", "DisplayManager_Calendar.cpp", "DisplayManager_Fonts.cpp",
  "AppManager_Graph.cpp", "DisplayManager.cpp", "DisplayManager_Alpha.cpp",
]
include             = ["DisplayManager_None.cpp"]
ignore_display_libs = true
web_omit            = "tft"

[libs]
display = ["Adafruit ILI9341", "Adafruit GFX Library", "XPT2046_Touchscreen"]

# ---------------------------------------------------------------------------
#  Os interruptores. `emit` diz como o flag e escrito, e por que:
#    value      -> sempre -D<macro>=0 ou =1        (chave de valor)
#    on_is_1    -> ligado -D<macro>=1, desligado nada  (macro de presenca:
#                  emitir =0 ligaria, porque o teste e #ifdef — R-S27)
#    off_is_0   -> ligado nada (default do config), desligado -D<macro>=0
#    bare       -> ligado -D<macro>, desligado nada
#    none       -> sem macro; so mexe em arquivo e biblioteca
# ---------------------------------------------------------------------------
[toggles.cli_full]
macro = "SIMUT_CLI_FULL"
emit  = "value"

[toggles.web_https]
macro = "SIMUT_WEB_HTTPS"
emit  = "on_is_1"        # #ifdef: -DSIMUT_WEB_HTTPS=0 LIGA o servidor (defeito Z08)

[toggles.license_stub]
macro = "SIMUT_LICENSE_STUB"
emit  = "on_is_1"

[toggles.mdns]
macro = "SIMUT_MDNS"
emit  = "off_is_0"       # default do config e 1

[toggles.concurrency_asserts]
macro       = "SIMUT_CONCURRENCY_ASSERTS"
emit        = "bare"
off_exclude = ["ConcurrencyAsserts.cpp"]  # a ponte do tripwire; so existe ligado

[toggles.bluetooth]
macro          = "SIMUT_BLUETOOTH"
emit           = "on_is_1"
on_flags       = ["-DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH"]  # so este flag troca o blob e liblwip-bt
off_exclude    = ["BluetoothManager.cpp"]
off_lib_ignore = ["SerialBT"]  # o LDF segue o #include mesmo desligado; sem o ignore o link morre

[toggles.air]
macro      = "SIMUT_AIR"
emit       = "on_is_1"
on_include = ["air/*.c"]

[toggles.sound_buzzer]
macro          = "SIMUT_SOUND_BUZZER"
emit           = "off_is_0"       # default do config e 1; desligado -DSIMUT_SOUND_BUZZER=0.
                                  # Antes era `none` (so exclusao de arquivo), o que so
                                  # linkava sob SIMUT_AIR — SoundManager.h so virava no-op
                                  # la. Com macro proprio, um perfil TFT/normal tambem larga
                                  # o buzzer e poupa (ECONOMIA_DE_RECURSOS.md, 2026-09-26).
off_exclude    = ["SoundManager.cpp"]
off_lib_ignore = ["BuzzerPIO_RP2040"]

# Os três drivers de sensor (2026-09-26). O default do simut_config.h é 1, então
# ligado não emite nada e o profiles.ini não muda; desligado emite -D<macro>=0,
# que o #178 provou compilar e encolher a imagem (drivers por classe, #172-175).
# Os drivers ainda são headers: não há .cpp a excluir — o linker descarta o que
# a guarda deixa sem referência.
[toggles.sensor_ds18b20]
macro = "SIMUT_SENSOR_DS18B20"
emit  = "off_is_0"

[toggles.sensor_dht22]
macro = "SIMUT_SENSOR_DHT22"
emit  = "off_is_0"

[toggles.sensor_bme280]
macro = "SIMUT_SENSOR_BME280"
emit  = "off_is_0"

# ---------------------------------------------------------------------------
#  Os perfis. Os seis ambientes de firmware que o CI constroi hoje.
#  `extends` herda o dicionario de recursos do pai e sobrescreve.
# ---------------------------------------------------------------------------
# pico_w_release — a imagem do usuario.
#   -DNDEBUG (2026-09-18, alavanca 2 de DIETA_FLASH.md): -6.832 B de .bin. src/ nao
#   tem assert( ) de runtime (so _Static_assert, que NDEBUG nao toca), entao o que
#   isso desliga sao as checagens internas do pico-sdk e do LittleFS e as strings
#   __FILE__ delas, entre elas um caminho absoluto de 116 B da maquina de build que
#   saia na imagem publicada.
[profiles.pico_w_release]
display             = "tft"
cli_full            = false
web_https           = true
license_stub        = false
mdns                = true
concurrency_asserts = false
bluetooth           = false
air                 = false
sound_buzzer        = true
sensor_ds18b20      = true
sensor_dht22        = true
sensor_bme280       = true
build_type          = "release"
publish             = true

# pico_w_test — imagem de bancada, CLI completa. Nao publicada; orcamento proprio.
#   Carrega a CLI completa e, desde 2026-08-17, a UI web inteira. Medido em e14170f,
#   12 paginas embutidas: sem alavanca estourava o FLASH por 856 B; com parseIntStrict
#   no lugar de sscanf, 6.604 B livres (cabe, sem margem); com +SIMUT_MDNS=0, 21.980 B.
#   -DSIMUT_MDNS=0: 15.376 B medidos; as suites acham a placa por USB (udevadm) e falam
#   por IP, nenhuma resolve SIMUT.local (a release mantem mDNS). -DSIMUT_LICENSE_STUB
#   mantem o texto da licenca fora da imagem. Quando faltar espaco, tire DAQUI, nunca da
#   release. As suites dirigem por serial com enable/configure terminal/write memory/
#   user .../touch sim. O build_flags e re-derivado do pico_base, nao anexado ao da
#   release, senao ficaria -DSIMUT_CLI_FULL=0 e =1 na mesma linha.
[profiles.pico_w_test]
display       = "tft"
cli_full      = true
web_https     = false
license_stub  = true
mdns          = false
bluetooth     = false
air           = false
sound_buzzer  = true
sensor_ds18b20 = true
sensor_dht22  = true
sensor_bme280 = true
build_type    = "release"
publish       = false

# pico_w_test_https — a unica imagem com CLI completa E servidor TLS. Nao publicada.
#   Existe porque validar o servidor HTTPS pede duas coisas que nenhuma imagem de campo
#   junta: o servidor so compila com SIMUT_WEB_HTTPS (release), cujo console de
#   emergencia nao cria a conta descartavel das suites web; a pico_w_test tem as contas
#   e nao tem TLS. Os numeros do PR #137 (POST /api/tls) sairam de um env assim, digitado
#   a mao e apagado depois. custom_fs_pages ALARMS/FILE/TEL (2026-09-20, config v25): so
#   este env ficou sem espaco (a politica de PIN custa ~7,1 kB). O portao de flash confere
#   DOIS numeros e o teto de OTA e o mais apertado: so ALARMS_PAGE fora deixou o .bin
#   1.420 B acima do teto de 1.040.384 B mesmo com a regiao cabendo. Sao as duas paginas
#   que um soak HTTPS menos toca; TEL_PAGE entra por folga (com duas fora o .bin ficava
#   3.732 B sob o teto, menos de um setor de 4 KiB). Suba data/web/{alarms,files,tel}.
#   html.gz para /web/ antes de uma suite, ou as rotas dao "Page asset missing" (POST
#   /api/upload, nunca uploadfs).
[profiles.pico_w_test_https]
extends         = "pico_w_test"
web_https       = true
custom_fs_pages = ["ALARMS_PAGE", "FILE_PAGE", "TEL_PAGE"]

# pico_w_asserts — release com o invariante 3 de concorrencia armado (T1.6). Nao publicada.
#   -DSIMUT_CONCURRENCY_ASSERTS transforma FLASH_OP num tripwire que loga quem entra nele
#   segurando o _stateMutex: imagem para um soak que cace regressao do invariante 3.
#   Existe porque o pico_w_debug (onde o flag era documentado) nao linka: a -Og e sem
#   --gc-sections a imagem estoura o slot de 1020 KB por ~69 KB. Ver a nota "sem env de
#   debug" no platformio.ini.
[profiles.pico_w_asserts]
extends             = "pico_w_release"
concurrency_asserts = true
publish             = false

# pico_w_alpha — LCD HD44780 16x2 no lugar do TFT. Economiza ~30 KB tirando a UI grafica.
#   Mantem BluetoothManager.cpp + SerialBT (console BT para o modo AP). O painel de toque
#   nao existe: o #if SIMUT_DISPLAY_TFT do WebManager_Core.cpp nao registra
#   /api/screen_stream, /touch, /screenshot nem /keypad, e custom_web_omit=tft recorta o
#   bloco @IF tft da pagina.
[profiles.pico_w_alpha]
display       = "alpha_paralelo"
cli_full      = false
web_https     = false
license_stub  = false
mdns          = false
bluetooth     = true
air           = false
sound_buzzer  = true
sensor_ds18b20 = true
sensor_dht22  = true
sensor_bme280 = true
publish       = true

# pico_w_air — build headless que hiberna (sem display, sem buzzer).
#   Mesmo conjunto de fontes do alpha (TFT/toque/UI fora, driver HD44780 mantido mas nunca
#   iniciado), mais: SIMUT_AIR=1 (headless + ciclo dormant); SIMUT_CLI_FULL=1 desde
#   2026-09-18 — era 0 porque nao cabia (a conta de 2026-09-06 foi contra 876 B de folga, e
#   a CLI completa custa +45.056 B), e a dieta da v2.4.9-beta liberou 62.420 B (977.964 ->
#   1.023.020 B medidos, 17.364 B sob o teto de OTA); esta imagem e a que mais precisa,
#   headless, o console serial/BT e a UNICA interface local. SIMUT_MDNS=0 desde a
#   v2.4.4-beta: o responder nunca anunciava e a imagem de OTA fica no teto de 1016 KiB,
#   tirar (~15 KiB) mantem o Air atualizavel (ver #118). SoundManager.cpp fora: buzzer
#   dropado (SoundManager.h e no-op sob SIMUT_AIR). A config do Air (wake, idle, ...) vive
#   em /config/air.bin, NAO no SystemConfig (o CONFIG_VERSION do SystemConfig e 25 na
#   v2.7.3; o comentario antigo do env dizia "stays 21" e estava errado).
[profiles.pico_w_air]
display       = "nenhum"
cli_full      = true
web_https     = false
license_stub  = true
mdns          = false
bluetooth     = true
air           = true
sound_buzzer  = false
sensor_ds18b20 = true
sensor_dht22  = true
sensor_bme280 = true
publish       = true

# ===========================================================================
