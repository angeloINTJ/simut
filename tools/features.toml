# A escolha da rede (2026-10-13, pedido do mantenedor de um configurador "o mais modular
# possivel"). Fica no grupo Rede, como o interruptor `lan` ficava, e o aviso
# enc28j60-unsoaked diz que nenhuma imagem com o cabo passou ainda por um soak (ate entao
# a rede por cabo morava no grupo da bancada, fechado). Num chip em que o driver nao tem
# placa (o ENC28J60 no Pico 2 W) o gerador o recusa e a pagina trava a opcao com o motivo
# de `unsupported`; com o DS18B20 e o DHT22 juntos, no RP2040, o orcamento de PIO a trava
# ([ui_budget], tools/pio_budget.py).
[ui_net]
group    = "network"
label.en = "Connection"
label.pt = "Conexão"
label.es = "Conexión"

[ui_nets.cyw43]
order    = 1
label.en = "Wi-Fi (the board's CYW43 radio)"
label.pt = "Wi-Fi (o rádio CYW43 da placa)"
label.es = "Wi-Fi (la radio CYW43 de la placa)"
help.en  = "The radio of the Pico W and the Pico 2 W: the device joins a network by its name and password, and offers a setup access point."
help.pt  = "O rádio do Pico W e do Pico 2 W: o aparelho entra numa rede pelo nome e pela senha, e oferece um ponto de acesso para a configuração."
help.es  = "La radio de la Pico W y la Pico 2 W: el equipo entra en una red por su nombre y contraseña, y ofrece un punto de acceso para la configuración."

[ui_nets.enc28j60]
order    = 2
label.en = "Network cable (ENC28J60 module)"
label.pt = "Cabo de rede (módulo ENC28J60)"
label.es = "Cable de red (módulo ENC28J60)"
help.en  = "Builds for a plain Raspberry Pi Pico, which has no radio, with an ENC28J60 module on GP11 to GP15: sensor slots go from 16 to 11. Bluetooth and hibernation run on the radio, so they are not available."
help.pt  = "Compila para um Raspberry Pi Pico comum, que não tem rádio, com um módulo ENC28J60 nos GP11 a GP15: os slots de sensor caem de 16 para 11. O Bluetooth e a hibernação rodam no rádio, então não ficam disponíveis."
help.es  = "Compila para una Raspberry Pi Pico común, que no tiene radio, con un módulo ENC28J60 en los GP11 a GP15: las ranuras de sensor bajan de 16 a 11. El Bluetooth y la hibernación funcionan con la radio, así que no están disponibles."
unsupported.en = "The ENC28J60 exists only for the plain Pico (RP2040) so far: the Pico 2 W (RP2350) has no board for it."
unsupported.pt = "O ENC28J60 só existe, por enquanto, para o Pico comum (RP2040): o Pico 2 W (RP2350) não tem placa para ele."
unsupported.es = "El ENC28J60 solo existe, por ahora, para la Pico común (RP2040): la Pico 2 W (RP2350) no tiene placa para él."

# A escolha da UI do painel touch (2026-10-14). Fica no grupo Interface, com as chaves da tela. O
# Ângulo é um estudo ainda não aprovado para produtos, e o texto dele diz isso e diz o que custa: só
# existe com a tela touch (a regra angulo-needs-tft trava a opção nas outras, com o motivo à vista),
# e o custo em flash dele, medido em 2026-10-21 como a diferença entre duas imagens do Pico 2 W (docs/analysis/UI_DRIVERS.md seção 3.6, a medida que a evidência de
# angulo-cyw43-needs-rp2350 cita), vai no texto com a data: a matriz de custos só conhece chaves e redes, e não o traz.
[ui_panel]
group    = "interface"
label.en = "Touch display look"
label.pt = "Visual da tela touch"
label.es = "Aspecto de la pantalla táctil"

[ui_panels.original]
order    = 1
label.en = "Original look"
label.pt = "Visual original"
label.es = "Aspecto original"
help.en  = "The touch display as every release has shipped it, with its themes. It is the only choice on the 16x2 LCD and with no display."
help.pt  = "A tela touch como toda release a entregou, com os temas dela. É a única opção no LCD 16x2 e sem mostrador."
help.es  = "La pantalla táctil como la entregó cada versión, con sus temas. Es la única opción con el LCD 16x2 y sin pantalla."

[ui_panels.angulo]
order    = 2
label.en = "Ângulo look (study)"
label.pt = "Visual Ângulo (estudo)"
label.es = "Aspecto Ángulo (estudio)"
help.en  = "A study of a new look for the touch display, drawn to the Ângulo standard. Not approved for products yet: it needs the touch display. On the Pico 2 W its image is 31,008 B larger than the original look's (measured on 2026-10-21; docs/analysis/UI_DRIVERS.md section 3.6)."
help.pt  = "Um estudo de um visual novo para a tela touch, desenhado no padrão Ângulo. Ainda não aprovado para produtos: exige a tela touch. No Pico 2 W a imagem dele é 31.008 B maior que a do visual original (medido em 21/10/2026; docs/analysis/UI_DRIVERS.md seção 3.6)."
help.es  = "Un estudio de un aspecto nuevo para la pantalla táctil, dibujado según el estándar Ángulo. Aún no aprobado para productos: requiere la pantalla táctil. En la Pico 2 W su imagen es 31.008 B mayor que la del aspecto original (medido el 21/10/2026; docs/analysis/UI_DRIVERS.md sección 3.6)."

