help.pt  = "Compila para um Raspberry Pi Pico comum, que não tem rádio, e pega a rede de um módulo ENC28J60 no cabo. O Bluetooth e a hibernação rodam no rádio, então não podem ficar ligados com ela."
help.es  = "Compila para una Raspberry Pi Pico común, que no tiene radio, y toma la red de un módulo ENC28J60 por el cable. El Bluetooth y la hibernación funcionan con el radio, así que no pueden estar activos con ella."
unsupported.en = "The wired network exists only for the plain Pico (RP2040) so far: the Pico 2 W (RP2350) has no board for it."
unsupported.pt = "A rede por cabo só existe, por enquanto, para o Pico comum (RP2040): o Pico 2 W (RP2350) não tem placa para ela."

# ---------------------------------------------------------------------------
#  Regras entre escolhas. Cada uma foi MEDIDA em 2026-09-26 compilando a
#  combinação proibida; "evidence" guarda o erro. A página as usa para travar
#  a opção com o motivo à vista, e tools/build_custom.py as reaplica antes de
#  compilar — a página não é a autoridade. Semântica: se todas as condições de
#  `when` valem, todas as de `require` têm de valer.
# ---------------------------------------------------------------------------
[[rules]]
id       = "air-needs-headless"
when     = { air = true }
require  = { display = "nenhum" }
why.en   = "Hibernation needs a build without a display."
why.pt   = "A hibernação exige uma build sem mostrador."
evidence = "TFT+air and alpha+air fail to link: multiple definition of DisplayManager::DisplayManager(). SIMUT_AIR switches on DisplayManager_None.cpp, which collides with the chosen display's DisplayManager."

[[rules]]
id       = "headless-needs-air"
when     = { display = "nenhum" }
require  = { air = true }
why.en   = "A build without a display exists only with hibernation."
why.pt   = "Uma build sem mostrador só existe com a hibernação."
evidence = "The air profile with air=false fails to link: undefined reference to DisplayManager::begin(). The headless display drops DisplayManager.cpp and the non-air boot path calls it."

[[rules]]
id       = "graph-needs-tft"
when     = { tft_graph = true }
require  = { display = "tft" }
why.en   = "The graph draws on the touch display."
why.pt   = "O gráfico é desenhado na tela touch."
evidence = "SIMUT_TFT_GRAPH follows SIMUT_DISPLAY_TFT in simut_config.h, so an alpha or Air profile with the switch on still comes out without the graph (its three units leave with the display), and forcing -DSIMUT_TFT_GRAPH=1 without the TFT stops at an #error there."

[[rules]]
id       = "air-no-buzzer"
when     = { air = true }
require  = { sound_buzzer = false }
why.en   = "The hibernating build carries no buzzer: its sound code does not compile with hibernation on."
why.pt   = "A build que hiberna não leva o buzzer: o código de som não compila com a hibernação ligada."
evidence = "air+sound_buzzer fails to compile: SoundManager.cpp: 'BuzzerNote' does not name a type. SIMUT_AIR turns SoundManager.h into the no-op class, and SoundManager.cpp has no guard of its own."

[[rules]]
id       = "lan-no-bluetooth"
when     = { lan = true }
require  = { bluetooth = false }
why.en   = "Bluetooth runs on the Wi-Fi radio, which a wired build does not have."
why.pt   = "O Bluetooth roda no rádio do Wi-Fi, que uma build por cabo não tem."
why.es   = "El Bluetooth funciona en el radio del Wi-Fi, que una build por cable no tiene."
evidence = "SIMUT_NET_LAN with SIMUT_BLUETOOTH stops at an #error in simut_config.h, pinned by tools/test_pin_masks.py (2026-10-12). Not compiled past that #error: the Bluetooth stack (SerialBT, BTstack) rides on the CYW43, and board = rpipico has none."

[[rules]]
id       = "lan-no-air"
when     = { lan = true }
require  = { air = false }
why.en   = "Hibernation is built around the Wi-Fi radio, which it powers down between wakes. A wired build has none."
why.pt   = "A hibernação é feita em torno do rádio do Wi-Fi, que ela desliga entre os despertares. Uma build por cabo não tem rádio."
why.es   = "La hibernación gira en torno al radio del Wi-Fi, que apaga entre los despertares. Una build por cable no tiene radio."
evidence = "SIMUT_NET_LAN with SIMUT_AIR stops at an #error in simut_config.h, pinned by tools/test_pin_masks.py (2026-10-12). Not compiled past that #error: AppManager_Air.cpp powers the CYW43 down through GPIO23 (WL_REG_ON) before every sleep, and board = rpipico has no CYW43."

# O que o orcamento de PIO e de pinos recusa (tools/pio_budget.py, 2026-10-13), com as
# palavras que a pagina mostra: `why` e o problema; `fix`, o remedio, com {list} trocado
# pelos rotulos de [ui_toggles] das chaves que, desligadas uma de cada vez, fazem caber,
# separados por "; "; `fix_one`, o mesmo remedio quando a lista tem um item so. A trava de
# uma chave a tira da lista (desligar a chave que se quer ligar nao e remedio) e, se nao
# sobra nenhuma, fica so o problema. {pin} e o GPIO de um pin-conflict. O mesmo texto vale no
# CI (tools/build_custom.py), e o model.json leva, por chip, cada recusa. Todo id de
# pio_budget.REFUSAL_IDS precisa dos tres, nas duas linguas, mesmo o que nenhuma imagem acende
# hoje.
[ui_budget.pio-budget]
why.en     = "This does not fit the PIO blocks of this chip."
why.pt     = "Isto não cabe nos blocos PIO deste chip."
fix.en     = "Turn off one of these: {list}."
fix.pt     = "Desligue um destes: {list}."
fix_one.en = "Turn off: {list}."
fix_one.pt = "Desligue: {list}."

[ui_budget.pin-conflict]
why.en     = "Two features claim GP{pin}."
why.pt     = "Dois recursos disputam o GP{pin}."
fix.en     = "Turn off one of these: {list}."
fix.pt     = "Desligue um destes: {list}."
fix_one.en = "Turn off: {list}."
fix_one.pt = "Desligue: {list}."

# Avisos: combinações que compilam mas carregam um risco conhecido. Não travam
# nada; a página mostra o motivo e de onde vem a evidência.
[[hazards]]
id       = "lan-unsoaked"
when     = { lan = true }
why.en   = "The wired network has run on the bench, not yet through a soak: a build with it is a bench build."
why.pt   = "A rede por cabo rodou na bancada, mas ainda não passou por um soak: uma build com ela é de bancada."
evidence = "2026-10-13: pico_wiretft on the Wire rig, web and console over the cable for hours; no image with lan has run a 72 h soak."

[[hazards]]
id       = "bt-flash-core1"
when     = { bluetooth = true, display = "tft" }
why.en   = "Bluetooth writes its pairing data to flash without pausing Core 1, which draws the touch display. Inferred from the framework source, never reproduced."
why.pt   = "O Bluetooth grava os dados de pareamento no flash sem pausar o Core 1, que desenha a tela touch. Inferido do código do framework, nunca reproduzido."
evidence = "MODELO_DE_RECURSOS.md R-H24 (inferred): btstack_flash_bank.cpp:53-56 writes the TLV without Core1FlashPause."
