; ============================================================================
;  SIMUT — Sistema Integrado de Monitoramento Universal e Telemetria
;  Integrated Universal Monitoring and Telemetry System
;  Target: Raspberry Pi Pico W (RP2040), framework Arduino-Pico (earlephilhower)
; ============================================================================

[platformio]
default_envs = pico_w_release
src_dir = src

; ============================================================================
;  HW base — shared config for release/debug environments (RP2040 Pico W)
;  [env:native] does NOT extend this: standalone for host-side testing
; ============================================================================
[pico_base]
; Pinned to the commit that built v2.1.0-beta. It used to track the branch head,
; which meant a fresh clone could compile against a different framework than the
; one every measurement in docs/ was taken on — and the four overrides in
; tools/arduino_pico_overrides/ are diffs against specific upstream sources, so
; a silent framework bump does not fail loudly, it fails as a patch that no
; longer applies to code nobody re-read.
;
; This commit resolves to framework-arduinopico 1.50403.0 (arduino-pico 5.4.3),
; itself pinned by the platform manifest to sha 30aead9a. Moving to 5.6.0 is the
; first post-beta task; when it happens, bump this line and run patch.sh — never
; one without the other.
platform         = https://github.com/maxgerhardt/platform-raspberrypi.git#cc24cfef37ed22ca9f2a6aead28c2deb76c39f24
framework        = arduino
board            = rpipicow
board_build.core = earlephilhower

build_src_filter =
    +<*.cpp>
    +<*.c>
    +<*.h>
    +<*.hpp>
    +<*.ino>
    +<ota/*.cpp>
    +<ota/*.h>

; --- LittleFS partition (1 MB) ---
board_build.filesystem_size = 1m

; --- Upload / monitor ---
upload_protocol  = picotool
monitor_speed    = 115200

; --- Build flags: optimize for size ---
; -flto is non-functional with earlephilhower toolchain (compiled with --disable-lto).
; Without LTO, splitting DisplayManager.cpp adds ~2 KB per .cpp overhead.
;
; User-configurable feature flags (sensors, display, MDNS, BT) are now in
; src/simut_config.h. Override any flag here if needed — -D flags take
; precedence over simut_config.h defaults.
;
; PIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH is deliberately absent. It used to
; live here, which selected the liblwip-bt.a variant (lwIP + the whole BTstack)
; and the *combined* WiFi+BT radio blob — while BluetoothManager.cpp was
; excluded from every shipping env and simut_config.h kept SIMUT_BLUETOOTH=0,
; i.e. the class was stubs and nothing ever called it. Measured cost of that
; flag: 64732 B of flash and 16416 B of .bss. Dropping it took the real flash
; headroom from 4740 B to 69472 B and the heap from 130704 B to 147120 B; on
; hardware the largest contiguous heap block went 11483 B -> 35776 B, which is
; the number BearSSL actually cares about. See docs/ANALISE_FLASH_RAM.md.
;
; To bring Bluetooth back, do NOT re-add it here — add a dedicated env that
; sets the flag, drops the SerialBT lib_ignore below, keeps
; BluetoothManager.cpp in build_src_filter and defines SIMUT_BLUETOOTH=1.
build_flags =
    -DPICO_CYW43_SUPPORTED=1
    -Os
    -fmerge-all-constants
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-format-truncation
    -Wno-implicit-fallthrough
    -I src
    -specs=nano.specs
    -Wl,-u,_printf_float

; --- T0.1: intercept the SDK flash primitives to time the IRQ-off window.
;     The shims are in src/FlashIrqProbe.cpp and MUST stay SRAM-resident;
;     tools/check_flash_probe.py fails the build if they are not. ---
    -Wl,--wrap=flash_range_erase
    -Wl,--wrap=flash_range_program

; --- External libraries (pinned for reproducibility) ---
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit ILI9341@1.6.3
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9
    knolleary/PubSubClient@2.8
    https://github.com/angeloINTJ/OneWirePIO_RP2040.git#3f0251e64ff441337fb0fb6ccfbad479e9530daa
    https://github.com/angeloINTJ/DHT22PIO_RP2040.git#d500e4d4a93078429fe0c876476f8da904b389ed
    https://github.com/angeloINTJ/BuzzerPIO_RP2040.git#ab8eab1d6102d6972444e3c909408d76b2bd7f13
    https://github.com/angeloINTJ/TwoWirePIO_RP2040.git#v1.3.5
    https://github.com/angeloINTJ/BMx280PIO_RP2040.git#v1.3.1

; --- Libraries kept out of the link ---
; SerialBT is mandatory here, not cosmetic. BluetoothManager.h has
; `#include <SerialBT.h>` inside `#if SIMUT_BLUETOOTH`, and the PlatformIO LDF
; walks the include even though the branch is off. Without this the build dies
; in cores/rp2040/_needsbt.h: "This library needs Bluetooth enabled".
; NOTE: envs that declare their own lib_ignore REPLACE this list rather than
; extend it — repeat SerialBT there (see pico_w_alpha).
lib_ignore =
    SerialBT

; --- Pre-build: regenerate WebUI_GZ.h from WebUI.h ---
; --- Post-build: assert the flash-probe shims linked into SRAM ---
extra_scripts =
    pre:tools/build_webui_gz.py
    pre:tools/build_favicon_header.py
    pre:tools/check_cli_help.py
    pre:tools/check_logcodes.py
    pre:tools/check_channels.py
    pre:tools/check_lang_packs.py
    post:tools/check_flash_probe.py

; ============================================================================
;  Release environment
; ============================================================================
[env:pico_w_release]
; HistoryV4.cpp is out of every shipping image from 2.0.1-alpha on: R7 of
; docs/HistoryV5_Instrucoes_Implementacao.md says the firmware carries no
; reader for the legacy format. The header stays (StorageManager keeps the
; V4 signatures as delegating shims) but no V4 codec is linked.
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
    -<HistoryV4.cpp>
extends    = pico_base
build_flags = ${pico_base.build_flags} -DSIMUT_FACTORY_RESET=1 -DSIMUT_CLI_FULL=0
build_type = release

; ============================================================================
;  Release image with the full serial CLI (SIMUT_CLI_FULL=1)
;  Build: pio run -e pico_w_test
;
;  Same source set and optimisation as pico_w_release, so bench timings stay
;  comparable. The difference is the CLI surface: release ships the 9
;  emergency commands (see SystemDefs_Cli.h), while every configuration path
;  lives in the web UI.
;
;  This env exists for the automated suites under tools/ — pico_test_suite.py,
;  web_test_suite.py, save_storm.py and sensor_soak.py drive the device over
;  serial with `enable`, `configure terminal`, `write memory`, `show *`,
;  `user add/del/perm`, `system name` and `touch sim`. web_test_suite.py in
;  particular bootstraps its throwaway account through the CLI precisely
;  because it cannot authenticate yet. Flash the test image before a suite
;  run; flash release for anything a user will touch.
;
;  build_flags is re-derived from pico_base rather than appended to
;  pico_w_release's, because appending would leave both -DSIMUT_CLI_FULL=0
;  and =1 on the command line.
; ============================================================================
[env:pico_w_test]
extends    = env:pico_w_release
build_flags = ${pico_base.build_flags} -DSIMUT_FACTORY_RESET=1 -DSIMUT_CLI_FULL=1
build_type = release

; ============================================================================
;  Debug environment
; ============================================================================
; DisplayManager_Alpha.cpp is an alternative display implementation: it
; redefines DisplayManager members that the split DisplayManager_*.cpp files
; already provide, so it must be excluded exactly as the release env does or
; the link dies in duplicate symbols.
;
; This env carries -DSIMUT_CONCURRENCY_ASSERTS, which is what arms the
; invariant-3 tripwire in FLASH_OP (T1.6). Without it the assert compiles to
; nothing in every environment and the invariant is unguarded.
; KNOWN LIMITATION — this env compiles but does not link. build_type=debug
; builds at -Og and drops --gc-sections, and the image overflows FLASH.
; Forcing -Os and restoring --gc-sections here was tried and made it worse, so
; the state is recorded rather than papered over.
; Dropping Bluetooth (see pico_base) cut the overflow from ~69 KB to
; 16576 bytes — measured 2026-07-26. It is now within reach: the next 16 KB
; are available from the WebUI_GZ pages still embedded in flash (70902 B,
; migratable to LittleFS via FS_PAGES) or from -DNDEBUG (6600 B).
; See docs/ANALISE_FLASH_RAM.md.
;
; The duplicate-symbol and undefined-reference failures it used to have ARE
; fixed: DisplayManager_Alpha.cpp is excluded as in release, and the two
; ODR-used `static const` members became constexpr.
;
; To run the concurrency tripwire on hardware, use pico_w_asserts below.
[env:pico_w_debug]
extends     = pico_base
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
build_type  = debug
build_flags = ${pico_base.build_flags} -DSIMUT_DEBUG_BUILD=1

; ============================================================================
;  Release image with concurrency invariant 3 armed (T1.6)
;  Same optimisation and source set as pico_w_release, so it fits and runs at
;  bench speed; -DSIMUT_CONCURRENCY_ASSERTS turns FLASH_OP into a tripwire that
;  logs the moment anyone enters it while holding _stateMutex. This is the env
;  to flash for a soak meant to catch an invariant-3 regression, instead of
;  waiting for the intermittent deadlock it eventually causes.
;
;  It exists because pico_w_debug — where the flag was documented to live —
;  does not link: at -Og and without --gc-sections the image overflows the
;  1020 KB app slot by ~69 KB, and the slot is already ~97% full at -Os.
; ============================================================================
[env:pico_w_asserts]
extends     = env:pico_w_release
build_flags = ${env:pico_w_release.build_flags} -DSIMUT_CONCURRENCY_ASSERTS

; ============================================================================
;  Native (host) environment for unit testing
;  Run: pio test -e native
;  Covers pure validators: parseIntStrict, isValidIpv4, isSafeUploadFilename,
;  isValidName, isValidCfgString, isInRange, dallasCrc8, floatToI16/i16ToFloat,
;  timeReached, timeSince. No hardware dependencies.
; ============================================================================
[env:native]
platform         = native
test_framework   = unity
build_src_filter = -<*>
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_validators

; ============================================================================
;  Native (host) environment for HistoryV4 codec unit testing
;  Run: pio test -e native_history_v4
;  Covers bit-packing, anchor/delta encode-decode, NaN sentinel, multi-record
;  across anchor boundaries, buffer overflow, measurement key generation,
;  and the zigzag varints (which moved into HistoryV4.cpp when the v2/v3
;  codec was deleted — [env:native_history] went with it).
; ============================================================================
[env:native_history_v4]
platform         = native
test_framework   = unity
build_src_filter = -<*> +<HistoryV4.cpp>
test_build_src = true
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_history_v4

; ============================================================================
;  Native (host) environment for the HistoryV5 codec
;  Run: pio test -e native_history_v5
;  Covers the §12 "unit" row of docs/HistoryV5_Instrucoes_Implementacao.md:
;  CRC vector, zigzag, MSB-first bit I/O (including the drain window that
;  sealStream depends on), every value/time prefix width, NAN semantics,
;  RAW fallback, tail accessors for nCh in {1,3,12,16}, SCHEMA framing,
;  chunk rejection, file scan/seek, mid-day schema change, and a property
;  sweep. HistoryV5.cpp has no Arduino dependency, so it compiles as-is.
;
;  Bit-exact parity against tools/history_v5.py is a separate gate:
;  tools/check_history_v5_parity.py.
; ============================================================================
[env:native_history_v5]
platform         = native
test_framework   = unity
build_src_filter = -<*> +<HistoryV5.cpp>
test_build_src   = true
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_history_v5

; ============================================================================
;  Native CLI parser tests — issue #42
;  Run: pio test -e native_cli
;  Compiles production CommandParser.cpp (no CommandManager I/O deps).
; ============================================================================
[env:native_cli]
platform         = native
test_framework   = unity
build_src_filter = -<*> +<CommandParser.cpp>
test_build_src   = true
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_command_parser

; ============================================================================
;  Alpha display (HD44780 16x2) — minimal build without TFT/touch/UI
;  Build: pio run -e pico_w_alpha
;  Saves ~30 KB flash by excluding all graphical UI code.
; ============================================================================

[env:pico_w_alpha]
extends     = pico_base
build_flags = ${pico_base.build_flags}
    -DSIMUT_DISPLAY_TFT=0
    -DSIMUT_DISPLAY_ALPHA=1
    -DHD44780_MODE_PARALLEL=1
; Alpha: release build but with HD44780 LCD instead of TFT.
; Excludes TFT GUI files + BT. Adds Alpha display driver.
build_src_filter = ${pico_base.build_src_filter}
    -<BluetoothManager.cpp>
    -<DisplayManager_Touch.cpp>
    -<DisplayManager_Settings.cpp>
    -<DisplayManager_Graph.cpp>
    -<DisplayManager_Dashboard.cpp>
    -<DisplayManager_Calibration.cpp>
    -<DisplayManager_Auth.cpp>
    -<DisplayManager_Alarm.cpp>
    -<DisplayManager_Calendar.cpp>
    -<DisplayManager_Fonts.cpp>
    -<DisplayManager_i18n.cpp>
    -<DisplayManager_LangParser.cpp>
    -<AppManager_Graph.cpp>
    +<DisplayManager_Alpha.cpp>
lib_ignore =
    SerialBT
    Adafruit ILI9341
    Adafruit GFX Library
    XPT2046_Touchscreen
