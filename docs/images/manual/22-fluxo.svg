<text class="dg-t dg-b" x="372" y="260">broker</text>
<rect class="dg-caixa" x="568.5" y="240.5" width="119" height="63" rx="6"/>
<text class="dg-t dg-b" x="580" y="260">coletor</text>
<text class="dg-n dg-c2" x="580" y="276">grava e publica</text>
<text class="dg-n dg-c2" x="580" y="292">a confirmação</text>
<polyline class="dg-fio-acento" points="144,256 360,256" marker-end="url(#22-fluxo-ponta-acento)"/>
<text class="dg-n" x="184" y="248">publish em <tspan class="dg-m">&lt;tópico&gt;/alarm</tspan></text>
