<text class="dg-n dg-m" x="80" y="216" text-anchor="middle">seq 2</text>
<rect class="dg-caixa" x="32.5" y="232.5" width="95" height="23" rx="6"/>
<text class="dg-n dg-m" x="80" y="248" text-anchor="middle">seq 3</text>
<rect class="dg-caixa-2" x="168.5" y="16.5" width="535" height="159" rx="12"/>
<text class="dg-t dg-b" x="184" y="40">HTTP</text>
<rect class="dg-caixa" x="568.5" y="80.5" width="119" height="87" rx="6"/>
