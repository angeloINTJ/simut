<polyline class="dg-fio-ok" points="392,272 392,312 144,312" marker-end="url(#22-fluxo-ponta-ok)"/>
<text class="dg-n" x="184" y="332">seq 1, 2 e 3 em <tspan class="dg-m">&lt;tópico&gt;/alarm/ack</tspan></text>
<text class="dg-n dg-c2" x="184" y="348">o aparelho tira os três da fila</text>
<text class="dg-t" x="184" y="384">Sem a confirmação, a fila inteira é publicada de novo a cada 15 s.</text>
