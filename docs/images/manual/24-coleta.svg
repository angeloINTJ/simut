<text class="dg-n" x="72" y="440" text-anchor="middle">4 s</text>
<text class="dg-n dg-c2" x="72" y="480" text-anchor="middle">2º</text>
<rect class="dg-caixa-2" x="96.5" y="440.5" width="31" height="23" rx="0"/>
<text class="dg-n" x="112" y="432" text-anchor="middle">8 s</text>
<text class="dg-n dg-c2" x="112" y="480" text-anchor="middle">3º</text>
<rect class="dg-caixa-2" x="136.5" y="432.5" width="31" height="31" rx="0"/>
<text class="dg-n" x="152" y="424" text-anchor="middle">16 s</text>
<text class="dg-n dg-c2" x="152" y="480" text-anchor="middle">4º</text>
<rect class="dg-caixa-2" x="176.5" y="424.5" width="31" height="39" rx="0"/>
<text class="dg-n" x="192" y="416" text-anchor="middle">32 s</text>
<text class="dg-n dg-c2" x="192" y="480" text-anchor="middle">5º</text>
<rect class="dg-caixa-2" x="216.5" y="416.5" width="31" height="47" rx="0"/>
<text class="dg-n" x="232" y="408" text-anchor="middle">64 s</text>
<text class="dg-n dg-c2" x="232" y="480" text-anchor="middle">6º</text>
<rect class="dg-caixa-2" x="256.5" y="408.5" width="31" height="55" rx="0"/>
<text class="dg-n" x="272" y="400" text-anchor="middle">128 s</text>
<text class="dg-n dg-c2" x="272" y="480" text-anchor="middle">7º</text>
<rect class="dg-caixa-2" x="296.5" y="400.5" width="31" height="63" rx="0"/>
<text class="dg-n" x="312" y="392" text-anchor="middle">256 s</text>
<text class="dg-n dg-c2" x="312" y="480" text-anchor="middle">8º</text>
<rect class="dg-caixa-2" x="336.5" y="396.5" width="31" height="67" rx="0"/>
<text class="dg-n" x="352" y="388" text-anchor="middle">300 s</text>
<text class="dg-n dg-c2" x="352" y="480" text-anchor="middle">9º</text>
<text class="dg-n dg-c2" x="352" y="496" text-anchor="middle">em diante</text>
<text class="dg-n" x="392" y="412">Mesmo bloqueio da página de entrada.</text>
<text class="dg-n" x="392" y="428">Cada senha errada sobe um degrau:</text>
<text class="dg-n" x="392" y="444">a espera dobra, até 300 s.</text>
