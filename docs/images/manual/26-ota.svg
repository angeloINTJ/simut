<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" class="dg">
<defs>
<marker id="26-ota-ponta" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-ponta" d="M0 0L8 4L0 8z"/></marker>
</defs>
<rect class="dg-caixa" x="32.5" y="16.5" width="119" height="31" rx="6"/>
<text class="dg-t dg-b" x="44" y="36">Cliente</text>
<rect class="dg-caixa" x="532.5" y="16.5" width="159" height="31" rx="6"/>
<text class="dg-t" x="544" y="36"><tspan class="dg-b">SIMUT</tspan> <tspan class="dg-m">192.0.2.10</tspan></text>
<polyline class="dg-fio-fino" points="92,48 92,624"/>
<polyline class="dg-fio-fino" points="612,48 612,624"/>
<text class="dg-n" x="116" y="76"><tspan class="dg-m">GET /api/backup</tspan></text>
<polyline class="dg-fio" points="100,88 612,88" marker-end="url(#26-ota-ponta)"/>
<rect class="dg-caixa-acento" x="84.5" y="80.5" width="15" height="15" rx="6"/>
<text class="dg-n dg-b dg-sobre-acento" x="92" y="92" text-anchor="middle">1</text>
<text class="dg-n" x="116" y="112"><tspan class="dg-m">200</tspan> o arquivo <tspan class="dg-m">.bkp</tspan> e o cabeçalho <tspan class="dg-m">X-Backup-PCrc</tspan></text>
<text class="dg-n" x="116" y="128"><tspan class="dg-c2">o cliente confere o CRC do arquivo com o do cabeçalho</tspan></text>
<polyline class="dg-fio-tracejado" points="612,140 92,140" marker-end="url(#26-ota-ponta)"/>
<text class="dg-n" x="116" y="164"><tspan class="dg-m">POST /api/restore?op=stage&amp;commit=1</tspan></text>
<text class="dg-n" x="116" y="180"><tspan class="dg-c2">o .bin da imagem, assinado</tspan></text>
<polyline class="dg-fio" points="100,192 612,192" marker-end="url(#26-ota-ponta)"/>
<rect class="dg-caixa-acento" x="84.5" y="184.5" width="15" height="15" rx="6"/>
<text class="dg-n dg-b dg-sobre-acento" x="92" y="196" text-anchor="middle">2</text>
<text class="dg-n" x="116" y="216"><tspan class="dg-m">200 {"st":5,…,"v":0,…,"committed":1,…}</tspan></text>
<polyline class="dg-fio-tracejado" points="612,228 92,228" marker-end="url(#26-ota-ponta)"/>
<text class="dg-n" x="116" y="252"><tspan class="dg-m">POST /api/ota/apply</tspan></text>
<polyline class="dg-fio" points="100,264 612,264" marker-end="url(#26-ota-ponta)"/>
<rect class="dg-caixa-acento" x="84.5" y="256.5" width="15" height="15" rx="6"/>
<text class="dg-n dg-b dg-sobre-acento" x="92" y="268" text-anchor="middle">3</text>
<text class="dg-n" x="116" y="288"><tspan class="dg-m">202 {"accepted":true,…}</tspan></text>
<text class="dg-n" x="116" y="304"><tspan class="dg-c2">depois de responder, o aparelho aplica a imagem e reinicia</tspan></text>
<polyline class="dg-fio-tracejado" points="612,316 92,316" marker-end="url(#26-ota-ponta)"/>
<text class="dg-n" x="116" y="340"><tspan class="dg-m">GET /api/login_init</tspan></text>
<text class="dg-n" x="116" y="356"><tspan class="dg-c2">a cada 3 s, até o aparelho responder</tspan></text>
<polyline class="dg-fio" points="100,368 612,368" marker-end="url(#26-ota-ponta)"/>
<rect class="dg-caixa-acento" x="84.5" y="360.5" width="15" height="15" rx="6"/>
<text class="dg-n dg-b dg-sobre-acento" x="92" y="372" text-anchor="middle">4</text>
<text class="dg-n" x="116" y="392"><tspan class="dg-m">200</tspan></text>
<polyline class="dg-fio-tracejado" points="612,404 92,404" marker-end="url(#26-ota-ponta)"/>
<text class="dg-n" x="116" y="428"><tspan class="dg-m">GET /api/status</tspan></text>
<text class="dg-n" x="116" y="444"><tspan class="dg-c2">depois de entrar de novo</tspan></text>
<polyline class="dg-fio" points="92,456 612,456" marker-end="url(#26-ota-ponta)"/>
<text class="dg-n" x="116" y="480"><tspan class="dg-m">200 {"sys":{…,"ver":"…"}}</tspan></text>
<text class="dg-n" x="116" y="496"><tspan class="dg-c2">só a versão nova, que o próprio aparelho informa, prova a atualização</tspan></text>
<polyline class="dg-fio-tracejado" points="612,508 92,508" marker-end="url(#26-ota-ponta)"/>
<text class="dg-n" x="116" y="532"><tspan class="dg-m">POST /api/restore?op=validate</tspan></text>
<text class="dg-n" x="116" y="548"><tspan class="dg-c2">o .bkp do primeiro passo</tspan></text>
<polyline class="dg-fio" points="92,560 612,560" marker-end="url(#26-ota-ponta)"/>
<text class="dg-n" x="116" y="584"><tspan class="dg-m">POST /api/restore?op=apply</tspan></text>
<text class="dg-n" x="116" y="600"><tspan class="dg-c2">depois de responder, o aparelho restaura e reinicia</tspan></text>
<polyline class="dg-fio" points="92,612 612,612" marker-end="url(#26-ota-ponta)"/>
</svg>
