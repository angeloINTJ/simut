<svg xmlns="http://www.w3.org/2000/svg" width="320" height="60" viewBox="0 0 320 60">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Card background -->
  <rect width="320" height="60" rx="8" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="60" rx="3" fill="#ffd54f"/>
  <!-- Icon -->
  <text x="28" y="40" font-size="26" fill="#ffd54f" font-family="sans-serif">⚡</text>
  <!-- Main text -->
  <text x="68" y="35" font-size="18" font-weight="bold" fill="#ffffff" font-family="Arial, Helvetica, sans-serif">Powered by SIMUT</text>
  <!-- Subtitle -->
  <text x="68" y="50" font-size="10" fill="#90caf9" font-family="Arial, Helvetica, sans-serif">Professional IoT firmware for Raspberry Pi Pico W</text>
</svg>
