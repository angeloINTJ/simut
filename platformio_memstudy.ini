; TEMPORARY — memory study experiment configs. Safe to delete.
; Mirrors pico_base from platformio.ini but with feature knobs toggled so the
; flash/RAM cost of each subsystem can be measured instead of estimated.

[platformio]
default_envs = exp_nobt
src_dir = src
build_dir = .pio/build_memstudy

[pico_base]
platform         = https://github.com/maxgerhardt/platform-raspberrypi.git
framework        = arduino
board            = rpipicow
board_build.core = earlephilhower

build_src_filter =
    +<*.cpp>
    +<*.c>
    +<*.h>
    +<*.hpp>
    +<*.ino>
    +<ota/*.cpp>
    +<ota/*.h>

board_build.filesystem_size = 1m
upload_protocol  = picotool
monitor_speed    = 115200

build_flags =
    -DPICO_CYW43_SUPPORTED=1
    -Os
    -fmerge-all-constants
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-format-truncation
    -Wno-implicit-fallthrough
    -I src
    -specs=nano.specs
    -Wl,-u,_printf_float
    -Wl,--wrap=flash_range_erase
    -Wl,--wrap=flash_range_program

lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit ILI9341@1.6.3
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9
    knolleary/PubSubClient@2.8
    https://github.com/angeloINTJ/OneWirePIO_RP2040.git#3f0251e64ff441337fb0fb6ccfbad479e9530daa
    https://github.com/angeloINTJ/DHT22PIO_RP2040.git#d500e4d4a93078429fe0c876476f8da904b389ed
    https://github.com/angeloINTJ/BuzzerPIO_RP2040.git#ab8eab1d6102d6972444e3c909408d76b2bd7f13
    https://github.com/angeloINTJ/TwoWirePIO_RP2040.git#v1.3.5
    https://github.com/angeloINTJ/BMx280PIO_RP2040.git#v1.3.1

extra_scripts =
    pre:tools/build_webui_gz.py
    pre:tools/check_cli_help.py

; --- A: release baseline reproduced inside this build_dir (with BT, as shipped)
[env:exp_baseline]
extends    = pico_base
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
build_flags = ${pico_base.build_flags} -DSIMUT_FACTORY_RESET=1 -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
build_type = release

; --- B: identical, minus PIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
[env:exp_nobt]
extends    = pico_base
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
build_flags = ${pico_base.build_flags} -DSIMUT_FACTORY_RESET=1
build_type = release
lib_ignore = SerialBT

; --- C: no BT and no mDNS responder
[env:exp_nobt_nomdns]
extends    = pico_base
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
build_flags = ${pico_base.build_flags} -DSIMUT_FACTORY_RESET=1 -DSIMUT_ENABLE_MDNS=0
build_type = release
lib_ignore = SerialBT

; --- D: prova de que -DSIMUT_MDNS=0 nao tem efeito (o codigo usa #ifdef)
[env:exp_mdns0]
extends    = pico_base
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
build_flags = ${pico_base.build_flags} -DSIMUT_FACTORY_RESET=1 -DSIMUT_MDNS=0
build_type = release
lib_ignore = SerialBT

; --- E: mDNS realmente fora (undef do simbolo, que e o que #ifdef testa)
[env:exp_nomdns_real]
extends    = pico_base
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
build_flags = ${pico_base.build_flags} -DSIMUT_FACTORY_RESET=1 -DSIMUT_NO_MDNS_EXPERIMENT=1
build_type = release
lib_ignore = SerialBT
    LEAmDNS

; --- F: sem BT + NDEBUG (desarma asserts do LittleFS/SDK/newlib)
[env:exp_ndebug]
extends    = pico_base
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
build_flags = ${pico_base.build_flags} -DSIMUT_FACTORY_RESET=1 -DNDEBUG
build_type = release
lib_ignore = SerialBT

; --- G: sem BT + sem float no printf (mede o custo de -Wl,-u,_printf_float)
[env:exp_nofloatprintf]
extends    = pico_base
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
build_flags =
    -DPICO_CYW43_SUPPORTED=1
    -Os
    -fmerge-all-constants
    -Wall -Wextra -Wno-unused-parameter -Wno-format-truncation -Wno-implicit-fallthrough
    -I src
    -specs=nano.specs
    -Wl,--wrap=flash_range_erase
    -Wl,--wrap=flash_range_program
    -DSIMUT_FACTORY_RESET=1
build_type = release
lib_ignore = SerialBT

; --- H: sem BT + sem excecoes/RTTI
[env:exp_noexcept]
extends    = pico_base
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
build_flags = ${pico_base.build_flags} -DSIMUT_FACTORY_RESET=1 -fno-exceptions -fno-rtti -fno-unwind-tables -fno-asynchronous-unwind-tables
build_type = release
lib_ignore = SerialBT

; --- I: acumulado — sem BT + NDEBUG + sem excecoes
[env:exp_all]
extends    = pico_base
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
build_flags = ${pico_base.build_flags} -DSIMUT_FACTORY_RESET=1 -DNDEBUG -fno-exceptions -fno-rtti -fno-unwind-tables -fno-asynchronous-unwind-tables
build_type = release
lib_ignore = SerialBT
