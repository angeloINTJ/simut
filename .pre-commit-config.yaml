# Pre-commit hooks — closes issue #36.
#
# Install once:
#     pip install pre-commit && pre-commit install
#
# The hooks the issue proposed are here, with exclusions the issue did not
# have. Three of them matter, and all were measured rather than assumed:
#
#   tools/arduino_pico_overrides/patches/*.patch — six of the eight carry
#   context lines that are a single space, which is what a unified diff writes
#   for an empty source line. trailing-whitespace strips them. Whether that
#   actually breaks the patch could not be shown: `git apply --stat` parses
#   both forms and GNU patch tolerates an empty context line. It is excluded
#   anyway, because reformatting a vendored diff has no upside and the
#   downside — patch.sh silently failing after a framework bump, against code
#   nobody re-read — is expensive and quiet.
#
#   check-added-large-files runs at 2048 KB, not the 500 KB the issue
#   suggested. docs/MANUAL.pt-BR.html is 1541 KB and PCB_test/simut PCB.kicad_pcb
#   is 794 KB; both are tracked on purpose, and a limit that fires on editing
#   the manual is a limit people learn to pass with --no-verify.
#
#   LICENSES/* — a licence text is copied verbatim from the package that ships it, which is the
#   point of the copy: THIRD_PARTY_NOTICES.md links to it. Liberation-OFL-1.1.txt is the LICENSE of the
#   Liberation 2.1.5 tarball (4,414 B, sha256 93fed46019c38bbe566b479d22148e2e8a1e85ada614accb0211c37b2c61c19b,
#   equal to the tarball's, 2026-11-11), with a space at the end of lines 29, 86 and 90 and a blank last
#   line: trailing-whitespace and end-of-file-fixer would rewrite it in the first commit that touched
#   it, and it would stop being the upstream's text. It is not the first. On main (2026-11-11)
#   bearssl-MIT.txt has 4 lines ending in a space, bricolage-grotesque-OFL-1.1.txt 1,
#   littlefs-BSD-3-Clause.txt 1 and newlib-COPYING.NEWLIB.txt 35; cyw43-driver-LICENSE.RP.txt and
#   pico-sdk-BSD-3-Clause.txt end with no newline; btstack-LICENSE.RP.txt, gcc-runtime-exception-3.1.txt
#   and lwip-BSD-3-Clause.txt end with a blank line. The CI does not run these hooks (a grep of .github/
#   for pre-commit finds one comment and no command, 2026-11-11), so excluding the folder changes no
#   check that runs today; it keeps the next `git commit` from "fixing" a licence. No other hook has
#   anything to say about a licence text.
#
# The language packs were suspected of the same fragility — they end without a
# newline, and the @DICT section is partitioned positionally, so a hook that
# appends one looked like it could push every key off by a line. Tested: adding
# the newline and running tools/check_lang_packs.py, the gate still passes. So
# they are NOT excluded. The suspicion was wrong and this note is here so
# nobody re-derives it from the shape of the file.

exclude: |
  (?x)^(
    tools/arduino_pico_overrides/patches/.*\.patch|
    src/WebUI_GZ\.h|
    PCB_test/.*|
    LICENSES/.*|
    docs/MANUAL\.pt-BR\.html|
    release/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  # The repository's own gates, the fast ones. These already run in CI; having
  # them here means a contributor meets them in the second it takes to commit
  # rather than in the four minutes it takes a workflow to answer.
  #
  # Deliberately NOT here: the firmware build, cppcheck and the fuzz run. A
  # pre-commit hook that takes minutes is a hook people disable.
  - repo: local
    hooks:
      - id: simut-secret-gate
        name: no tracked secrets
        entry: tools/scan_secrets.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: simut-logcodes
        name: log-code tables agree
        entry: python3 tools/gen_logcodes.py --check
        language: system
        pass_filenames: false
        files: ^(tools/logcodes\.tsv|src/.*LogCode.*)

      - id: simut-authz
        name: every route has an authorization gate
        entry: python3 tools/check_authz.py
        language: system
        pass_filenames: false
        # src/ui/**: a UI driver's routes (the Angulo's GET /api/ui), in any file under
        # src/ui/ at any depth, audited apart from the totals. The extensions are the
        # gate's DRIVER_EXTS (tools/check_authz.py): tools/test_check_authz_drivers.py reads this
        # pattern and fails when the two differ, so a route in a .hpp or an .inl is not
        # one the hook lets through.
        files: ^src/(WebManager.*\.cpp|ui/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx|inl|ipp|tpp))$

      - id: simut-fsguard
        name: /config filesystem guard intact
        entry: python3 tools/check_fsguard.py
        language: system
        pass_filenames: false
        files: ^src/(WebManager|ota/).*\.(cpp|h)$
