services:

  # Compiles firmware for the Raspberry Pi Pico W
  build:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ".:/workspace"
    command: pio run -e pico_w_release

  # Runs all seven native unit test suites
  test:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ".:/workspace"
    command: >
      sh -c "pio test -e native -e native_history_v5 -e native_cli -e native_logpolicy -e native_alarmqueue -e native_air -e native_network"
