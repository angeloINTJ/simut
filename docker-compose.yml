services:

  # Compiles firmware for the Raspberry Pi Pico W
  build:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ".:/workspace"
    command: pio run -e pico_w_release

  # Runs all five native unit test suites
  test:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ".:/workspace"
    command: >
      sh -c "pio test -e native && pio test -e native_history_v4 && pio test -e native_history_v5 && pio test -e native_cli && pio test -e native_logpolicy"
