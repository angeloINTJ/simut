; ============================================================================
;  SIMUT — Sistema Integrado de Monitoramento Universal e Telemetria
;  Integrated Universal Monitoring and Telemetry System
;  Target: Raspberry Pi Pico W (RP2040), framework Arduino-Pico (earlephilhower)
; ============================================================================

[platformio]
default_envs = pico_w_release
src_dir = src

; ============================================================================
;  HW base — shared config for release/debug environments (RP2040 Pico W)
;  [env:native] does NOT extend this: standalone for host-side testing
; ============================================================================
[pico_base]
; Pinned to the commit that built v2.1.0-beta. It used to track the branch head,
; which meant a fresh clone could compile against a different framework than the
; one every measurement in docs/ was taken on — and the four overrides in
; tools/arduino_pico_overrides/ are diffs against specific upstream sources, so
; a silent framework bump does not fail loudly, it fails as a patch that no
; longer applies to code nobody re-read.
;
; This commit resolves to framework-arduinopico 1.50601.0 (arduino-pico 5.6.1,
; confirmed by ARDUINO_PICO_VERSION_STR, not by the package number alone),
; itself pinned by the platform manifest to sha 832f2c06. Bumped from cc24cfef
; (5.4.3 = package 1.50403.0) — the first post-beta task. Run patch.sh after
; any change to this line, never one without the other: the package number is
; also the key of tools/arduino_pico_overrides/originals/<version>/.
;
; 6.0.0 exists upstream (platform 9c167c6, 2026-08-03) and is deliberately not
; taken here: a major bump deserves its own evaluation, not a ride along with a
; minor one.
platform         = https://github.com/maxgerhardt/platform-raspberrypi.git#bd6fb6a
framework        = arduino
board            = rpipicow
board_build.core = earlephilhower

build_src_filter =
    +<*.cpp>
    +<*.c>
    +<*.h>
    +<*.hpp>
    +<*.ino>
    +<ota/*.cpp>
    +<ota/*.h>

; --- LittleFS partition (1 MB) ---
board_build.filesystem_size = 1m

; --- Upload / monitor ---
upload_protocol  = picotool
monitor_speed    = 115200

; --- Build flags: optimize for size ---
; -flto is non-functional with earlephilhower toolchain (compiled with --disable-lto).
; Without LTO, splitting DisplayManager.cpp adds ~2 KB per .cpp overhead.
;
; User-configurable feature flags (sensors, display, MDNS, BT) are now in
; src/simut_config.h. Override any flag here if needed — -D flags take
; precedence over simut_config.h defaults.
;
; PIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH is deliberately absent. It used to
; live here, which selected the liblwip-bt.a variant (lwIP + the whole BTstack)
; and the *combined* WiFi+BT radio blob — while BluetoothManager.cpp was
; excluded from every shipping env and simut_config.h kept SIMUT_BLUETOOTH=0,
; i.e. the class was stubs and nothing ever called it. Measured cost of that
; flag: 64732 B of flash and 16416 B of .bss. Dropping it took the real flash
; headroom from 4740 B to 69472 B and the heap from 130704 B to 147120 B; on
; hardware the largest contiguous heap block went 11483 B -> 35776 B, which is
; the number BearSSL actually cares about. See docs/ANALISE_FLASH_RAM.md.
;
; To bring Bluetooth back, do NOT re-add it here — add a dedicated env that
; sets the flag, drops the SerialBT lib_ignore below, keeps
; BluetoothManager.cpp in build_src_filter and defines SIMUT_BLUETOOTH=1.
build_flags =
    -DPICO_CYW43_SUPPORTED=1
    -Os
    -fmerge-all-constants
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-format-truncation
    -Wno-implicit-fallthrough
    -I src
    -specs=nano.specs
    -Wl,-u,_printf_float

; --- Warnings are errors, in src/ only ---
;
; build_src_flags applies to the project's own translation units and not to
; anything under .pio/libdeps, which is the whole point: PubSubClient, the PIO
; sensor drivers and the Adafruit stack all warn, none of them are ours to fix,
; and a -Werror that included them would have to be switched off again within
; the day.
;
; This is enforceable only because CI stopped caching .pio on 2026-09-08. A
; cached build directory skips translation units it has already built, and a
; skipped unit emits no warning at all — so on a warm cache this flag would
; gate nothing while looking like it gated everything.
;
; The 61 warnings that existed across the six images before this line went in
; were fixed rather than suppressed, except the one exemption below.
build_src_flags =
    -Werror

; -Warray-bounds fires inside an INLINED std::sort in SensorManager's trimmed
; mean: __final_insertion_sort unconditionally forms `__first + 16` for its
; threshold, _trimSortBuf is float[10], and GCC reports the address arithmetic
; on a branch that a 10-element range never takes. Observed once at -Os in an
; incremental build and not reproduced by a clean one, which makes it exactly
; the wrong thing to hard-fail on: it would break local rebuilds at random
; while CI stayed green. Demoted, not silenced — the warning still prints.
; The real fix is to stop calling std::sort on a 10-float buffer; until then
; this is a known exemption and not a blanket -Wno-error.
    -Wno-error=array-bounds

; --- T0.1: intercept the SDK flash primitives to time the IRQ-off window.
;     The shims are in src/FlashIrqProbe.cpp and MUST stay SRAM-resident;
;     tools/check_flash_probe.py fails the build if they are not. ---
    -Wl,--wrap=flash_range_erase
    -Wl,--wrap=flash_range_program

; --- External libraries (pinned for reproducibility) ---
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit ILI9341@1.6.3
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9
    knolleary/PubSubClient@2.8
    https://github.com/angeloINTJ/OneWirePIO_RP2040.git#3f0251e64ff441337fb0fb6ccfbad479e9530daa
    https://github.com/angeloINTJ/DHT22PIO_RP2040.git#d500e4d4a93078429fe0c876476f8da904b389ed
    https://github.com/angeloINTJ/BuzzerPIO_RP2040.git#ab8eab1d6102d6972444e3c909408d76b2bd7f13
    https://github.com/angeloINTJ/TwoWirePIO_RP2040.git#v1.3.5
    https://github.com/angeloINTJ/BMx280PIO_RP2040.git#v1.3.1

; --- Libraries kept out of the link ---
; SerialBT is mandatory here, not cosmetic. BluetoothManager.h has
; `#include <SerialBT.h>` inside `#if SIMUT_BLUETOOTH`, and the PlatformIO LDF
; walks the include even though the branch is off. Without this the build dies
; in cores/rp2040/_needsbt.h: "This library needs Bluetooth enabled".
; NOTE: envs that declare their own lib_ignore REPLACE this list rather than
; extend it — repeat SerialBT there (see pico_w_alpha).
lib_ignore =
    SerialBT

; --- Pre-build: regenerate WebUI_GZ.h from WebUI.h ---
; --- Post-build: assert the flash-probe shims linked into SRAM ---
extra_scripts =
    pre:tools/build_webui_gz.py
    pre:tools/build_favicon_header.py
    pre:tools/check_cli_help.py
    pre:tools/check_logcodes.py
    pre:tools/check_channels.py
    pre:tools/check_lang_packs.py
    post:tools/check_flash_probe.py

; ============================================================================
;  Release environment
; ============================================================================
[env:pico_w_release]
; HistoryV4 foi removido do repositório (2026-08-22): V5 é o único formato.
;
; -DNDEBUG (2026-09-18, lever 2 of docs/analysis/DIETA_FLASH.md): -6,832 B of
; .bin here. It was the odd one out — pico_w_test and pico_w_air have carried
; it for months, so every bench soak this project has ever run was already an
; NDEBUG image, and the one that shipped was not. src/ contains no runtime
; assert( ) at all (only _Static_assert, which NDEBUG does not touch), so what
; this switches off is the pico-sdk's and LittleFS's internal checks — plus
; their __FILE__ strings, among them a 116-byte absolute path from the build
; machine's home directory that was going out in the published image.
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
extends    = pico_base
build_flags = ${pico_base.build_flags} -DSIMUT_FACTORY_RESET=1 -DSIMUT_CLI_FULL=0 -DSIMUT_WEB_HTTPS=1 -DNDEBUG
build_type = release

; ============================================================================
;  Release image with the full serial CLI (SIMUT_CLI_FULL=1)
;  Build: pio run -e pico_w_test
;
;  Same source set and optimisation as pico_w_release, so bench timings stay
;  comparable. Two things differ. The CLI surface: release ships the 9
;  emergency commands (see SystemDefs_Cli.h), while every configuration path
;  lives in the web UI. And mDNS, which is off here — see the budget note in
;  the env below. The web server, the pages it serves and the path it serves
;  them through are identical to release, which is the point: web_test_suite.py
;  exists to validate exactly that path.
;
;  This env exists for the automated suites under tools/ — pico_test_suite.py,
;  web_test_suite.py, save_storm.py and sensor_soak.py drive the device over
;  serial with `enable`, `configure terminal`, `write memory`, `show *`,
;  `user add/del/perm`, `system name` and `touch sim`. web_test_suite.py in
;  particular bootstraps its throwaway account through the CLI precisely
;  because it cannot authenticate yet. Flash the test image before a suite
;  run; flash release for anything a user will touch.
;
;  build_flags is re-derived from pico_base rather than appended to
;  pico_w_release's, because appending would leave both -DSIMUT_CLI_FULL=0
;  and =1 on the command line.
; ============================================================================
[env:pico_w_test]
extends    = env:pico_w_release
; This env's flash budget is its own problem, and stops being the release's.
; It carries the full CLI and, from 2026-08-17, the complete web interface as
; well. Measured at e14170f with arm-none-eabi-size, all 12 pages embedded:
;
;   no lever ............................. overflowed FLASH by 856 B
;   parseIntStrict instead of sscanf ....... 6604 B free — fits, with no margin
;   + SIMUT_MDNS=0 ........................ 21980 B free
;
; The middle line is the one to remember: this env links today without the mDNS
; lever, and 6604 B is exactly the kind of margin that produced this whole
; mess (it was 152 B in August). The flag buys the margin, not the fit.
;
;   -DNDEBUG               6,832 B of .bin, measured 2026-09-18. Every env has
;                          it now; this line is kept because the number is the
;                          one that made pico_w_test fit in August.
;   -DSIMUT_LICENSE_STUB   keeps the license text out of the image
;   -DSIMUT_MDNS=0         15376 B, measured. The suites find the board over
;                          USB serial (udevadm) and talk to it by IP; not one
;                          resolves SIMUT.local. Release keeps mDNS. Drop this
;                          flag if a soak ever has to exercise the responder —
;                          the env still links, just with no room.
;
; When this env needs room again, take it HERE — never from the release image.
; custom_fs_pages names pages to serve from LittleFS instead of linking them;
; tools/build_webui_gz.py refuses that option for the shipping envs, so a diet
; cannot leak into a user's device. Candidates, biggest first: HIST_PAGE
; (32250 B, but the hottest page there is and +12.5 ms per load), CFG_PAGE
; (19755 B), FILE_PAGE, ALARMS_PAGE. Whatever is listed has to be uploaded to
; /web/ on the bench unit before a suite runs, or its route answers "Page asset
; missing" — POST to /api/upload or use the Files page, never `uploadfs`.
;custom_fs_pages = HIST_PAGE
build_flags = ${pico_base.build_flags} -DSIMUT_FACTORY_RESET=1 -DSIMUT_CLI_FULL=1 -DNDEBUG -DSIMUT_LICENSE_STUB=1 -DSIMUT_MDNS=0
build_type = release

; ============================================================================
;  Debug environment — REMOVED 2026-09-08
; ============================================================================
; There was a [env:pico_w_debug] here, and it had never linked in this
; project's history: ~69 KB over the app slot in July, 16,576 B in August when
; dropping Bluetooth brought it "within reach", 81 KB, 99,884 B, and 101,820 B
; on the CI runner the day it was removed. build_type=debug builds at -Og and
; drops --gc-sections; forcing -Os and restoring the flag was tried and made it
; worse, and the documented recovery path (WebUI_GZ to LittleFS, 70,902 B, plus
; -DNDEBUG, 6,600 B) no longer covers the gap.
;
; It was removed rather than carried because a target that cannot be built is
; not a target — it teaches whoever arrives that this file's environments are
; not to be trusted, which is the opposite of what an environment list is for.
;
; What it was documented to provide is already elsewhere: the concurrency
; tripwire (-DSIMUT_CONCURRENCY_ASSERTS) lives in pico_w_asserts below, which
; links and runs at bench speed. For a GDB session, a debug target has to be
; built by cutting features until it fits — start from docs/ANALISE_FLASH_RAM.md
; and expect to give up the web UI or the TFT, not to find a flag that works.
;
; git log -- platformio.ini has the block as it stood.

; ============================================================================
;  Release image with concurrency invariant 3 armed (T1.6)
;  Same optimisation and source set as pico_w_release, so it fits and runs at
;  bench speed; -DSIMUT_CONCURRENCY_ASSERTS turns FLASH_OP into a tripwire that
;  logs the moment anyone enters it while holding _stateMutex. This is the env
;  to flash for a soak meant to catch an invariant-3 regression, instead of
;  waiting for the intermittent deadlock it eventually causes.
;
;  It exists because pico_w_debug — where the flag was documented to live —
;  does not link: at -Og and without --gc-sections the image overflows the
;  1020 KB app slot by ~69 KB, and the slot was ~97% full at -Os when this
;  was written (2026-09-08); ~93% since the v2.4.9-beta diet.
; ============================================================================
;  pico_w_test + HTTPS — the only image with both the full CLI and the TLS
;  server. Build: pio run -e pico_w_test_https
;
;  It exists because validating anything about the HTTPS server needs two
;  things that no shipping image puts together. The server is compiled only
;  into pico_w_release (SIMUT_WEB_HTTPS), whose console is the fourteen-command
;  emergency one — it cannot create the throwaway account the web suites log in
;  with, and the bench must never reset a real admin password to get one.
;  pico_w_test has the account commands and no TLS. So every TLS bench session
;  was rebuilding this combination by hand, including the one that validated
;  POST /api/tls on 2026-09-18 (#137); the numbers in that pull request came
;  from an env exactly like this one, typed into platformio.ini and deleted
;  afterwards. Typing it again next time is how a measurement stops being
;  reproducible.
;
;  NOT a shipping image and not published by release-ota.yml: it carries the
;  56-command CLI, which is not what belongs on a device someone uses. CI
;  builds it so that the combination cannot rot between bench sessions — the
;  failure this prevents is discovering, mid-investigation, that the one image
;  you need does not link any more.
;
;  1,013,332 B measured 2026-09-18 — it fits, and with 27 KB to spare against
;  the OTA ceiling, so the bench can even reach it the way the field would.
; ============================================================================
[env:pico_w_test_https]
extends     = env:pico_w_test
build_flags = ${env:pico_w_test.build_flags} -DSIMUT_WEB_HTTPS=1
; 2026-09-20 (config v25, identity policy): this env, and only this env, ran
; out of room. It is pico_w_test plus the TLS server, so it carries both the
; full CLI and BearSSL and it had 5,916 B left over the 1,044,480 B region
; before the PIN policy work; that work costs ~7.1 kB. The room comes from
; HERE, as the note in pico_w_test says, and ALARMS_PAGE is the smallest
; candidates that cover it with room to spare: ALARMS_PAGE (4,490 B) and
; FILE_PAGE (5,172 B). Both were needed, because the budget gate checks TWO
; numbers and the second is the tighter one here: linking ALARMS_PAGE out
; alone left the .bin 1,420 B over the 1,040,384 B OTA ceiling even though the
; region fit. They are also the two pages an HTTPS soak touches least — login,
; config, history and telemetry all stay linked in.
; TEL_PAGE joins them for headroom and not for need: with two pages out the
; .bin sat 3,732 B under the 1,040,384 B OTA ceiling, which is less than one
; 4 KiB sector — the gate warns that the next addition would make this image
; refuse to update over the air while every other number still looked fine,
; and this is the image the OTA cycles are run on. Three pages leave 11,513 B.
; Upload data/web/alarms.html.gz, files.html.gz and tel.html.gz to /web/ on the
; bench unit before running a suite against this image, or those three routes
; answer "Page asset missing". POST to /api/upload or use the Files page —
; never `uploadfs`, which wipes /lang and /history with it. The telemetry
; suites drive /api/*, not this page.
custom_fs_pages = ALARMS_PAGE, FILE_PAGE, TEL_PAGE

; ============================================================================
[env:pico_w_asserts]
extends     = env:pico_w_release
build_flags = ${env:pico_w_release.build_flags} -DSIMUT_CONCURRENCY_ASSERTS

; ============================================================================
;  Native (host) environment for unit testing
;  Run: pio test -e native
;  Covers pure validators: parseIntStrict, isValidIpv4, isSafeUploadFilename,
;  isValidName, isValidCfgString, isInRange, dallasCrc8, floatToI16/i16ToFloat,
;  timeReached, timeSince. No hardware dependencies.
; ============================================================================
[env:native]
platform         = native
test_framework   = unity
build_src_filter = -<*>
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_validators

; ============================================================================
[env:native_history_v5]
platform         = native
test_framework   = unity
build_src_filter = -<*> +<HistoryV5.cpp>
test_build_src   = true
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_history_v5

; ============================================================================
;  Native CLI parser tests — issue #42
;  Run: pio test -e native_cli
;  Compiles production CommandParser.cpp (no CommandManager I/O deps).
; ============================================================================
[env:native_cli]
platform         = native
test_framework   = unity
build_src_filter = -<*> +<CommandParser.cpp>
test_build_src   = true
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_command_parser

; ============================================================================
;  Native (host) tests for the edge-triggered log filter — LogPolicy
;  Run: pio test -e native_logpolicy
;  Compiles production LogPolicy.cpp. The class takes time as a parameter and
;  pulls in no Arduino/pico headers precisely so the whole decision — latches,
;  recovery, heartbeat, millis( ) wrap, counter saturation — can be exercised
;  here instead of only on the bench.
; ============================================================================
[env:native_logpolicy]
platform         = native
test_framework   = unity
build_src_filter = -<*> +<LogPolicy.cpp>
test_build_src   = true
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_log_policy

; ============================================================================
;  Native (host) tests for the RAM alarm queue — AlarmQueue (v21)
;  Run: pio test -e native_alarmqueue
;  AlarmQueue.h is header-only (static ring, zero heap); it only pulls
;  SystemDefs_Records.h for the ALARM_QUEUE_* constants, so the whole queue
;  semantic — FIFO, drop-newest overflow, seq wrap, ack-by-seq removal — runs
;  here instead of only on the bench.
; ============================================================================
[env:native_alarmqueue]
platform         = native
test_framework   = unity
build_src_filter = -<*>
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_alarm_queue

; ============================================================================
;  Alpha display (HD44780 16x2) — minimal build without TFT/touch/UI
;  Build: pio run -e pico_w_alpha
;  Saves ~30 KB flash by excluding all graphical UI code.
; ============================================================================

[env:pico_w_alpha]
extends     = pico_base
build_flags = ${pico_base.build_flags}
    -DSIMUT_DISPLAY_TFT=0
    -DSIMUT_DISPLAY_ALPHA=1
    -DHD44780_MODE_PARALLEL=1
    -DSIMUT_BLUETOOTH=1
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    -DSIMUT_CLI_FULL=0
    -DSIMUT_MDNS=0
    -DNDEBUG
; Alpha: release build but with HD44780 LCD instead of TFT.
; Keeps BluetoothManager.cpp + SerialBT (BT Serial CLI for AP mode).
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Touch.cpp>
    -<DisplayManager_Settings.cpp>
    -<DisplayManager_Graph.cpp>
    -<DisplayManager_Dashboard.cpp>
    -<DisplayManager_Calibration.cpp>
    -<DisplayManager_Auth.cpp>
    -<DisplayManager_Alarm.cpp>
    -<DisplayManager_Calendar.cpp>
    -<DisplayManager_Fonts.cpp>
    -<DisplayManager_i18n.cpp>
    -<DisplayManager_LangParser.cpp>
    -<AppManager_Graph.cpp>
    +<DisplayManager_Alpha.cpp>
lib_ignore =
    Adafruit ILI9341
    Adafruit GFX Library
    XPT2046_Touchscreen

; ============================================================================
;  SIMUT Air — headless hibernating build (no display, no buzzer)
;  Build: pio run -e pico_w_air
;
;  Same source set as pico_w_alpha (TFT/touch/UI compiled out, HD44780 driver
;  kept but never started — see the #if SIMUT_AIR guards in AppManager), plus:
;   - SIMUT_AIR=1     : headless + dormant hibernation cycle
;   - SIMUT_CLI_FULL=1: the full CLI, since 2026-09-18. It was 0 from the first
;     Air image onwards because it genuinely did not fit — the arithmetic on
;     2026-09-06 was done against 876 B of headroom and the full CLI costs
;     +45,056 B of .bin — and serial/BT carried the emergency console instead.
;     The v2.4.9-beta diet freed 62,420 B on this image, so it fits now:
;     977,964 -> 1,023,020 B measured, 17,364 B still under the OTA ceiling.
;     This build is the one that most needs it: headless, the serial/BT console
;     is the ONLY local interface there is.
;   - SIMUT_BLUETOOTH=1 + SerialBT : BT serial CLI stays (configuration channel)
;   - SIMUT_MDNS=0    : off since v2.4.4-beta — see the note under build_flags
;   - SoundManager.cpp excluded : buzzer dropped (SoundManager.h is a no-op
;     under SIMUT_AIR, so the real implementation cannot be linked)
;
;  Persisted Air settings (wake interval, idle timeout, ...) live in
;  /config/air.bin — NOT in SystemConfig, so CONFIG_VERSION stays 21.
; ============================================================================
[env:pico_w_air]
extends     = pico_base
build_flags = ${pico_base.build_flags}
    -DSIMUT_DISPLAY_TFT=0
    -DSIMUT_DISPLAY_ALPHA=0
    -DSIMUT_AIR=1
    -DSIMUT_BLUETOOTH=1
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    -DSIMUT_CLI_FULL=1
    -DNDEBUG
    -DSIMUT_LICENSE_STUB=1
    -DSIMUT_MDNS=0
; mDNS off on Air since v2.4.4-beta: the responder never announced and the OTA
; image sits at the 1016 KiB ceiling; dropping it (~15 KiB) keeps Air field-
; updatable. Revisit when mDNS works and/or there is flash headroom — see #118.
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Touch.cpp>
    -<DisplayManager_Settings.cpp>
    -<DisplayManager_Graph.cpp>
    -<DisplayManager_Dashboard.cpp>
    -<DisplayManager_Calibration.cpp>
    -<DisplayManager_Auth.cpp>
    -<DisplayManager_Alarm.cpp>
    -<DisplayManager_Calendar.cpp>
    -<DisplayManager_Fonts.cpp>
    -<AppManager_Graph.cpp>
    -<DisplayManager.cpp>
    -<DisplayManager_Alpha.cpp>
    -<SoundManager.cpp>
    +<DisplayManager_None.cpp>
    +<air/*.c>
lib_ignore =
    Adafruit ILI9341
    Adafruit GFX Library
    XPT2046_Touchscreen
    BuzzerPIO_RP2040

; ============================================================================
;  SIMUT Air — host-side unit tests for the Air config (air/AirConfig.h)
;  Run: pio test -e native_air
; ============================================================================
; ============================================================================
;  Native — the WiFi reconnect state machine
; ============================================================================
; Compiles the real src/NetworkManager.cpp against a controllable radio
; (test/native_stubs/WiFi.h). SIMUT_MDNS=0 keeps LEAmDNS out; the log manager
; and metrics are satisfied at link time by the test itself, so nothing of
; LittleFS or the flash layer has to exist here.
;
; This suite exists because the 2026-09-08 field failure — a scan that never
; completed, leaving the device unable to reconnect for 3 h 41 min — was found
; by reading a device's log, not by a test, because there was no test to find
; it. The wedge is now a knob, and it is asserted on.
[env:native_network]
platform         = native
test_framework   = unity
build_src_filter = -<*> +<NetworkManager.cpp> +<LogPolicy.cpp> +<SimutTime.cpp>
test_build_src   = true
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
