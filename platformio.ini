; ============================================================================
;  SIMUT — Sistema Integrado de Monitoramento Universal e Telemetria
;  Integrated Universal Monitoring and Telemetry System
;  Target: Raspberry Pi Pico W (RP2040), framework Arduino-Pico (earlephilhower)
; ============================================================================

[platformio]
default_envs = pico_w_release
src_dir = src

; ============================================================================
;  HW base — shared config for release/debug environments (RP2040 Pico W)
;  [env:native] does NOT extend this: standalone for host-side testing
; ============================================================================
[pico_base]
platform         = https://github.com/maxgerhardt/platform-raspberrypi.git
framework        = arduino
board            = rpipicow
board_build.core = earlephilhower

build_src_filter =
    +<*.cpp>
    +<*.c>
    +<*.h>
    +<*.hpp>
    +<*.ino>
    +<ota/*.cpp>
    +<ota/*.h>

; --- LittleFS partition (1 MB) ---
board_build.filesystem_size = 1m

; --- Upload / monitor ---
upload_protocol  = picotool
monitor_speed    = 115200

; --- Build flags: optimize for size ---
; -flto is non-functional with earlephilhower toolchain (compiled with --disable-lto).
; Without LTO, splitting DisplayManager.cpp adds ~2 KB per .cpp overhead.
;
; User-configurable feature flags (sensors, display, MDNS, BT) are now in
; src/simut_config.h. Override any flag here if needed — -D flags take
; precedence over simut_config.h defaults.
build_flags =
    -DPICO_CYW43_SUPPORTED=1
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    -Os
    -fmerge-all-constants
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-format-truncation
    -Wno-implicit-fallthrough
    -I src
    -specs=nano.specs
    -Wl,-u,_printf_float

; --- T0.1: intercept the SDK flash primitives to time the IRQ-off window.
;     The shims are in src/FlashIrqProbe.cpp and MUST stay SRAM-resident;
;     tools/check_flash_probe.py fails the build if they are not. ---
    -Wl,--wrap=flash_range_erase
    -Wl,--wrap=flash_range_program

; --- External libraries (pinned for reproducibility) ---
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit ILI9341@1.6.3
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9
    knolleary/PubSubClient@2.8
    https://github.com/angeloINTJ/OneWirePIO_RP2040.git#3f0251e64ff441337fb0fb6ccfbad479e9530daa
    https://github.com/angeloINTJ/DHT22PIO_RP2040.git#d500e4d4a93078429fe0c876476f8da904b389ed
    https://github.com/angeloINTJ/BuzzerPIO_RP2040.git#ab8eab1d6102d6972444e3c909408d76b2bd7f13
    https://github.com/angeloINTJ/TwoWirePIO_RP2040.git#v1.3.5
    https://github.com/angeloINTJ/BMx280PIO_RP2040.git#v1.3.1

; --- Pre-build: regenerate WebUI_GZ.h from WebUI.h ---
; --- Post-build: assert the flash-probe shims linked into SRAM ---
extra_scripts =
    pre:tools/build_webui_gz.py
    post:tools/check_flash_probe.py

; ============================================================================
;  Release environment
; ============================================================================
[env:pico_w_release]
build_src_filter = ${pico_base.build_src_filter}
    -<DisplayManager_Alpha.cpp>
    -<BluetoothManager.cpp>
extends    = pico_base
build_flags = ${pico_base.build_flags} -DSIMUT_FACTORY_RESET=1
build_type = release

; ============================================================================
;  Debug environment
; ============================================================================
[env:pico_w_debug]
extends     = pico_base
build_type  = debug
build_flags = ${pico_base.build_flags} -DSIMUT_DEBUG_BUILD=1

; ============================================================================
;  Native (host) environment for unit testing
;  Run: pio test -e native
;  Covers pure validators: parseIntStrict, isValidIpv4, isSafeUploadFilename,
;  isValidName, isValidCfgString, isInRange, dallasCrc8, floatToI16/i16ToFloat,
;  timeReached, timeSince. No hardware dependencies.
; ============================================================================
[env:native]
platform         = native
test_framework   = unity
build_src_filter = -<*>
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_validators

; ============================================================================
;  Native (host) environment for HistoryCodec unit testing
;  Run: pio test -e native_history
;  Covers encode/decode roundtrip, NaN sentinel preservation, anchor frame
;  boundaries, varint edge cases, and buffer overflow protection.
;  Compiles production HistoryCodec.cpp directly (no copies — eliminates
;  drift risk). Dependency chain resolves under native_stubs/Arduino.h.
; ============================================================================
[env:native_history]
platform         = native
test_framework   = unity
build_src_filter = -<*> +<HistoryCodec.cpp>
test_build_src = true
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_history_codec

; ============================================================================
;  Native (host) environment for HistoryV4 codec unit testing
;  Run: pio test -e native_history_v4
;  Covers bit-packing, anchor/delta encode-decode, NaN sentinel, multi-record
;  across anchor boundaries, buffer overflow, measurement key generation.
;  Compiles production HistoryV4.cpp + HistoryCodec.cpp (for varint).
; ============================================================================
[env:native_history_v4]
platform         = native
test_framework   = unity
build_src_filter = -<*> +<HistoryV4.cpp> +<HistoryCodec.cpp>
test_build_src = true
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_history_v4

; ============================================================================
;  Native CLI parser tests — issue #42
;  Run: pio test -e native_cli
;  Compiles production CommandParser.cpp (no CommandManager I/O deps).
; ============================================================================
[env:native_cli]
platform         = native
test_framework   = unity
build_src_filter = -<*> +<CommandParser.cpp>
test_build_src   = true
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_command_parser

; ============================================================================
;  Alpha display (HD44780 16x2) — minimal build without TFT/touch/UI
;  Build: pio run -e pico_w_alpha
;  Saves ~30 KB flash by excluding all graphical UI code.
; ============================================================================

[env:pico_w_alpha]
extends     = pico_base
build_flags = ${pico_base.build_flags}
    -DSIMUT_DISPLAY_TFT=0
    -DSIMUT_DISPLAY_ALPHA=1
    -DHD44780_MODE_PARALLEL=1
; Alpha: release build but with HD44780 LCD instead of TFT.
; Excludes TFT GUI files + BT. Adds Alpha display driver.
build_src_filter = ${pico_base.build_src_filter}
    -<BluetoothManager.cpp>
    -<DisplayManager_Touch.cpp>
    -<DisplayManager_Settings.cpp>
    -<DisplayManager_Graph.cpp>
    -<DisplayManager_Dashboard.cpp>
    -<DisplayManager_Calibration.cpp>
    -<DisplayManager_Auth.cpp>
    -<DisplayManager_Alarm.cpp>
    -<DisplayManager_Calendar.cpp>
    -<DisplayManager_Fonts.cpp>
    -<DisplayManager_i18n.cpp>
    -<DisplayManager_LangParser.cpp>
    -<AppManager_Graph.cpp>
    +<DisplayManager_Alpha.cpp>
lib_ignore =
    Adafruit ILI9341
    Adafruit GFX Library
    XPT2046_Touchscreen
