; ============================================================================
;  SIMUT — Sistema Integrado de Monitoramento Universal e Telemetria
;  Integrated Universal Monitoring and Telemetry System
;  Target: Raspberry Pi Pico W (RP2040), framework Arduino-Pico (earlephilhower)
; ============================================================================

[platformio]
default_envs = pico_w_release
src_dir = src
extra_configs = tools/generated/profiles.ini

; ============================================================================
;  HW base — shared config for release/debug environments (RP2040 Pico W)
;  [env:native] does NOT extend this: standalone for host-side testing
; ============================================================================
[pico_base]
; Pinned to the commit that built v2.1.0-beta. It used to track the branch head,
; which meant a fresh clone could compile against a different framework than the
; one every measurement in docs/ was taken on — and the four overrides in
; tools/arduino_pico_overrides/ are diffs against specific upstream sources, so
; a silent framework bump does not fail loudly, it fails as a patch that no
; longer applies to code nobody re-read.
;
; This commit resolves to framework-arduinopico 1.50601.0 (arduino-pico 5.6.1,
; confirmed by ARDUINO_PICO_VERSION_STR, not by the package number alone),
; itself pinned by the platform manifest to sha 832f2c06. Bumped from cc24cfef
; (5.4.3 = package 1.50403.0) — the first post-beta task. Run patch.sh after
; any change to this line, never one without the other: the package number is
; also the key of tools/arduino_pico_overrides/originals/<version>/.
;
; 6.0.0 exists upstream (platform 9c167c6, 2026-08-03) and is deliberately not
; taken here: a major bump deserves its own evaluation, not a ride along with a
; minor one.
platform         = https://github.com/maxgerhardt/platform-raspberrypi.git#bd6fb6a
framework        = arduino
board            = rpipicow
board_build.core = earlephilhower

build_src_filter =
    +<*.cpp>
    +<*.c>
    +<*.h>
    +<*.hpp>
    +<*.ino>
    +<ota/*.cpp>
    +<ota/*.h>

; --- LittleFS partition (1 MB) ---
board_build.filesystem_size = 1m

; --- Upload / monitor ---
upload_protocol  = picotool
monitor_speed    = 115200

; --- Build flags: optimize for size ---
; -flto is non-functional with earlephilhower toolchain (compiled with --disable-lto).
; Without LTO, splitting DisplayManager.cpp adds ~2 KB per .cpp overhead.
;
; User-configurable feature flags (sensors, display, MDNS, BT) are now in
; src/simut_config.h. Override any flag here if needed — -D flags take
; precedence over simut_config.h defaults.
;
; PIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH is deliberately absent. It used to
; live here, which selected the liblwip-bt.a variant (lwIP + the whole BTstack)
; and the *combined* WiFi+BT radio blob — while BluetoothManager.cpp was
; excluded from every shipping env and simut_config.h kept SIMUT_BLUETOOTH=0,
; i.e. the class was stubs and nothing ever called it. Measured cost of that
; flag: 64732 B of flash and 16416 B of .bss. Dropping it took the real flash
; headroom from 4740 B to 69472 B and the heap from 130704 B to 147120 B; on
; hardware the largest contiguous heap block went 11483 B -> 35776 B, which is
; the number BearSSL actually cares about. See docs/ANALISE_FLASH_RAM.md.
;
; To bring Bluetooth back, do NOT re-add it here — add a dedicated env that
; sets the flag, drops the SerialBT lib_ignore below, keeps
; BluetoothManager.cpp in build_src_filter and defines SIMUT_BLUETOOTH=1.
build_flags =
    -DPICO_CYW43_SUPPORTED=1
    -Os
    -fmerge-all-constants
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-format-truncation
    -Wno-implicit-fallthrough
    -I src
    -specs=nano.specs
    -Wl,-u,_printf_float

; --- Warnings are errors, in src/ only ---
;
; build_src_flags applies to the project's own translation units and not to
; anything under .pio/libdeps, which is the whole point: PubSubClient, the PIO
; sensor drivers and the Adafruit stack all warn, none of them are ours to fix,
; and a -Werror that included them would have to be switched off again within
; the day.
;
; This is enforceable only because CI stopped caching .pio on 2026-09-08. A
; cached build directory skips translation units it has already built, and a
; skipped unit emits no warning at all — so on a warm cache this flag would
; gate nothing while looking like it gated everything.
;
; The 61 warnings that existed across the six images before this line went in
; were fixed rather than suppressed, except the one exemption below.
build_src_flags =
    -Werror

; -Warray-bounds fires inside an INLINED std::sort in SensorManager's trimmed
; mean: __final_insertion_sort unconditionally forms `__first + 16` for its
; threshold, _trimSortBuf is float[10], and GCC reports the address arithmetic
; on a branch that a 10-element range never takes. Observed once at -Os in an
; incremental build and not reproduced by a clean one, which makes it exactly
; the wrong thing to hard-fail on: it would break local rebuilds at random
; while CI stayed green. Demoted, not silenced — the warning still prints.
; The real fix is to stop calling std::sort on a 10-float buffer; until then
; this is a known exemption and not a blanket -Wno-error.
    -Wno-error=array-bounds

; --- T0.1: intercept the SDK flash primitives to time the IRQ-off window.
;     The shims are in src/FlashIrqProbe.cpp and MUST stay SRAM-resident;
;     tools/check_flash_probe.py fails the build if they are not. ---
    -Wl,--wrap=flash_range_erase
    -Wl,--wrap=flash_range_program

; --- External libraries (pinned for reproducibility) ---
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit ILI9341@1.6.3
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9
    knolleary/PubSubClient@2.8
    https://github.com/angeloINTJ/OneWirePIO_RP2040.git#3f0251e64ff441337fb0fb6ccfbad479e9530daa
    https://github.com/angeloINTJ/DHT22PIO_RP2040.git#d500e4d4a93078429fe0c876476f8da904b389ed
    https://github.com/angeloINTJ/BuzzerPIO_RP2040.git#ab8eab1d6102d6972444e3c909408d76b2bd7f13
    https://github.com/angeloINTJ/TwoWirePIO_RP2040.git#v1.3.5
    https://github.com/angeloINTJ/BMx280PIO_RP2040.git#v1.3.1

; --- Libraries kept out of the link ---
; SerialBT is mandatory here, not cosmetic. BluetoothManager.h has
; `#include <SerialBT.h>` inside `#if SIMUT_BLUETOOTH`, and the PlatformIO LDF
; walks the include even though the branch is off. Without this the build dies
; in cores/rp2040/_needsbt.h: "This library needs Bluetooth enabled".
; NOTE: envs that declare their own lib_ignore REPLACE this list rather than
; extend it — repeat SerialBT there (see pico_w_alpha).
lib_ignore =
    SerialBT

; --- Pre-build: regenerate WebUI_GZ.h from WebUI.h ---
; --- Post-build: assert the flash-probe shims linked into SRAM ---
extra_scripts =
    pre:tools/build_webui_gz.py
    pre:tools/build_favicon_header.py
    pre:tools/check_cli_help.py
    pre:tools/check_logcodes.py
    pre:tools/check_channels.py
    pre:tools/check_lang_packs.py
    post:tools/check_flash_probe.py

; ============================================================================
;  Firmware environments — GENERATED from tools/features.toml
; ============================================================================
; The six firmware environments (pico_w_release, _test, _test_https, _asserts,
; _alpha, _air) are derived from tools/features.toml by tools/gen_features.py
; into tools/generated/profiles.ini, included via `extra_configs` above. Do NOT
; add an [env:pico_w_*] here — edit the manifest and run `python3 tools/
; gen_features.py`. The per-profile rationale that used to live in these blocks
; (the measured byte counts, why mDNS is off in test, why test_https diets three
; pages, why the Air carries the full CLI) now lives beside each profile in the
; manifest. tools/check_features.py proves the generated environments resolve —
; flag for flag and translation-unit for translation-unit — to what this file
; kept by hand, and a byte-identical build proof stands behind the switchover
; (docs/analysis/MODELO_DE_RECURSOS.md, P1). The native_* test environments are
; NOT generated; they stay below. The debug environment that used to sit here is
; gone, and the note on why it cannot exist is kept next.

; ============================================================================
;  Debug environment — REMOVED 2026-09-08
; ============================================================================
; There was a [env:pico_w_debug] here, and it had never linked in this
; project's history: ~69 KB over the app slot in July, 16,576 B in August when
; dropping Bluetooth brought it "within reach", 81 KB, 99,884 B, and 101,820 B
; on the CI runner the day it was removed. build_type=debug builds at -Og and
; drops --gc-sections; forcing -Os and restoring the flag was tried and made it
; worse, and the documented recovery path (WebUI_GZ to LittleFS, 70,902 B, plus
; -DNDEBUG, 6,600 B) no longer covers the gap.
;
; It was removed rather than carried because a target that cannot be built is
; not a target — it teaches whoever arrives that this file's environments are
; not to be trusted, which is the opposite of what an environment list is for.
;
; What it was documented to provide is already elsewhere: the concurrency
; tripwire (-DSIMUT_CONCURRENCY_ASSERTS) lives in pico_w_asserts below, which
; links and runs at bench speed. For a GDB session, a debug target has to be
; built by cutting features until it fits — start from docs/ANALISE_FLASH_RAM.md
; and expect to give up the web UI or the TFT, not to find a flag that works.
;
; git log -- platformio.ini has the block as it stood.

; ============================================================================
;  Native (host) environment for unit testing
;  Run: pio test -e native
;  Covers pure validators: parseIntStrict, isValidIpv4, isSafeUploadFilename,
;  isValidName, isValidCfgString, isInRange, dallasCrc8, floatToI16/i16ToFloat,
;  timeReached, timeSince. No hardware dependencies.
; ============================================================================
[env:native]
platform         = native
test_framework   = unity
build_src_filter = -<*>
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_validators

; ============================================================================
[env:native_history_v5]
platform         = native
test_framework   = unity
build_src_filter = -<*> +<HistoryV5.cpp>
test_build_src   = true
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_history_v5

; ============================================================================
;  Native CLI parser tests — issue #42
;  Run: pio test -e native_cli
;  Compiles production CommandParser.cpp (no CommandManager I/O deps).
; ============================================================================
[env:native_cli]
platform         = native
test_framework   = unity
build_src_filter = -<*> +<CommandParser.cpp>
test_build_src   = true
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_command_parser

; ============================================================================
;  Native (host) tests for the edge-triggered log filter — LogPolicy
;  Run: pio test -e native_logpolicy
;  Compiles production LogPolicy.cpp. The class takes time as a parameter and
;  pulls in no Arduino/pico headers precisely so the whole decision — latches,
;  recovery, heartbeat, millis( ) wrap, counter saturation — can be exercised
;  here instead of only on the bench.
; ============================================================================
[env:native_logpolicy]
platform         = native
test_framework   = unity
build_src_filter = -<*> +<LogPolicy.cpp>
test_build_src   = true
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_log_policy

; ============================================================================
;  Native (host) tests for the RAM alarm queue — AlarmQueue (v21)
;  Run: pio test -e native_alarmqueue
;  AlarmQueue.h is header-only (static ring, zero heap); it only pulls
;  SystemDefs_Records.h for the ALARM_QUEUE_* constants, so the whole queue
;  semantic — FIFO, drop-newest overflow, seq wrap, ack-by-seq removal — runs
;  here instead of only on the bench.
; ============================================================================
[env:native_alarmqueue]
platform         = native
test_framework   = unity
build_src_filter = -<*>
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
test_filter      = test_alarm_queue

; ============================================================================
;  SIMUT Air — host-side unit tests for the Air config (air/AirConfig.h)
;  Run: pio test -e native_air
; ============================================================================
; ============================================================================
;  Native — the WiFi reconnect state machine
; ============================================================================
; Compiles the real src/NetworkManager.cpp against a controllable radio
; (test/native_stubs/WiFi.h). SIMUT_MDNS=0 keeps LEAmDNS out; the log manager
; and metrics are satisfied at link time by the test itself, so nothing of
; LittleFS or the flash layer has to exist here.
;
; This suite exists because the 2026-09-08 field failure — a scan that never
; completed, leaving the device unable to reconnect for 3 h 41 min — was found
; by reading a device's log, not by a test, because there was no test to find
; it. The wedge is now a knob, and it is asserted on.
[env:native_network]
platform         = native
test_framework   = unity
build_src_filter = -<*> +<NetworkManager.cpp> +<LogPolicy.cpp> +<SimutTime.cpp>
test_build_src   = true
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
    -DSIMUT_MDNS=0
test_filter      = test_network

[env:native_air]
platform         = native
test_framework   = unity
build_src_filter = -<*>
build_flags      =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/native_stubs
    -DSIMUT_AIR=1
test_filter      = test_air_config


