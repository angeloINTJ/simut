; ============================================================================
;  SIMUT v3.26.0 — PlatformIO Configuration
;  Target: Raspberry Pi Pico W (RP2040), framework Arduino-Pico (earlephilhower).
;  ============================================================================
;  Changelist:
;   §4.1  Build system reprodutivel (audit v1, 2026-04-22).
;   §4.2  Pre-build script tools/build_webui_gz.py gera WebUI_GZ.h automatico.
;   §4.4  -Wall -Wextra ativos; -Werror OFF ate zerar backlog de warnings.
;   §5.5  -Wno-unused-parameter temporario (remover apos limpeza de assinaturas).
; ============================================================================

[platformio]
default_envs = pico_w_release
; Flat-layout repo — sources at project root.
; pioasm patch in platform scripts skips .pio/ directory (is_dir guard).
src_dir = .

[env]
platform         = https://github.com/maxgerhardt/platform-raspberrypi.git
framework        = arduino
board            = rpipicow
board_build.core = earlephilhower
; Non-source directories excluded to avoid junk compilation
build_src_filter =
    +<*.cpp>
    +<*.c>
    +<*.h>
    +<*.hpp>
    +<*.ino>
    -<.git/>
    -<.pio/>
    -<.claude/>
    -<audits/>
    -<tools/>
    -<test/>

; --- LittleFS partition (1 MB, same as Arduino IDE) ---
board_build.filesystem_size = 1m

; --- Upload / monitor ---
upload_protocol  = picotool
monitor_speed    = 115200

; --- Build flags: optimize for size, elevate warnings ---
; NOTA REF-001: -flto não funciona — toolchain earlephilhower compilado com
; --disable-lto (gcc 14.3 sem suporte LTO). -fno-unwind-tables também sem
; efeito (já neutralizado por -fno-exceptions). Sem LTO, splitar
; DisplayManager.cpp adiciona ~2KB/.cpp de overhead → estoura flash a 98.6%.
; REF-001 fica bloqueado pelo budget de flash.
build_flags =
    -DPICO_CYW43_SUPPORTED=1
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    -Os
    -fmerge-all-constants
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-format-truncation
    -Wno-implicit-fallthrough

; --- External libraries (registry + GitHub, EXT-001: pinned exactos para reprodutibilidade) ---
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit ILI9341@1.6.3
    paulstoffregen/XPT2046_Touchscreen@1.3
    knolleary/PubSubClient@2.8

    ; ====================================================================
    ;  PIO co-processor libraries by Ângelo Moisés Alves (MIT, RP2040)
    ;  Disponíveis em duas fontes equivalentes:
    ;    - Arduino IDE:    Library Manager → procurar pelo nome da lib
    ;    - PlatformIO/CLI: pelo URL git abaixo (com SHA pin)
    ; ====================================================================
    ; OneWirePIO_RP2040 v1.0.0 — 1-Wire / DS18B20 hardware-accelerated
    ;   Arduino:        https://www.arduino.cc/reference/en/libraries/onewirepio_rp2040/
    ;   GitHub:         https://github.com/angeloINTJ/OneWirePIO_RP2040
    https://github.com/angeloINTJ/OneWirePIO_RP2040.git#3f0251e64ff441337fb0fb6ccfbad479e9530daa

    ; DHT22PIO_RP2040 v1.0.0 — DHT22 humidity/temp non-blocking via PIO
    ;   Arduino:        https://www.arduino.cc/reference/en/libraries/dht22pio_rp2040/
    ;   GitHub:         https://github.com/angeloINTJ/DHT22PIO_RP2040
    https://github.com/angeloINTJ/DHT22PIO_RP2040.git#d500e4d4a93078429fe0c876476f8da904b389ed

    ; BuzzerPIO_RP2040 v2.5.0 — passive buzzer, ultrasonic PWM dual-SM
    ;   Arduino:        https://www.arduino.cc/reference/en/libraries/buzzerpio_rp2040/
    ;   GitHub:         https://github.com/angeloINTJ/BuzzerPIO_RP2040
    https://github.com/angeloINTJ/BuzzerPIO_RP2040.git#ab8eab1d6102d6972444e3c909408d76b2bd7f13

; --- Pre-build: regenerate WebUI_GZ.h from WebUI.h ---
extra_scripts = pre:tools/build_webui_gz.py

; ============================================================================
;  Release environment
; ============================================================================
[env:pico_w_release]
build_type = release

; ============================================================================
;  Debug environment (extra logging, assertions)
; ============================================================================
[env:pico_w_debug]
build_type = debug
build_flags = ${env.build_flags} -DSIMUT_DEBUG_BUILD=1
