name: SIMUT custom build

# Compiles a build assembled in the configurator (docs/configurador/). The page
# dispatches this workflow with the profile; tools/build_custom.py re-applies the
# manifest's rules — the page is not the authority — compiles, and publishes the
# .uf2 (flash over USB) and the .bin (install through the web interface's OTA)
# as an artifact, with build.json carrying the measured sizes and sha256.
#
# Only accounts with write access can dispatch a workflow, so this is not open
# to the public; the public page offers them "request this build" instead.
#
# The inputs are untrusted text. They reach the shell only through `env:` and
# are read as variables — never interpolated into a `run:` script, which is the
# GitHub Actions injection path. build_custom.py validates the profile strictly
# before anything is downloaded or built.
#
# The .bin is signed (docs/analysis/OTA_ASSINADA.md): a device installs only a
# signed image over the air. `build` compiles with no secret in reach; `sign`
# runs in the `release` Environment, which waits for the maintainer's approval
# before the key reaches it, exactly as a release does. The page shows that wait
# as its own state. build_custom.py never builds an image that trusts the bench
# root, and the signing tool would refuse one if it did.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Configurator profile: {"v":1,"base":"pico_w_air","set":{...}}'
        required: true
        type: string
      request_id:
        description: 'Id the page uses to find this run (a-z, 0-9, dash)'
        required: true
        type: string

# The page finds its run by this title (the dispatch API returns no run id).
run-name: custom build ${{ inputs.request_id }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read by the signing job, which publishes under the name the page parses.
    outputs:
      name: ${{ steps.build.outputs.name }}
      used: ${{ steps.build.outputs.used }}
      bin: ${{ steps.build.outputs.bin }}
      ram: ${{ steps.build.outputs.ram }}
      fits_ota: ${{ steps.build.outputs.fits_ota }}
    steps:
      - name: Validate the request id
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          if [[ ! "$REQUEST_ID" =~ ^[a-z0-9-]{8,40}$ ]]; then
            echo "request_id must be 8-40 characters of a-z, 0-9 and dash" >&2
            exit 2
          fi

      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Before anything is downloaded: a profile that is malformed or breaks a
      # rule fails here in seconds, not after a toolchain install.
      - name: Validate the profile
        env:
          SIMUT_PROFILE: ${{ inputs.profile }}
        run: python3 tools/build_custom.py --validate-only

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-custom-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-custom-
            ${{ runner.os }}-pio-fw-

      - name: Install PlatformIO
        run: pip install platformio zopfli

      # The same patched framework every firmware build uses: a factory
      # arduino-pico has not compiled since v2.3.0 (see build.yml).
      - name: Apply framework overrides
        run: |
          pio pkg install -e pico_w_release
          bash tools/arduino_pico_overrides/patch.sh

      - name: Build
        id: build
        env:
          SIMUT_PROFILE: ${{ inputs.profile }}
        run: python3 tools/build_custom.py --out build-custom

      - name: Hand the build to the signing job
        uses: actions/upload-artifact@v7
        with:
          # Not `simut-…`: the page takes the first artifact by that prefix, and
          # this one is not yet the firmware it can install over the air.
          name: unsigned-${{ inputs.request_id }}
          path: build-custom/
          retention-days: 1
          if-no-files-found: error

      - name: Summary
        env:
          NAME: ${{ steps.build.outputs.name }}
          USED: ${{ steps.build.outputs.used }}
          BIN: ${{ steps.build.outputs.bin }}
          RAM: ${{ steps.build.outputs.ram }}
          FITS_OTA: ${{ steps.build.outputs.fits_ota }}
        run: |
          {
            echo "### $NAME"
            echo ""
            echo "| | bytes |"
            echo "|---|---:|"
            echo "| flash used | $USED |"
            echo "| .bin | $BIN |"
            echo "| RAM used | $RAM |"
            echo ""
            if [ "$FITS_OTA" = "true" ]; then
              echo "Installs over OTA (.bin) or USB (.uf2)."
            else
              echo "**Attention:** the .bin is over the OTA ceiling — flash the .uf2 over USB."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The approval: the secret reaches this job only after the maintainer, the
    # Environment's required reviewer, approves the run.
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install the signing tool's one dependency
        run: pip install cryptography

      - uses: actions/download-artifact@v8
        with:
          name: unsigned-${{ inputs.request_id }}
          path: build-custom

      # The same steps as the release's (release-ota.yml): keys/ checked, the
      # key in a 0600 file shredded on the way out, the image refused if it
      # trusts the bench root, each result verified the way the image it came
      # from would. build.json gets the signed file's size and sha256, since
      # that is the .bin it hands over.
      - name: Sign the image
        env:
          OTA_SIGNER_KEY: ${{ secrets.OTA_SIGNER_KEY }}
        run: |
          set -euo pipefail
          python3 tools/ota_sign.py check-keys
          umask 077
          key="$RUNNER_TEMP/signer.p8"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          printf '%s\n' "$OTA_SIGNER_KEY" > "$key"
          shopt -s nullglob
          bins=(build-custom/*.bin)
          if [ "${#bins[@]}" -ne 1 ]; then
            echo "expected one .bin in the build, found ${#bins[@]}" >&2
            exit 1
          fi
          bin="${bins[0]}"
          python3 tools/ota_sign.py sign --key "$key" --cert keys/ota_signer_release.cert \
            --in "$bin" --out "$bin.signed"
          python3 tools/ota_sign.py verify --in "$bin.signed" --running "$bin"
          mv "$bin.signed" "$bin"
          python3 tools/ota_sign.py inspect --in "$bin"
          python3 - "$bin" <<'PY'
          import hashlib, json, sys
          path = sys.argv[1]
          report = json.load(open("build-custom/build.json", encoding="utf-8"))
          data = open(path, "rb").read()
          report["files"]["bin"].update(sha256=hashlib.sha256(data).hexdigest(), bytes=len(data))
          report["signed"] = True
          with open("build-custom/build.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          PY

      - name: Publish the firmware
        uses: actions/upload-artifact@v7
        with:
          # The page reads the measured sizes back from this name: the artifact
          # list is readable through the API, the job's outputs are not. The
          # sizes are the build's, measured before the 241 B of signature.
          name: simut-${{ inputs.request_id }}-bin${{ needs.build.outputs.bin }}-ram${{ needs.build.outputs.ram }}
          path: build-custom/
          retention-days: 30
          if-no-files-found: error
