name: SIMUT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Everything that does not need the Arduino framework: the tracked-content
  # gates and the native test suites. Split out from the firmware build so a
  # broken image does not delay the answer to "did the logic still pass", and
  # so this job stays fast enough to be the one people watch.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # First, and before anything is fetched or built: a tracked secret is
      # not a build failure to be discovered at the end. Same gate the
      # release scripts run (tools/build_release.sh).
      - name: Secret gate
        run: ./tools/scan_secrets.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        # zopfli is what tools/build_webui_gz.py compresses the 13 web pages
        # with (-2,888 B against gzip -9, measured 2026-09-18). It is optional
        # by design — without it the script falls back to gzip -9 and prints a
        # WARN — but the flash budgets are measured WITH it, so CI installs it.
        run: pip install platformio zopfli

      - name: Check log-code tables in sync
        run: python3 tools/gen_logcodes.py --check

      # Every HTTP route must enforce authorization or be allowlisted as public
      # with a reason — the matrix is documented in docs/AUTHORIZATION.md. This
      # is what blocks a newly-added route from shipping without a gate. Since
      # 2026-10-28 it holds the panel's half too: every UiEvent is classified,
      # and a GATED one calls panelAllowed( ) with its bit before its first write.
      - name: Check authorization matrix
        run: python3 tools/check_authz.py

      # A gate that finds nothing on a clean tree is proved on mutated copies of
      # it: each rule gives exactly its findings (tools/test_check_authz.py).
      - name: Test the authorization gate
        run: python3 tools/test_check_authz.py

      # The MIT text lives in three places (LICENSE, the /license page, and
      # the firmware string the panel draws) and two release scripts are
      # supposed to ship the file with the source. The web page said 2025
      # while everything else said 2026, and the Arduino zip went out with no
      # LICENSE at all — neither is a compile error.
      - name: Check licence consistency
        run: python3 tools/check_license.py

      # One list of third-party software (tools/third_party.toml), three
      # places that state it: THIRD_PARTY_NOTICES.md, the /license page and
      # the panel's License screen. They had drifted apart: six components
      # every image links were cited nowhere, and BTstack's terms were wrong.
      - name: Check the third-party notices
        run: python3 tools/gen_notices.py --check

      # The Ângulo interface standard (ANGULO.md), where a machine can see it:
      # the token copy is pinned, the site's CSS names no colour and stays on
      # the 4 px grid and the three radii, the brand uses token colours, and
      # no emoji plays an icon in the READMEs, on the site or in a Living
      # document. What it does not check, the device's web UI included, is in
      # AGENTS.md §7.
      - name: Check the Ângulo interface standard
        run: python3 tools/check_angulo.py

      # The counts the three READMEs quote — host test cases and suites, the
      # release image's share of the slot, event codes, routes — against the
      # files that own them. On 2026-10-01 every README still carried the
      # v2.7.1 flash figures and two test counts behind the suites, and an
      # outside review quoted them back as the state of the project.
      - name: Check the numbers the READMEs quote
        run: python3 tools/check_readme_numbers.py

      # The OTA headroom table (docs/analysis/PLANO_STABLE.md §3.1) against the
      # "bin" each image records in tools/flash_budget.json. The ceiling does
      # not move on the Pico W, so how far each image is from it is what is
      # left for new features — and a table of that is right only on the day it
      # is typed, unless something holds it. Each firmware job below fails a
      # .bin larger than its record; this fails a table the record contradicts.
      # test_flash_budget.py pins both rules.
      - name: OTA headroom table matches the record
        run: python3 tools/check_flash_budget.py --table
      - name: OTA headroom gate tests
        run: python3 tools/test_flash_budget.py
      # The bench's web client (tools/air_test_suite.py) logs back in when the
      # device dropped its session, which it keeps one per user: a 403, or a 401
      # with requirePerm's exact body. A handler's own 401 (a wrong password) is
      # returned untouched, so no failure is counted twice toward the lockout.
      - name: Bench web client session tests
        run: python3 tools/test_air_web_session.py

      # Every filesystem-mutating handler (delete/upload/ls) and the restore
      # validator must refuse the /config credential store. This is what blocks
      # a guard removal from shipping (findings ACH-01..04).
      - name: Check /config filesystem guard
        run: python3 tools/check_fsguard.py

      # Each check maps to a finding of the 2026-09-06 Air review (F15-F19):
      # "[AIR]" markers escaping into the TFT release, the emergency help
      # advertising commands the image does not carry, an Air method declared
      # and never defined. Static — no hardware, no PlatformIO — so it belongs
      # next to the other source gates rather than behind a build.
      - name: Air consistency gate
        run: python3 tools/check_air_consistency.py

      # The feature model (docs/analysis/MODELO_DE_RECURSOS.md, P1): tools/
      # features.toml is the single source, gen_features.py derives the seven
      # firmware environments into tools/generated/profiles.ini, and
      # platformio.ini includes that file via extra_configs (it no longer
      # defines [env:pico_w_*]). --check keeps the generated files in sync with
      # the manifest; check_features.py proves — via PlatformIO's own resolver —
      # that the environments the build uses are, flag for flag and
      # translation-unit for translation-unit, what the manifest describes. This
      # is the gate that keeps the manifest and the build from drifting apart.
      - name: Feature model in sync
        run: python3 tools/gen_features.py --check
      - name: Feature model reproduces platformio.ini
        run: python3 tools/check_features.py
      # The "feat" of /api/status is computed from the macros the compiler
      # sees (src/FeatureBits.h), and a client decodes it with the manifest's
      # bits. This preprocesses the header with every profile's flags, and
      # with each switch flipped from it, and compares the two.
      - name: Feature bits /api/status reports
        run: python3 tools/test_feature_bits.py
      # The savings floor itself (measure_savings.py --check) builds 21 images,
      # so it runs nightly in savings.yml, where no pull request sees it. What
      # it compares is tested here: the fill the linker puts in front of the
      # BTstack flash bank, read from the map and taken off both sides. Counted,
      # it moved the floor of every switch on the alpha and the Air with each
      # byte of .rodata anywhere in the image: on 2026-10-22, after 21 red
      # nights, it was all of bluetooth's drop and part of tel_tls's.
      - name: Savings floor measures past the BTstack bank's fill
        run: python3 tools/test_measure_savings.py

      # The network driver is the image's identity (SIMUT_NET_CYW43, the default,
      # or SIMUT_NET_ENC28J60) and the Wi-Fi / cable class (SIMUT_NET_WIFI,
      # SIMUT_NET_LAN) is derived from it in src/net/NetCaps.h and never passed
      # with -D. The preprocessor answers for each driver, the build that passes
      # the class or two drivers or none stops at an #error, a second wired driver
      # added by the recipe in that header's comment is held to its own OTA names,
      # and every #error is taken out in turn to see exactly its cases fail.
      - name: Network driver and class
        run: python3 tools/test_net_caps.py

      # The wired build (the ENC28J60 driver, the SIMUT Wire: a plain Pico with the
      # network on an ENC28J60 module) is held, by the preprocessor, to the pins
      # it may use, the radio it does not have and the name it takes in the OTA.
      # The module on the display's or the buzzer's pin, two of its own lines on
      # one GPIO, Bluetooth or the Air beside it, a Wi-Fi build without the CYW43
      # and a wired one that still has it all stop at an #error in
      # src/simut_config.h, and the names are "wire" and "wiretft", apart from
      # every Pico W image. The test also takes each of those #error lines out of
      # a copy of the header in turn and requires exactly one case to fail, so a
      # guard that stopped guarding is seen; a layout that cannot work has to
      # stop the build and not the board.
      - name: Pin masks and variant names of the wired build
        run: python3 tools/test_pin_masks.py

      # A wired build cuts the radio's parts of the web pages (web_omit = "wifi"
      # of the lan class) and, with the ENC28J60, its 16-slot texts ("slots16" of
      # the driver); a Wi-Fi build keeps both.
      - name: Web pages per network
        run: python3 tools/test_web_omit_network.py

      # Whether a combination fits in the PIO blocks, and which GPIO two owners
      # claim, before anything compiles: the firmware finds out only at boot,
      # when it logs "pio0 full" and drops a sensor.
      - name: PIO budget (blocks, state machines and pins a build asks for)
        run: python3 tools/test_pio_budget.py

      # The entanglement watermark (MODELO_DE_RECURSOS.md, P2): the count of
      # `#if SIMUT_` sites per feature macro and per file, held to a high-water
      # mark in tools/feature_sprawl.json. A site added to a shared file fails;
      # extracting a feature into its own translation unit — the P2 goal —
      # lowers the mark. Same idea as the flash budget, for entanglement.
      - name: Feature entanglement watermark
        run: python3 tools/check_feature_sprawl.py

      # The network is one driver per image, and the rest of src/ must not know which:
      # outside src/net/ no identity macro (SIMUT_NET_CYW43, SIMUT_NET_ENC28J60, the
      # module's SIMUT_ENC_* pins), no call on the radio (WiFi., cyw43_), no driver
      # library included (...lwIP.h, LwipIntfDev.h), and a file that tests the class
      # (SIMUT_NET_WIFI, SIMUT_NET_LAN) includes simut_config.h or net/NetCaps.h
      # itself. What still breaks a rule is listed in tools/net_boundary.json, each
      # with its reason, and the counts only go down. Adding a board is then a driver
      # in src/net/ and a manifest entry, and this is what makes it so. The test puts
      # one violation of each rule into a clean tree, and into a copy of the real one,
      # and requires exactly one finding.
      - name: Network boundary (the chip stays in src/net/)
        run: |
          python3 tools/test_net_boundary.py
          python3 tools/check_net_boundary.py

      # patch.sh runs again and again: after every override that merges, and in the
      # firmware jobs on a warm ~/.platformio cache that already carries them (see
      # "Apply framework overrides" below). Each step skips itself when a grep finds
      # the marker its own patch adds. A marker the patch does not add costs nothing
      # on the first run and ends the second: `patch` meets the applied hunk, asks
      # "Assume -R?", rejects it, and `set -e` stops the script before the steps after
      # it and before the cache invalidation. Step 2b-ter (#274) did exactly that
      # from 2026-10-15. The test breaks each guard four ways and requires exactly one
      # finding; the gate reads patch.sh against patches/.
      - name: Framework overrides (every patch.sh guard matches its patch)
        run: |
          python3 tools/test_patch_sentinels.py
          python3 tools/check_patch_sentinels.py

      # The configurator's rules (tools/features.toml [[rules]], each measured
      # by compiling the forbidden combination). They are applied twice: by
      # docs/configurador/rules.js, so the page can lock an option, and by
      # gen_features.rule_violations, which the build side applies before
      # compiling — the page is not the authority. Two implementations of one
      # rule drift apart silently; this runs both against one table and also
      # fails on a rule no case exercises. node ships with the runner.
      - name: Configurator rules (page and CI agree)
        run: python3 tools/test_configurator_rules.py

      # The door of the custom build (.github/workflows/build-custom.yml): the
      # profile arrives through a workflow_dispatch, and what got past
      # tools/build_custom.py would become PlatformIO configuration — a newline
      # in a product name would be a new [env]. Hostile profiles must be
      # refused before anything is built, the rules must refuse what they
      # forbid, and no profile may inject a workflow command into the log.
      - name: Custom build input (hostile profiles refused)
        run: python3 tools/test_build_custom.py

      # The configurator page's arithmetic (docs/configurador/logic.js), run
      # under node against the generated model.json and checked against the
      # Python side: the profile it writes is the one build_custom.py accepts,
      # spelled the same; a single change estimates exactly what the matrix
      # measured; a locked switch is one the rules forbid; hostile links are
      # refused; the accuracy it claims is the one recomputed here.
      - name: Configurator page (its sums and locks match the build side)
        run: python3 tools/test_configurator_page.py

      # The web UI is cut per image (`@IF tft` in WebUI.h), and a route only
      # the touch-panel images register must be called from inside such a
      # block, or the alpha and the Air carry a button that answers 404 — the
      # touch-calibration section #184 left behind. build_webui_gz.py refuses
      # it on every build; this pins that refusal, so a change to the check
      # cannot quietly stop it from biting.
      - name: Web UI feature routes (panel-only routes stay inside @IF tft)
        run: python3 tools/test_webui_feature_routes.py

      # The text viewer lays a text out for reading: JSON indented with blocks
      # that fold, the sections of a pack, NDJSON, numbered lines. It lives in
      # lang.js and draws the /files viewer and the telemetry page's two
      # payload previews. Its pure part is pulled out of WebUI.h and run under
      # node twice, as written and as the build's minifier leaves it, because
      # the minifier has deleted shipped code before and reported success.
      - name: Web UI text viewer (as written and minified)
        run: python3 tools/test_webui_text_viewer.py

      # The theme select of the dashboard shows the stock names in the device's
      # language: GET /api/themes sends {"id","code","name"} with the name in
      # English, and the page asks the pack's @WEBDICT for thm_<code>. The pure
      # part that builds the options is pulled out of WebUI.h and run under node,
      # as written and minified, with lang.js's own t( ), escHtml( ) and
      # applyLang( ); the data checks hold every stock code to a key in both
      # packs and data/themes to the generator's names.
      - name: Web UI theme names (as written and minified)
        run: python3 tools/test_webui_theme_names.py

      # The telemetry page's Live Preview builds the body the device sends,
      # from this device: its name, MAC, readings, limits and account. A
      # preview that disagrees with the firmware misleads whoever writes the
      # collector, and it did: the alarm walker stopped at v22 and called the
      # default template invalid JSON, and the CSV previews had one column
      # per active sensor where the device sends 34, and 4 where it sends 8.
      # Its functions run under node against the firmware's own vectors
      # (test_alarm_queue), vectors derived from the C++ formatters, and every
      # alarm code AlarmPayload.h has.
      - name: Web UI payload preview (held to the firmware)
        run: python3 tools/test_webui_payload_preview.py

      # The Files page explains a stage the device did not commit. A refusal
      # before any validation carries no `v`, only the device's own words:
      # the RP2350 image answers every stage that way (501) until its A/B
      # slots exist, and the page printed "validation v=undefined" for it.
      # fwStageMessage( ) runs under node, as written and minified.
      - name: Web UI firmware refusal (every stage refusal in words)
        run: python3 tools/test_webui_firmware_refusal.py

      # The Pico 2 W's update boots on trial and can go back by itself, and
      # /api/status says so (slot, trial, reverted). The dashboard and the Files
      # page show it, from @IF slot blocks every RP2040 image cuts. fwSlotNote( )
      # runs under node, as written and minified; the cut is held per chip; the
      # Pico 2 W's Files page warns without "reformatted", which its update is
      # not; both packs carry the keys.
      - name: Web UI trial note (the Pico 2 W's update on trial, and the way back)
        run: python3 tools/test_webui_trial_note.py

      # The Pico 2 W boots from slot A of a partition table, and four files say
      # where everything is: the table picotool writes, the map in
      # ota_layout.h, the slot's linker script and the PlatformIO profile. A
      # number changed in one and not the others is a board that boots one
      # layout and reads another. What only a build can show is
      # tools/check_rp2350_image.py's, after every pico2_w_release link.
      - name: RP2350 flash layout (one map in four places)
        run: python3 tools/test_rp2350_layout.py

      # An update to the Pico 2 W boots on trial and stays only if it buys
      # itself: tools/rp2350/picobin.py flags the over-the-air image for it,
      # one bit of IMAGE_TYPE, and the board never boots a flagged image from
      # USB. The bit, only it, and only in firmware_ota.bin.
      - name: RP2350 trial flag (the OTA image alone)
        run: python3 tools/test_rp2350_trial.py

      # The release publishes the Pico 2 W's images since step 7 of
      # OTA_AB_RP2350.md: the update, flagged for trial, and a factory .uf2 made
      # from it with the flag cleared and the partition table in front.
      # tools/release_manifest.py writes both in the publish job, which has no
      # picotool and runs only at a tag. This holds its output and its refusals
      # on synthetic images, and holds the workflow's loops to the manifest's
      # list, on every push.
      - name: Release manifest (the Pico 2 W's update and factory image)
        run: python3 tools/test_release_manifest.py

      # OTA applies reformat the LittleFS, so benches restore /history from
      # backup — and the current-day file can only be given back by MERGING
      # with what the device wrote meanwhile. This is the tool that hole
      # prevention rests on (docs/analysis/ANALISE_BURACO_HISTORICO_BANCADA_OTA.md).
      - name: History V5 day-merge tests
        run: python3 tools/test_h5_day_merge.py

      # The OTA signature tool (docs/analysis/OTA_ASSINADA.md): its round trips
      # and tamper cases with real ECDSA, and the committed host vectors, which
      # are randomized signatures and so are checked by meaning: every listed
      # signature verifies, and every blob gets the verdict the C++ tests expect.
      # gen-trust --check: src/ota/ota_trust.h, the roots and floors every image
      # compiles, is what keys/ says — a key changed without regenerating it
      # would ship images that trust the old one. check-keys: the certificate
      # the release jobs sign with is signed by the release root and not revoked
      # by the policy, so a bad rotation fails here and not at a release.
      - name: OTA signature tool and vectors
        run: |
          pip install cryptography
          python3 tools/ota_sign.py selftest
          python3 tools/ota_sign.py vectors --check
          python3 tools/ota_sign.py gen-trust --check
          python3 tools/ota_sign.py check-keys

      # ALL ELEVEN native environments. Separate steps rather than one
      # `pio test -e a -e b ...` so a failure names itself in the Actions UI
      # instead of hiding behind the first environment that broke.
      #
      # native_alarmqueue and native_air were missing here until 2026-09-08 —
      # 27 cases that only ran when someone remembered to run them by hand,
      # covering the alarm queue's invariants and the Air configuration. If you
      # add an [env:native_*] to platformio.ini, add it here in the same change.
      - name: Run unit tests (validators)
        run: pio test -e native

      - name: Run unit tests (HistoryV5)
        run: pio test -e native_history_v5

      - name: Run unit tests (CLI parser)
        run: pio test -e native_cli

      # The same parser compiled for a wired build (2026-10-13): no `ap`, no
      # SSID, and `ip`/`dns` in the emergency console; its pack help is
      # @HELPWIRE.
      - name: Run unit tests (CLI parser, wired build)
        run: pio test -e native_lan

      - name: Run unit tests (LogPolicy)
        run: pio test -e native_logpolicy

      - name: Run unit tests (AlarmQueue)
        run: pio test -e native_alarmqueue

      - name: Run unit tests (Air config)
        run: pio test -e native_air

      # The sensor type table (SensorHelpers.h). The sensor pipeline had no
      # native coverage until the feature-model seam (P2) turned its per-type
      # metadata into a data table; this pins that table's contract.
      - name: Run unit tests (sensor table)
        run: pio test -e native_sensors

      # The reconnect state machine, against a controllable radio. Its knobs
      # are shaped like the failures seen on real devices — a scan that never
      # completes, an access point that is joinable but invisible — because
      # those are the ones it has to survive. Eight of these seventeen cases
      # fail against the code as it stood before 2026-09-08.
      - name: Run unit tests (network state machine)
        run: pio test -e native_network

      # The wired network's states (net/NetworkManager_Wired.cpp) against a fake
      # ENC28J60 (2026-10-13): no host test ran them before, and they are pinned
      # here before the network becomes a driver.
      - name: Run unit tests (wired network state machine)
        run: pio test -e native_wired

      # The signature check of a staged OTA image, against the vectors above:
      # every refusal, and every trailer byte covered.
      - name: Run unit tests (OTA signature)
        run: pio test -e native_otasig

      # The same ten suites again, under AddressSanitizer and UBSan, with
      # undefined behaviour made fatal. The plain runs above are the contract;
      # this run sees what a passing assertion cannot - a read past a buffer, a
      # reference to a dead frame that still holds the right bytes. Its first
      # run, on 2026-10-01, stopped test_network on a stack-use-after-return in
      # the test stub's min( ), which returned a reference to its own by-value
      # parameter. PLATFORMIO_BUILD_FLAGS reaches compile AND link on the native
      # platform (and wipes .pio/build, which is why this runs last). The test
      # runner hides the sanitizer's report, so a failing suite's binary is run
      # again directly to put the report in the log.
      - name: Host suites under AddressSanitizer and UBSan
        env:
          PLATFORMIO_BUILD_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined
        run: |
          rc=0
          for e in native native_history_v5 native_cli native_lan native_logpolicy \
                   native_alarmqueue native_air native_sensors native_network native_wired native_otasig; do
            if ! pio test -e "$e"; then
              rc=1
              echo "::group::$e, run directly for the sanitizer report"
              ".pio/build/$e/program" 2>&1 | tail -80 || true
              echo "::endgroup::"
            fi
          done
          exit $rc

  # Every image the repository claims to build, in parallel.
  #
  # Until 2026-09-08 this compiled pico_w_release and nothing else, so the other
  # five existed only on the maintainer's machine. The one with the least room
  # is SIMUT Air, which is exactly the one that was not watched: a change could
  # eat kilobytes of its flash slot and go in green. Each image is now built and
  # measured against tools/flash_budget.json.
  firmware:
    runs-on: ubuntu-latest
    strategy:
      # One image failing must not cancel the others — when something breaks
      # across the board, the useful information is WHICH ones broke.
      fail-fast: false
      matrix:
        env:
          - pico_w_release
          - pico_w_test
          - pico_w_test_https
          - pico_w_asserts
          - pico_w_alpha
          - pico_w_air
          # The release on the Pico 2 W's RP2350 (2026-10-01, S0 of Phase 4 in
          # docs/analysis/PLANO_REVISAO_EXTERNA.md). Nothing runs it on a board
          # yet; building it here is what keeps the code from drifting back to
          # RP2040-only addresses with nobody noticing.
          - pico2_w_release
          # The SIMUT Wire (2026-10-12): a plain Pico, without the radio, its
          # network on an ENC28J60 module (src/net/, net/NetworkManager_Wired.cpp).
          # Building it here keeps the guards of src/simut_config.h section 10b
          # and the wired side of NetworkManager compiling, without the radio's
          # unit (src/net/NetworkManager_Cyw43.cpp).
          - pico_wire
          # The SIMUT Wire with the TFT panel (2026-10-13): pico_wire with the
          # touch display, so the TFT side of a wired build compiles here too.
          - pico_wiretft
    name: firmware (${{ matrix.env }})
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Only ~/.platformio — the toolchain and framework packages, which are
      # large and never change between runs. Deliberately NOT .pio: a cached
      # build directory makes the compiler skip translation units it has
      # already built, and a skipped translation unit emits no warnings and
      # contributes no fresh size measurement. The flash figure this job gates
      # on has to come from a real compile, so the build starts cold every time.
      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-fw-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-fw-${{ matrix.env }}-
            ${{ runner.os }}-pio-fw-

      - name: Install PlatformIO
        # zopfli is what tools/build_webui_gz.py compresses the 13 web pages
        # with (-2,888 B against gzip -9, measured 2026-09-18). It is optional
        # by design — without it the script falls back to gzip -9 and prints a
        # WARN — but the flash budgets are measured WITH it, so CI installs it.
        run: pip install platformio zopfli

      # SIMUT builds against a patched arduino-pico (TLS handshake deadlines,
      # the keep-alive API, the static TLS server pool — see
      # tools/arduino_pico_overrides/). A factory framework has not compiled
      # since v2.3.0 (enableKeepAlive), and patch.sh never ran here: the whole
      # 2.3 line went out with build-and-test red on main. Install the platform
      # packages first so the framework exists, then apply the overrides — the
      # script is idempotent, so a warm cache that already carries them is fine.
      - name: Apply framework overrides
        run: |
          pio pkg install -e ${{ matrix.env }}
          bash tools/arduino_pico_overrides/patch.sh

      # pipefail, because the default shell is `bash -e` and without it the
      # exit status of the pipeline is tee's — which is always 0, and a failed
      # compile would be reported as a passing step.
      - name: Build ${{ matrix.env }}
        run: |
          set -o pipefail
          pio run -e ${{ matrix.env }} 2>&1 | tee build.log

      # Reads the size PlatformIO itself printed above. Skips the environments
      # recorded as unbudgeted, and fails on one that has neither a budget nor
      # a recorded reason — so adding an image to platformio.ini without
      # deciding what it is allowed to weigh does not pass silently. Then holds
      # firmware.bin, signed, to the OTA ceiling and to the size recorded for
      # it ("bin"); an image under "ota_exempt" is held to neither.
      - name: Check flash budget
        run: python3 tools/check_flash_budget.py ${{ matrix.env }} build.log

      # The sizes tools/pio_budget.py counts with, held to the programs' own
      # sources. The gates job has neither the libraries nor the framework and
      # skips that part of the test; after a build both are on disk, and
      # `require` makes a source that went missing a failure instead of a skip
      # nobody reads. Two images are enough: the libraries are pico_base's, the
      # same in all nine, except the ENC28J60's, which only the wired images
      # pull. pico_w_release is a required check and holds the other four;
      # pico_wire names the ENC28J60 header, and a named header is required.
      - name: PIO program sizes match their sources
        if: matrix.env == 'pico_w_release'
        env:
          SIMUT_PIO_SOURCES: require
        run: python3 tools/test_pio_budget.py

      - name: PIO program sizes match their sources (with the ENC28J60)
        if: matrix.env == 'pico_wire'
        env:
          SIMUT_PIO_SOURCES: require
          SIMUT_LIBDEPS: .pio/libdeps/pico_wire
          ENC_PIO_HEADER: .pio/libdeps/pico_wire/PicoENC28J60/src/enc28j60-spi.pio.h
        run: python3 tools/test_pio_budget.py

      # Override 2n's write buffer decides when a response's bytes leave the
      # server, which no host suite sees: they do not compile the framework.
      # After patch.sh it is on disk, and the test compiles the patched
      # HTTPServer.cpp on the host against a client that records every write,
      # then takes each rule out of a copy and expects the scenario named for
      # it to fail. `require` makes a missing framework a failure, not a skip.
      # One image is enough: the WebServer library is the same in all nine.
      - name: WebServer write buffer (override 2n), on the host
        if: matrix.env == 'pico_w_release'
        env:
          SIMUT_WEBSERVER_OUT: require
        run: python3 tools/test_webserver_out.py

  # Same reasoning as static-analysis: its own job costs no wall clock next
  # to the firmware build, and a finding names itself in the Actions UI.
  # The harness checks contract oracles, not "didn't crash" — the validators
  # are pure functions random bytes cannot crash, so a crash-only fuzz run
  # would stay green while measuring nothing. See tools/run_fuzz.sh and the
  # header of test/test_fuzz/fuzz_validators.cpp. libFuzzer ships inside the
  # runner's clang; nothing to install.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fuzz web-API validators (60 s, contract oracles)
        run: ./tools/run_fuzz.sh

  # Separate job so the analysis runs alongside the firmware build instead of
  # after it: cppcheck takes minutes, and in its own job those minutes cost no
  # wall clock. It also fails on its own, without a red build to read through.
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cppcheck
        uses: actions/cache@v6
        with:
          path: ~/.platformio/packages/tool-cppcheck
          key: ${{ runner.os }}-cppcheck-${{ hashFiles('tools/run_cppcheck.sh') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # PlatformIO is how the pinned cppcheck is fetched — see the header of
      # tools/run_cppcheck.sh for why the version is pinned at all.
      - name: Install PlatformIO
        # zopfli is what tools/build_webui_gz.py compresses the 13 web pages
        # with (-2,888 B against gzip -9, measured 2026-09-18). It is optional
        # by design — without it the script falls back to gzip -9 and prints a
        # WARN — but the flash budgets are measured WITH it, so CI installs it.
        run: pip install platformio zopfli

      - name: Static analysis (cppcheck)
        run: ./tools/run_cppcheck.sh
