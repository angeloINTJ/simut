# Publishes the per-variant OTA images and their manifest on a version tag.
#
# The fleet manager (simut-rx) downloads manifest.json from the release,
# picks the image whose `env` matches what the device reports in /api/perms,
# verifies the SHA-256, scans the file for the SIMUT-ENV tag, and only then
# stages it. Every one of those checks needs this job to have run: without a
# manifest the app has nothing to compare against, and it refuses to update.
#
# Four hardware variants: the Pico W's release, alpha and Air, and, since step
# 7 of docs/analysis/OTA_AB_RP2350.md, the Pico 2 W's release (env
# `releasetwo`). The Pico 2 W's .bin is its update, flagged for trial, and its
# .uf2 is a factory image with the partition table in front (the manifest step).
#
# Since signed OTA (docs/analysis/OTA_ASSINADA.md, 2026-10-01) the images go
# through three jobs. `build` compiles, with no secret in reach. `sign` runs in
# the `release` Environment: GitHub hands it the signing key only after the
# maintainer approves the run, and tools/ota_sign.py refuses an image that
# trusts the bench root or would refuse its own successor, then every signed
# file is verified again before it leaves the job. `publish` writes the
# manifest, the checksums and the attestation over the signed images, so what
# an operator verifies is what the device installs.
#
# workflow_dispatch builds and signs without publishing: the candidate the
# release gate installs on the rig (AGENTS.md, "Retenção de dados no update"),
# signed the way the release will be. It is the `signed-images` artifact of the
# run.
name: OTA release assets

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        # zopfli, same as build.yml: tools/build_webui_gz.py compresses the 13
        # web pages with it and falls back to gzip -9 without it — by design, so
        # a release-zip build with a bare Python still works. The fallback is
        # silent enough that v2.4.9-beta shipped assets 2,888 B larger than the
        # tree measures, because this file was not updated alongside build.yml
        # when the dependency was added. The images were correct, just bigger
        # than the number in their own release notes.
        run: pip install platformio zopfli
      - name: Apply framework overrides
        # O framework arduino-pico é corrigido por tools/arduino_pico_overrides/
        # (o mesmo do build.yml): sem o patch, enableKeepAlive não existe e a
        # build falha. Instala o framework primeiro, depois aplica os overrides.
        run: |
          pio pkg install -e pico_w_release
          pio pkg install -e pico_w_alpha
          pio pkg install -e pico_w_air
          pio pkg install -e pico2_w_release
          bash tools/arduino_pico_overrides/patch.sh
      - name: Build the four hardware variants
        # Harvest each image the moment it is built, before the next variant
        # runs. Observed locally: by the time a single manifest pass runs at
        # the end, only the last-built env still has firmware.bin under
        # .pio/build — building a later variant leaves the earlier ones' images
        # absent, so the release went out with one variant instead of three.
        # Copying each .bin out as soon as it exists sidesteps that, whatever
        # the later builds do to the tree.
        #
        # release/build/<env>/firmware.bin is, for every variant, the image an
        # update installs, the one the next jobs sign and verify. For the Pico
        # 2 W that is firmware_ota.bin, flagged for trial
        # (tools/check_rp2350_image.py); its partition table goes along, for
        # the factory .uf2.
        run: |
          set -euo pipefail
          for env in pico_w_release pico_w_alpha pico_w_air pico2_w_release; do
            pio run -e "$env"
            mkdir -p "release/build/$env"
            if [ "$env" = pico2_w_release ]; then
              cp ".pio/build/$env/firmware_ota.bin" "release/build/$env/firmware.bin"
              cp ".pio/build/$env/partition_table.uf2" "release/build/$env/partition_table.uf2"
            else
              cp ".pio/build/$env/firmware.bin" "release/build/$env/firmware.bin"
            fi
          done
      - name: Hand the images to the signing job
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-images
          path: release/build/
          retention-days: 1
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    # The Environment is the approval: its secret reaches this job only after
    # the maintainer, its required reviewer, approves this run. It admits the
    # `main` branch and `v*` tags and nothing else.
    environment: release
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install the signing tool's one dependency
        run: pip install cryptography
      - uses: actions/download-artifact@v8
        with:
          name: unsigned-images
          path: release/build
      - name: Sign the images
        # The key lives in a 0600 file for the length of this step and is
        # shredded on the way out, whatever happens. `check-keys` first: the
        # certificate signed with has to be one keys/ vouches for. `sign`
        # refuses a key that is not the certificate's, an image that trusts the
        # bench root, and one that would refuse the next image from this key;
        # `verify --running` then checks each file the way the image it came
        # from would, as the device running it will.
        env:
          OTA_SIGNER_KEY: ${{ secrets.OTA_SIGNER_KEY }}
        run: |
          set -euo pipefail
          python3 tools/ota_sign.py check-keys
          umask 077
          key="$RUNNER_TEMP/signer.p8"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          printf '%s\n' "$OTA_SIGNER_KEY" > "$key"
          for env in pico_w_release pico_w_alpha pico_w_air pico2_w_release; do
            bin="release/build/$env/firmware.bin"
            python3 tools/ota_sign.py sign --key "$key" --cert keys/ota_signer_release.cert \
              --in "$bin" --out "$bin.signed"
            python3 tools/ota_sign.py verify --in "$bin.signed" --running "$bin"
            mv "$bin.signed" "$bin"
            python3 tools/ota_sign.py inspect --in "$bin"
          done
      - name: Hand the signed images on
        uses: actions/upload-artifact@v7
        with:
          # On a dispatch, this is the release candidate: long enough to go
          # through the retention test on the rig.
          name: signed-images
          path: release/build/
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: sign
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance (the last step): the OIDC token signs the attestation,
      # and attestations: write stores it against this repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: signed-images
          path: release/build
      - name: Refuse anything the release key did not sign
        # The last check before the files are public, independent of how the
        # signing job got there: each image verifies against the release root
        # committed in keys/, for its own variant.
        run: |
          set -euo pipefail
          pip install cryptography
          for img in pico_w_release:release pico_w_alpha:alpha pico_w_air:air pico2_w_release:releasetwo; do
            python3 tools/ota_sign.py verify --in "release/build/${img%%:*}/firmware.bin" \
              --env "${img##*:}" --root-pub keys/ota_root_release.pub
          done
      - name: Manifest
        # The .uf2 is made from the signed .bin, trailer and all: the bytes
        # in flash end up the same whether the image arrives over USB or over
        # the air, and nothing on the USB path reads the trailer. The Pico 2
        # W's is its factory image: the partition table, then the signed update
        # with the trial flag cleared, which is what the boot ROM leaves in
        # flash once the update buys itself (tools/release_manifest.py).
        run: python3 tools/release_manifest.py --out release/ota --build-dir release/build
      - name: Language packs
        # The .lng packs live in the device's LittleFS, NOT in the firmware
        # image — so an OTA leaves the old ones in place and any label added in
        # this release stays English until somebody replaces them. Shipping
        # them here is the only way an operator can get the matching pair
        # without a checkout. Copied rather than globbed straight from data/ so
        # the asset list stays explicit.
        run: |
          set -euo pipefail
          mkdir -p release/ota
          cp data/lang/*.lng release/ota/
          ls -l release/ota/*.lng
      - name: Checksums
        # One file anyone can check a download against with `sha256sum -c`,
        # without a fleet manager or a JSON parser. manifest.json carries the
        # sha256 of the images for simut-rx; this covers the packs and the
        # manifest itself too.
        run: |
          set -euo pipefail
          cd release/ota
          sha256sum *.bin *.uf2 *.lng manifest.json > SHA256SUMS
          cat SHA256SUMS
      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/ota/*.bin
            release/ota/*.uf2
            release/ota/*.lng
            release/ota/manifest.json
            release/ota/SHA256SUMS
      - name: Attest build provenance
        # Ties every published file to this workflow run and the commit it
        # built (Sigstore, public-good instance). Anyone can check a download
        # with `gh attestation verify <file> --repo angeloINTJ/simut`. After the
        # upload on purpose: a failure here must not hold the images back.
        # Added 2026-10-01; first exercised by the next tag.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/ota/*.bin
            release/ota/*.uf2
            release/ota/*.lng
            release/ota/manifest.json
            release/ota/SHA256SUMS
